<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R-MH District Review Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F2E8;
    --paper-card:#FBF9F2;
    --ink:#152538;
    --ink-soft:#3A4A5C;
    --blue:#2C5A87;
    --blue-dim:#5C7C99;
    --rule:#D9D2BC;
    --rule-dark:#B9B092;
    --pass:#3E7A5A;
    --pass-bg:#E1EEE5;
    --fail:#AE4429;
    --fail-bg:#F4E2DC;
    --pending:#B5842A;
    --pending-bg:#F3E7CE;
    --na:#83807A;
    --na-bg:#E7E5DE;
    --sidebar-w:280px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    font-size:14px;
    line-height:1.5;
    display:flex;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:var(--sidebar-w);
    flex-shrink:0;
    background:var(--ink);
    color:#EDE9DA;
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .titleblock{
    padding:22px 20px 16px 20px;
    border-bottom:1px solid rgba(237,233,218,0.18);
  }
  .titleblock .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.14em;
    color:#8FAFC9;
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .titleblock h1{
    font-size:18px;
    line-height:1.28;
    margin:0 0 4px 0;
    font-weight:600;
    color:#FFFFFF;
  }
  .titleblock .sub{
    font-size:11.5px;
    color:#9FB2C4;
  }

  .project-fields{
    padding:16px 20px;
    border-bottom:1px solid rgba(237,233,218,0.18);
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .project-fields label{
    display:block;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:#8FAFC9;
    margin-bottom:3px;
    font-family:'IBM Plex Mono',monospace;
  }
  .project-fields input{
    width:100%;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(237,233,218,0.22);
    border-radius:3px;
    color:#EDE9DA;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:12.5px;
    padding:6px 8px;
  }
  .project-fields input::placeholder{color:#66768A;}
  .project-fields input:focus{outline:none;border-color:var(--blue-dim);background:rgba(255,255,255,0.1);}

  .district-conditions{
    padding:14px 20px 16px 20px;
    border-bottom:1px solid rgba(237,233,218,0.18);
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .district-conditions .dc-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:#8FAFC9;
    margin-bottom:2px;
  }
  .dc-check{
    display:flex;
    align-items:flex-start;
    gap:8px;
    cursor:pointer;
  }
  .dc-check input{
    margin-top:2px;
    accent-color:var(--blue-dim);
    cursor:pointer;
    flex-shrink:0;
  }
  .dc-check span{
    font-size:11.5px;
    line-height:1.4;
    color:#C7D2DC;
  }
  .dc-check span b{color:#EDE9DA;}

  nav.tabs{
    padding:14px 12px;
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .tab-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:none;
    border:none;
    color:#C7D2DC;
    text-align:left;
    padding:10px 10px;
    border-radius:4px;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13px;
    cursor:pointer;
    transition:background .12s ease;
  }
  .tab-btn:hover{background:rgba(255,255,255,0.06);}
  .tab-btn.active{background:var(--blue);color:#fff;}
  .tab-btn .tname{display:flex;flex-direction:column;gap:1px;}
  .tab-btn .tsec{font-size:10px;font-family:'IBM Plex Mono',monospace;opacity:0.72;letter-spacing:.04em;}
  .tab-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    background:rgba(255,255,255,0.12);
    padding:2px 6px;
    border-radius:10px;
    min-width:34px;
    text-align:center;
  }
  .tab-btn.active .tab-count{background:rgba(255,255,255,0.25);}

  .ruler-block{
    margin-top:auto;
    padding:16px 20px 20px 20px;
    border-top:1px solid rgba(237,233,218,0.18);
  }
  .ruler-label{
    display:flex;
    justify-content:space-between;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:#9FB2C4;
    margin-bottom:6px;
  }
  .ruler{
    position:relative;
    height:14px;
    border:1px solid rgba(237,233,218,0.3);
    border-radius:2px;
    overflow:hidden;
    background:rgba(255,255,255,0.05);
  }
  .ruler-fill{
    position:absolute;left:0;top:0;bottom:0;
    background:linear-gradient(90deg,#3E7A5A,#5C9C77);
    width:0%;
    transition:width .25s ease;
  }
  .ruler-ticks{
    position:absolute;inset:0;
    background-image:repeating-linear-gradient(90deg, rgba(21,37,56,0.55) 0 1px, transparent 1px 10%);
  }
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:6px 10px;
    margin-top:12px;
  }
  .legend-item{
    display:flex;align-items:center;gap:5px;
    font-size:10.5px;color:#B7C3CE;
    font-family:'IBM Plex Mono',monospace;
  }
  .swatch{width:9px;height:9px;border-radius:2px;display:inline-block;}

  .session-block{
    padding:16px 20px 20px 20px;
    border-top:1px solid rgba(237,233,218,0.18);
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .session-warning{
    font-size:10.5px;
    line-height:1.45;
    color:#B5842A;
    background:rgba(181,132,42,0.14);
    border:1px solid rgba(181,132,42,0.35);
    border-radius:4px;
    padding:8px 9px;
    margin-bottom:2px;
  }
  .session-btn{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:12px;
    font-weight:600;
    padding:8px 12px;
    border-radius:4px;
    border:1px solid rgba(237,233,218,0.3);
    background:rgba(255,255,255,0.06);
    color:#EDE9DA;
    cursor:pointer;
    width:100%;
    text-align:center;
  }
  .session-btn:hover{background:rgba(255,255,255,0.12);}
  .session-btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
  .session-btn.primary:hover{background:#356E9D;}

  /* ---------- Main ---------- */
  #main{
    flex:1;
    min-width:0;
    padding:28px 40px 80px 40px;
    max-width:980px;
  }
  .panel-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:6px;
    padding-bottom:16px;
    border-bottom:2px solid var(--ink);
  }
  .panel-head h2{
    font-size:21px;
    margin:0 0 4px 0;
    font-weight:600;
  }
  .panel-head p{
    margin:0;
    font-size:12.5px;
    color:var(--ink-soft);
    max-width:60ch;
  }
  .panel-tools{
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
  }
  .search-box{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:12.5px;
    padding:7px 10px;
    border:1px solid var(--rule-dark);
    border-radius:4px;
    background:#fff;
    min-width:170px;
  }
  .filter-chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    padding:6px 10px;
    border-radius:14px;
    border:1px solid var(--rule-dark);
    background:#fff;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .filter-chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .export-btn{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:12px;
    font-weight:600;
    padding:7px 13px;
    border-radius:4px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:#fff;
    cursor:pointer;
  }
  .export-btn:hover{background:var(--blue);border-color:var(--blue);}
  .export-btn.secondary{background:#fff;color:var(--ink);}
  .export-btn.secondary:hover{background:var(--paper-card);}

  .stat-strip{
    display:flex;
    gap:16px;
    margin:16px 0 20px 0;
    flex-wrap:wrap;
  }
  .stat{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    padding:5px 10px;
    border-radius:4px;
    display:flex;
    gap:6px;
    align-items:center;
    border:1px solid var(--rule);
    background:#fff;
  }
  .stat b{font-size:13px;}

  /* Article cards */
  .card{
    background:var(--paper-card);
    border:1px solid var(--rule);
    border-left:4px solid var(--rule-dark);
    border-radius:5px;
    margin-bottom:12px;
    padding:16px 18px;
    transition:border-left-color .15s ease;
  }
  .card[data-status="Pass"]{border-left-color:var(--pass);}
  .card[data-status="Fail"]{border-left-color:var(--fail);}
  .card[data-status="Pending Info"]{border-left-color:var(--pending);}
  .card[data-status="N/A"]{border-left-color:var(--na);}

  .card-top{
    display:flex;
    justify-content:space-between;
    gap:14px;
    align-items:flex-start;
  }
  .card-id{
    display:flex;
    gap:10px;
    align-items:baseline;
    min-width:0;
  }
  .sec-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    font-weight:600;
    color:var(--blue);
    background:#fff;
    border:1px solid var(--blue-dim);
    border-radius:3px;
    padding:2px 7px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .card h3{
    font-size:14.5px;
    margin:0;
    font-weight:600;
    color:var(--ink);
  }
  .card .summary{
    margin:9px 0 0 0;
    font-size:12.8px;
    color:var(--ink-soft);
    line-height:1.55;
  }
  .use-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--blue);
  }

  .status-row{
    display:flex;
    gap:6px;
    margin-top:12px;
    flex-wrap:wrap;
    align-items:center;
  }
  .status-pill{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    padding:5px 11px;
    border-radius:13px;
    border:1px solid var(--rule-dark);
    background:#fff;
    cursor:pointer;
    color:var(--ink-soft);
    transition:all .1s ease;
  }
  .status-pill:hover{border-color:var(--ink);}
  .status-pill.sel-pass{background:var(--pass);border-color:var(--pass);color:#fff;}
  .status-pill.sel-fail{background:var(--fail);border-color:var(--fail);color:#fff;}
  .status-pill.sel-pending{background:var(--pending);border-color:var(--pending);color:#fff;}
  .status-pill.sel-na{background:var(--na);border-color:var(--na);color:#fff;}

  .notes-toggle{
    margin-left:auto;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--blue);
    cursor:pointer;
    background:none;
    border:none;
    text-decoration:underline;
    padding:4px;
  }
  .notes-area{
    display:none;
    margin-top:10px;
  }
  .notes-area.open{display:block;}
  .notes-area textarea{
    width:100%;
    min-height:56px;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:12.5px;
    padding:8px 10px;
    border:1px solid var(--rule-dark);
    border-radius:4px;
    resize:vertical;
    background:#fff;
  }
  .notes-area textarea:focus{outline:none;border-color:var(--blue);}

  .proposed-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    cursor:pointer;
    padding:5px 10px;
    border:1px solid var(--rule-dark);
    border-radius:13px;
    background:#fff;
  }
  .proposed-toggle input{accent-color:var(--blue);}
  .proposed-toggle.checked{background:#EAF0F6;border-color:var(--blue-dim);color:var(--blue);}

  .use-select-wrap{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .use-select{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:12.5px;
    padding:7px 10px;
    border:1px solid var(--blue-dim);
    border-radius:4px;
    background:#EAF0F6;
    color:var(--ink);
    min-width:220px;
    cursor:pointer;
  }
  .use-select-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--blue);
    white-space:nowrap;
  }
  .remove-use-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--fail);
    background:#fff;
    border:1px solid var(--fail);
    border-radius:13px;
    padding:4px 10px;
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
  }
  .remove-use-btn:hover{background:var(--fail-bg);}

  .empty-state{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
    font-size:13px;
  }

  /* Instructions panel */
  .instr-block{
    background:var(--paper-card);
    border:1px solid var(--rule);
    border-radius:5px;
    padding:20px 22px;
    margin-bottom:16px;
  }
  .instr-block h3{
    margin:0 0 10px 0;
    font-size:14px;
    color:var(--blue);
    font-family:'IBM Plex Mono',monospace;
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .instr-block ol, .instr-block ul{margin:0;padding-left:20px;}
  .instr-block li{margin-bottom:7px;font-size:13px;color:var(--ink-soft);}
  .instr-block p{font-size:13px;color:var(--ink-soft);margin:0 0 8px 0;}
  .legend-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:8px;
    margin-top:8px;
  }
  .legend-card{
    display:flex;align-items:center;gap:8px;
    padding:8px 10px;
    border-radius:4px;
    font-size:12px;
  }

  .toast{
    position:fixed;
    bottom:20px;
    right:20px;
    background:var(--ink);
    color:#fff;
    padding:9px 16px;
    border-radius:5px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    opacity:0;
    transform:translateY(8px);
    transition:all .2s ease;
    pointer-events:none;
    z-index:50;
  }
  .toast.show{opacity:1;transform:translateY(0);}

  @media (max-width:860px){
    body{flex-direction:column;}
    #sidebar{position:relative;width:100%;height:auto;}
    #main{padding:20px;max-width:100%;}
  }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="titleblock">
    <div class="eyebrow">Land Use Bylaw 1P2007</div>
    <h1>R-MH District Review Checklist</h1>
    <div class="sub">Residential &ndash; Manufactured Home &middot; Development Permit review</div>
  </div>

  <div class="project-fields">
    <div>
      <label for="f-projnum">Project number</label>
      <input id="f-projnum" type="text" placeholder="e.g. 26.93">
    </div>
    <div>
      <label for="f-name">Project name</label>
      <input id="f-name" type="text" placeholder="e.g. Sunset Manufactured Home Park">
    </div>
    <div>
      <label for="f-addr">Site address / legal desc.</label>
      <input id="f-addr" type="text" placeholder="Address or plan/block/lot">
    </div>
    <div>
      <label for="f-file">DP / file no.</label>
      <input id="f-file" type="text" placeholder="DP2026-xxxxx">
    </div>
    <div>
      <label for="f-reviewer">Reviewer</label>
      <input id="f-reviewer" type="text" placeholder="Name">
    </div>
  </div>

  <nav class="tabs" id="tabnav"></nav>

  <div class="ruler-block">
    <div class="ruler-label"><span>OVERALL PROGRESS</span><span id="overall-pct">0%</span></div>
    <div class="ruler">
      <div class="ruler-ticks"></div>
      <div class="ruler-fill" id="overall-fill"></div>
    </div>
    <div class="legend">
      <span class="legend-item"><span class="swatch" style="background:var(--pass)"></span>Pass</span>
      <span class="legend-item"><span class="swatch" style="background:var(--fail)"></span>Fail</span>
      <span class="legend-item"><span class="swatch" style="background:var(--pending)"></span>Pending</span>
      <span class="legend-item"><span class="swatch" style="background:var(--na)"></span>N/A</span>
    </div>
  </div>

  <div class="session-block">
    <div class="session-warning">Nothing autosaves. Export a session file before closing this tab, and import it next time to pick up where you left off.</div>
    <button class="session-btn primary" id="btn-export">Export session (.csv)</button>
    <button class="session-btn" id="btn-import">Import session (.csv)</button>
    <input type="file" id="file-import" accept=".csv,text/csv" style="display:none">
  </div>
</aside>

<main id="main"></main>

<div class="toast" id="toast">Saved</div>

<script>
const CHECKLIST_DATA = {"part5div1": [{"id": "d1-0", "sec": "334", "title": "Projections Into Setback Areas", "summary": "Buildings generally can't sit in a setback area. Above-grade portions may project only per the specific rules in this Part. Below-grade portions may extend without limit except into the required front setback. Patios and wheelchair ramps may project without limit. Signs in a setback must comply with Part 3, Division 5. EXEMPT FOR R-MH — District tab §517 disapplies sections 334, 335, 336, 337 and 338 entirely to buildings in the Residential – Manufactured Home District; confirm §517 before relying on items d1-0 through d1-4."}, {"id": "d1-1", "sec": "335", "title": "Length of Portions of a Building in Setback Areas", "summary": "On each storey, the total combined length of all projections into any setback area must not exceed 40.0% of the façade length; max. length of an individual projection is 3.1 m. Exempt from these two limits: decks/eaves/porches (§336, §339.1), ramps, stairs; and a private garage attached to the main residential building when in the rear setback. EXEMPT FOR R-MH — see §517 (District tab)."}, {"id": "d1-2", "sec": "336", "title": "Projections Into Front Setback Area", "summary": "Bay windows/eaves: max. 0.6 m (unless subsection 6). Landings/ramps (non-wheelchair)/stairs may project if they access the main/lower floor and the landing area is ≤2.5 m². Window wells: no limit. In the Developed Area a porch may project max. 1.8 m if it forms a Dwelling Unit entry, meets the district front setback, has a platform height ≤1.2 m (excl. stairs/landing ≤2.5 m²), and is unenclosed other than by a railing/balustrade/attached-unit privacy wall. Eaves may project an additional 0.6 m from such a porch. EXEMPT FOR R-MH — see §517 (District tab)."}, {"id": "d1-3", "sec": "337", "title": "Projections Into Side Setback Area", "summary": "Portions ≥2.4 m above grade: max. 0.6 m. Portions <2.4 m above grade: max. 0.6 m, generally on a corner parcel, where one side setback is clear to 2.4 m, or where a private maintenance easement occupies the area (a Contextual Semi-detached/Semi-detached Dwelling is limited to the street side of a corner parcel — neither is a listed use in R-MH). Window wells: max. 0.8 m, and (with other projections except eaves) can't enter a 3.0 m laneless-parcel side setback. Eaves: max. 0.6 m. Landings/ramps/stairs allowed under the same tests as the front setback. Other projections must stay ≥0.9 m from the nearest front façade. Balconies/decks: none. Central A/C: max. 1.0 m. EXEMPT FOR R-MH — see §517 (District tab)."}, {"id": "d1-4", "sec": "338", "title": "Projections Into Rear Setback Area", "summary": "Stairs, A/C equipment, window wells: no limit. Awnings, balconies, bay windows, canopies, chimneys, decks, eaves, fireplaces, fire escapes, landings, porches, ramps (non-wheelchair): max. 1.5 m. An attached private garage may project without limit if ≤4.6 m high, ≤75.0 m² GFA per Dwelling Unit, no part closer than 0.60 m to the rear line, no eave closer than 0.6 m to a side line; a balcony/deck on that garage needs ≥6.0 m from the rear line / ≥1.2 m from a side line. EXEMPT FOR R-MH — see §517 (District tab)."}, {"id": "d1-5", "sec": "338.1", "title": "Patios", "summary": "A privacy wall on a patio: max. 2.0 m from the patio surface generally; max. 2.0 m from grade if within a side setback or within 6.0 m of a rear line; max. 1.2 m from grade if between the foremost front façade and the front property line."}, {"id": "d1-6", "sec": "339", "title": "Decks", "summary": "Developing Area: deck height max. 0.3 m above main floor level. Developed Area: max. 1.5 m above grade (except at a walkout-basement at-grade entrance façade) and max. 0.3 m above main floor level. Privacy wall on a deck: max. 2.0 m from the deck surface, not between the foremost front façade and front line (unless subsection 3, which ties its stricter privacy-wall condition to a Contextual Semi-detached Dwelling, Semi-detached Dwelling, Rowhouse Building or Townhouse — none of these is a listed use in R-MH)."}, {"id": "d1-7", "sec": "339.1", "title": "Porches", "summary": "In the Developed Area, a porch is exempt from parcel coverage where it sits between the building façade and the front (or corner-side) property line, is unenclosed on ≥2 sides (except railing/balustrade/attached-unit privacy walls), and has no enclosed floor area/balcony directly above its roof."}, {"id": "d1-8", "sec": "340", "title": "Balconies", "summary": "Open balcony: max. 1.85 m projection from the façade. Recessed balcony: max. 10.0 m² floor area. Privacy wall on a balcony: max. 3.0 m high, not between the foremost front façade and front line. Subsection (3)'s stricter privacy-wall condition applies only to a Contextual Semi-detached Dwelling, Semi-detached Dwelling, Rowhouse Building or Townhouse — none of these is a listed use in R-MH."}, {"id": "d1-9", "sec": "341", "title": "Driveways", "summary": "No direct major-street access unless no practical alternative and a turning space is provided. Street-to-garage driveway: min. 6.0 m long, min. 6.0 m × 3.0 m rectangle. Lane-to-garage driveway: min. 0.60 m long. Within 6.0 m of a public sidewalk/curb: max. width 6.0 m (parcel ≤9.0 m wide) or 7.0 m (9.0 m to <15.0 m wide). Developed Area: a new/altered/replaced street driveway is restricted unless laneless, ≥50% of the block face already has street driveways, or it's legally existing and not relocated/widened (may be extended in length). The DA can't require removal of a legally existing street driveway even for a discretionary-use DP."}, {"id": "d1-10", "sec": "342", "title": "Retaining Walls", "summary": "Max. 1.2 m high (lowest to highest adjacent grade). Min. 1.0 m horizontal separation between retaining walls on the same parcel."}, {"id": "d1-11", "sec": "343", "title": "Fences", "summary": "Max. height above grade: 1.2 m between the foremost front façade of the main residential building and the front property line; 2.0 m elsewhere; 2.5 m at the highest point of a gate ≤2.5 m long."}, {"id": "d1-12", "sec": "343.1", "title": "Solar Collectors", "summary": "Wall/roof-mounted only. Roof pitch <4:12: max. 0.5 m projection within 5.0 m of a side property line (measured due south), else max. 1.3 m. Roof pitch ≥4:12: max. 1.3 m, can't overhang the roof edge. Wall-mounted: min. 2.4 m above grade; max. 1.5 m facing a rear line, else max. 0.6 m."}, {"id": "d1-13", "sec": "343.2", "title": "Skateboard and Sports Ramps", "summary": "Max. envelope 1.5 m high × 5.0 m wide × 6.0 m long (multiple structures may share it; at-grade surfaces excluded; safety railings may exceed it). One envelope per parcel, between the rear façade of the main residential building and the rear property line. Min. 1.2 m from side and rear property lines. Excluded from parcel coverage. Can't be attached to a deck, structure, fence, or building (including an Accessory Residential Building)."}, {"id": "d1-14", "sec": "344", "title": "Objects Prohibited or Restricted", "summary": "Subsections (1)-(3) and (7) deleted. (4) A large vehicle may remain on a parcel only while actively loading/unloading (max. one at a time). (5)/(6) A satellite dish >1.0 m diameter: not in an actual front/street-side setback, max. 3.0 m high from grade, not illuminated (DA may relax if compliance would block signal reception and siting/screening is acceptable). (8) A Power Generation Facility – Small >100 kW can't be sited where the principal use on the parcel is a Contextual Single Detached, Contextual Semi-detached, Duplex, Single Detached, or Semi-detached Dwelling — none of these is R-MH's principal use, so this specific capacity restriction does not catch R-MH's own discretionary Power Generation Facility – Small use (District tab §508(d)); confirm siting/capacity directly regardless."}, {"id": "d1-15", "sec": "345", "title": "Accessory Residential Building", "summary": "Min. setback: 1.2 m from a side/rear line shared with a street, else 0.6 m (reducible to 0 m if <10.0 m² GFA with a maintenance-free wall and no eave overhang, or a registered 1.5 m private maintenance easement with a 0.60 m eave/footing allowance). Can't sit in the actual front setback. On a laneless parcel a private garage may sit within the 3.0 m side setback except on the street side of a corner parcel. Min. 1.0 m separation from the main residential building if ≥10.0 m² — see also District tab §521's Manufactured-Home-specific restatement of this 1.0 m figure. Max. height: 4.6 m (finished floor to peak), 3.0 m at the eaveline, or one storey (may include a ladder-accessed, windowless storage attic, max. 1.5 m floor-to-rafter)."}, {"id": "d1-16", "sec": "346", "title": "Restrictions on Use of Accessory Residential Building", "summary": "Finished floor (other than a private garage) max. 0.6 m above grade. Can't be used as a Dwelling Unit unless approved as a Backyard Suite (Backyard Suite is not a listed use in R-MH). No balcony or rooftop deck. Combined coverage of all such buildings on a parcel: max. the lesser of the main building(s) coverage or 75.0 m² per Dwelling Unit (buildings ≤10.0 m² cumulative GFA excluded). All roof drainage must discharge onto the same parcel."}, {"id": "d1-17", "sec": "346.1", "title": "General Landscaping Rules for the Developed Areas", "summary": "Required trees: new planting or preserved existing; provided within 12 months of the completion permit; maintained ≥24 months after; CNLA-standard species. The per-unit tree minimums in subsections (2)-(5) are set only for Contextual Semi-detached/Duplex/Rowhouse/Semi-detached Dwellings, Contextual Single Detached/Single Detached Dwellings, and Cottage Housing Cluster — none of these is a listed use in R-MH, so this section sets no specific tree-count minimum for a Manufactured Home or Manufactured Home Park; confirm directly with the Development Authority whether an equivalent landscaping standard is expected. '1.0 tree' = 60 mm-caliper deciduous or 2.0 m coniferous; '2.0 trees' = 85 mm-caliper deciduous or 4.0 m coniferous."}, {"id": "d1-18", "sec": "347", "title": "Contextual Single Detached Dwelling", "summary": "Design/façade rules for a Contextual Single Detached Dwelling (façade articulation or porch, garage/window/roof-slope tests, building-reference-point and heritage-area restrictions, balcony conditions, max. depth, coverage). Contextual Single Detached Dwelling is not a listed use in R-MH — typically N/A; confirm no such dwelling type is proposed."}, {"id": "d1-19", "sec": "347.1", "title": "Contextual Semi-detached Dwelling", "summary": "Design/façade rules for a Contextual Semi-detached Dwelling (staggered façades, façade articulation, corner-parcel entrance, garage/window/roof-slope tests, building-reference-point and heritage-area restrictions, balcony conditions, max. depth). Contextual Semi-detached Dwelling is not a listed use in R-MH — typically N/A; confirm no such dwelling type is proposed."}, {"id": "d1-20", "sec": "348", "title": "Visibility Setback", "summary": "Within a corner visibility triangle, buildings, fences, finished grade, and vegetation must not exceed 0.75 m above the lowest street elevation."}, {"id": "d1-21", "sec": "349", "title": "Roof Equipment Projection", "summary": "No vertical projection limit for antennae, chimneys, wind-powered attic ventilation devices. Mechanical equipment: max. 0.3 m projection from the roof surface."}, {"id": "d1-22", "sec": "350", "title": "Private Maintenance Easements", "summary": "Must be kept free of buildings, structures, and objects that would prevent or restrict the easement being used for building maintenance."}, {"id": "d1-23", "sec": "351", "title": "Secondary Suite", "summary": "Min. setback ≥ the main residential building's own setback; max. floor area (excl. stairways/landings) 100.0 m² in specific districts or on any parcel <13.0 m wide; no max. if wholly in a basement; DA may relax up to 10%; needs an outdoor private amenity space ≥7.5 m² (no dimension <1.5 m) except in R-CG. Secondary Suite is not a listed use in R-MH — typically N/A; confirm none is proposed."}, {"id": "d1-24", "sec": "352", "title": "Backyard Suite", "summary": "Min. rear setback 1.5 m (suite portion) / 0.6 m (private garage portion); min. side setback 1.2 m unless the district specifies otherwise; min. 5.0 m façade separation from the main residential building (reducible to 1.5 m with qualifying amenity space); limited projection allowances into the separation/setback areas; max. height 7.5 m (or a stepped-down height near a low-density-residential line); max. floor area 75.0 m² (relaxable 10%); needs an outdoor private amenity space ≥7.5 m² except in R-CG. Backyard Suite is not a listed use in R-MH — typically N/A; confirm none is proposed."}, {"id": "d1-25", "sec": "353/354", "title": "Accessory Suite – Density", "summary": "§353 deleted. §354: max. one Backyard Suite per parcel (unless subsection 4, an R-CG-only carve-out); max. one Secondary Suite per Dwelling Unit; a Secondary Suite and Backyard Suite can't share a parcel; neither may be severed from the main residential use by condo/subdivision registration. Neither Secondary Suite nor Backyard Suite is a listed use in R-MH — typically N/A."}, {"id": "d1-26", "sec": "355/356", "title": "Secondary Suite – Entry/Stairways & Building Height", "summary": "Both deleted — no current requirement."}, {"id": "d1-27", "sec": "357", "title": "Parcels Deemed Conforming", "summary": "A legally existing/pre-Bylaw-approved parcel below the district's min. width/depth/area is deemed conforming provided use isn't intensified. A parcel legally existing, or subdivision-approved between August 6, 2024 and August 4, 2026, is deemed conforming regardless — confirm these dates against the current consolidated bylaw."}, {"id": "d1-28", "sec": "358", "title": "Dwellings Deemed Conforming", "summary": "(1) Legally existing/pre-Bylaw decks >1.5 m high, landings, retaining walls, and window wells are deemed conforming — general, may apply to R-MH. (2)-(6) carry over as-built height/setback/depth for a legally-built Contextual Semi-detached/Contextual Single Detached/Duplex/Semi-detached/Single Detached Dwelling — none of these is a listed use in R-MH, so these subsections are typically N/A. (7) Any development/use legally existing/approved before August 4, 2026 is deemed conforming — general, may apply to R-MH."}, {"id": "d1-29", "sec": "359", "title": "Personal Sales", "summary": "Permitted a total of 8 days per calendar year on a parcel."}, {"id": "d1-30", "sec": "360", "title": "Building Height", "summary": "Height-plane test (front-to-rear building-reference-point difference triggers either a stepped-down or straight height plane, capped at max. height +1.0 m) applies only to a Contextual Semi-detached, Contextual Single Detached, Duplex, Semi-detached, or Single Detached Dwelling — none of these is a listed use in R-MH. R-MH instead has its own flat 5.0 m maximum building height at District tab §518 — typically N/A here."}, {"id": "d1-31", "sec": "361", "title": "Building Height on a Corner Parcel", "summary": "Adds a corner-parcel height-plane cap on top of §360, for the same Dwelling types listed there — none of which is a listed use in R-MH. Typically N/A; R-MH's own flat 5.0 m height limit is at District tab §518."}, {"id": "d1-32", "sec": "362", "title": "Deleted", "summary": "Deleted — no current requirement."}, {"id": "d1-33", "sec": "363", "title": "Approved Building Grade Plans", "summary": "All building reference points must be in accordance with an approved building grade plan."}, {"id": "d1-34", "sec": "364", "title": "Gated Access", "summary": "A gate must not be located across a private condominium roadway — potentially relevant to gated access along an internal road within a Manufactured Home Park."}, {"id": "d1-35", "sec": "365", "title": "Exempt Additions", "summary": "Conditions for the §25(2)(a) minor-addition exemption (existing-building compliance, max. addition size, limited setback-reduction allowances) apply only to an addition on an existing Duplex Dwelling, Semi-detached Dwelling or Single Detached Dwelling — none of these is a listed use in R-MH. Typically N/A; confirm any addition to a Manufactured Home directly against District tab §509–§521."}, {"id": "d1-36", "sec": "365.1", "title": "Cottage Housing Cluster", "summary": "Design/dimensional rules for a Cottage Housing Cluster (building separation, unit cap, GFA caps, private/common amenity space, setback exemptions, parking access). Cottage Housing Cluster is not a listed use in R-MH — typically N/A; confirm none is proposed."}], "part5div10": [{"id": "d10-0", "sec": "506", "title": "Purpose", "summary": "R-MH accommodates existing and new residential development in the form of Manufactured Home Parks and Manufactured Homes, in both the Developed Area and the Developing Area. Per §506(2), a parcel should be designated R-MH for a Manufactured Home Park only where its area is between 8.0 ha and 16.0 ha — areas greater than 16.0 ha or less than 8.0 ha should not receive this designation (consistent with the 8.0–16.0 ha Manufactured Home Park area range set at District tab §522(1)). (Informational — useful for discretionary-use judgment calls.)"}, {"id": "d10-1", "sec": "507", "title": "Permitted Uses", "summary": "Permitted — 8 uses with no condition (see Use tab): Accessory Residential Building, Home Based Child Care – Class 1, Home Occupation – Class 1, Manufactured Home, Park, Protective and Emergency Service, Sign – Class A, Utilities. (g) deleted. No conditional/building-status flip applies to any of these — every one is flatly permitted."}, {"id": "d10-2", "sec": "508", "title": "Discretionary Uses", "summary": "Discretionary — 9 uses with no condition (see Use tab): Community Entrance Feature, Home Occupation – Class 2, Manufactured Home Park, Power Generation Facility – Small, Sign – Class B, Sign – Class C, Sign – Class E, Temporary Residential Sales Centre, Utility Building. No conditional/building-status flip applies to any of these — every one is flatly discretionary."}, {"id": "d10-3", "sec": "509", "title": "Rules — Cross-References", "summary": "Confirms all R-MH uses must also meet: the General Rules for Low Density Residential Land Use Districts referenced in Part 5, Division 1 (General tab); the Rules Governing All Districts referenced in Part 3 (Citywide tab); and the applicable Uses And Use Rules referenced in Part 4 (Use tab)."}, {"id": "d10-4", "sec": "510", "title": "Density", "summary": "Max. density for a Manufactured Home on an individual parcel is one unit per parcel."}, {"id": "d10-5", "sec": "511", "title": "Parcel Width", "summary": "Min. parcel width is 9.8 m."}, {"id": "d10-6", "sec": "512", "title": "Parcel Frontage", "summary": "Min. frontage on an internal roadway is 9.0 m."}, {"id": "d10-7", "sec": "513", "title": "Parcel Area", "summary": "Min. area of a parcel is 270.0 m²."}, {"id": "d10-8", "sec": "514", "title": "Parcel Coverage", "summary": "Max. parcel coverage is 45.0% of the area of the parcel, reduced by 21.0 m² for each required motor vehicle parking stall not located in a private garage."}, {"id": "d10-9", "sec": "515", "title": "Building Setback Areas", "summary": "The depth of all setback areas must equal the min. building setback required by §516."}, {"id": "d10-10", "sec": "516", "title": "Building Setbacks from a Property Line", "summary": "Min. building setback for a Manufactured Home on an individual parcel: 3.0 m from a front property line; 1.2 m from any side property line; 3.0 m from a rear property line."}, {"id": "d10-11", "sec": "517", "title": "Projections into Setback Areas", "summary": "Sections 334, 335, 336, 337 and 338 (General tab — the five setback-projection rules for front/side/rear and their length limits) do not apply to buildings in R-MH. This is a district-wide exemption, not use-specific — see the EXEMPT FOR R-MH flags on General tab items d1-0 through d1-4."}, {"id": "d10-12", "sec": "518", "title": "Building Height", "summary": "Max. building height is 5.0 m."}, {"id": "d10-13", "sec": "519", "title": "Outdoor Private Amenity Space", "summary": "(1) Each Manufactured Home must have an outdoor private amenity space: min. 42.0 m² area, no dimension <3.6 m, provided immediately contiguous to the main entrance of the Manufactured Home. (2) Can't be used for motor vehicle parking stalls or contain an Accessory Residential Building."}, {"id": "d10-14", "sec": "520", "title": "Manufactured Home Installation", "summary": "A Manufactured Home, whether on an individual parcel or within a Manufactured Home Park, must: (a) be fixed to a permanent foundation or blocked and anchored on the parcel; (b) be skirted; and (c) have the hitch removed or skirted."}, {"id": "d10-15", "sec": "521", "title": "Accessory Residential Building", "summary": "Min. separation distance between the façades of an Accessory Residential Building and a Manufactured Home is 1.0 m — restates, for this district, the 1.0 m main-residential-building separation figure at General tab §345(5)."}, {"id": "d10-16", "sec": "522", "title": "Manufactured Home Park", "summary": "(1) Min. area of a parcel used for a Manufactured Home Park is 8.0 ha; max. 16.0 ha. (2) Each Manufactured Home in a Park must: (a) sit entirely within an approved-site-plan Manufactured Home site; (b) be on a site abutting an internal road, min. 4.3 m wide; (c) have a private driveway with direct access to an internal road; (d) sit on a site clearly marked by permanent flush stakes/markers; (e) be addressed with a number; (f) sit on a site min. 240.0 m² area, min. mean width 9.0 m; and (g) sit on a concrete/asphalt pad min. 5.0 m from any adjacent pad for another Manufactured Home, min. 3.0 m from any property line, min. 3.0 m from any internal road, and min. 15.0 m from a pad/permanent building across an internal roadway. (3) Street lighting required. (4) All buildings in a Park: min. 3.0 m setback from an internal road, street, or a parcel not designated R-MH. (5) All undeveloped/unoccupied Park area must be landscaped. (6) Min. 10.0% of total Park area for resident recreational use."}, {"id": "d10-17", "sec": "523", "title": "Garbage", "summary": "(1) For a Manufactured Home Park, garbage/waste must be stored, before collection, inside a building or in a DA-approved garbage container enclosure. (2) A garbage container enclosure: not in an actual front setback area; not in an actual side setback area on the public-street side of a corner parcel; and (unless (3) applies) not in any setback area. (3) An enclosure may sit in a setback area if its walls are maintenance-free materials and no eaves overhang an adjacent parcel/lane."}, {"id": "d10-18", "sec": "524", "title": "Recycling Facilities", "summary": "Recycling facilities must be provided for a Manufactured Home Park."}], "part3": [{"id": "p3-0", "sec": "53", "title": "Public Realm Setbacks", "summary": "Check Table 1 in this section for the specific street the parcel fronts. If listed, a Required Setback applies IN ADDITION to the district's own front/side/rear setback, and the Development Authority cannot relax it."}, {"id": "p3-1", "sec": "54", "title": "Airport Vicinity Regulations", "summary": "If the parcel falls within an Airport Vicinity Protection Area (noise/height contours around Calgary Intl. or Springbank), additional height, noise-attenuation construction, and use restrictions apply. Confirm against the current AVPA maps/bylaw."}, {"id": "p3-2", "sec": "55", "title": "Floodway, Flood Fringe & Overland Flow — Applicability", "summary": "Confirm whether the parcel is mapped within a Floodway, Flood Fringe, or Overland Flow Area (City flood hazard mapping)."}, {"id": "p3-3", "sec": "56", "title": "Floodway Regulations", "summary": "If in the Floodway: new development is heavily restricted — confirm what, if anything, is permitted."}, {"id": "p3-4", "sec": "57", "title": "New Buildings and Alterations", "summary": "If in the Flood Fringe: specific construction/flood-proofing requirements for new buildings and alterations."}, {"id": "p3-5", "sec": "58", "title": "Alterations to the Floodway and Riverbanks", "summary": "Special review requirements for any riverbank or floodway alteration work."}, {"id": "p3-6", "sec": "61", "title": "Building Design in the Overland Flow Area", "summary": "Specific design requirements if the parcel is within a mapped overland flow area."}, {"id": "p3-7", "sec": "62", "title": "Lighting Requirements", "summary": "General exterior lighting standards apply to the site."}, {"id": "p3-8", "sec": "63", "title": "Shielding", "summary": "Light fixtures must be shielded to control glare and light spill, particularly toward adjoining residential parcels."}, {"id": "p3-9", "sec": "64", "title": "Mounting of Fixtures", "summary": "Requirements for how/where lighting fixtures are mounted."}, {"id": "p3-10", "sec": "65", "title": "Height Limits (Lighting)", "summary": "Maximum height restrictions on lighting fixtures/poles."}, {"id": "p3-11", "sec": "66", "title": "Canopy Lighting", "summary": "Specific rules for lighting under canopies. R-MH has no canopy-generating use in its permitted/discretionary list (no Drive Through, Gas Bar) — typically N/A."}, {"id": "p3-12", "sec": "67-72", "title": "Signs — Purpose, Classification, DP Requirements", "summary": "All signs are classified Class A–G. Confirm a DP is required (most are) and whether a Comprehensive Sign Program applies to the site."}, {"id": "p3-13", "sec": "73-76", "title": "General Sign Rules, Digital Displays, Maintenance", "summary": "General construction/safety/illumination standards for all signs; extra rules if any sign has a digital display; ongoing maintenance obligation; rules for parcels sharing signage under a related function."}, {"id": "p3-14", "sec": "77-90", "title": "Class A Signs (permitted use in R-MH)", "summary": "Includes Address, Art, Banner, Construction, Directional, Flag, Pedestrian, Real Estate, Special Event, Show Home, Temporary, and Window sign sub-rules. Check whichever sub-types are proposed."}, {"id": "p3-15", "sec": "91-93", "title": "Class B Signs (discretionary use in R-MH)", "summary": "Designated signable area/location rules and fascia sign rules."}, {"id": "p3-16", "sec": "94-97", "title": "Class C Signs (discretionary use in R-MH) — Freestanding Sign", "summary": "Freestanding sign rules: number allowed, size and height restrictions. Confirm the applicable general standard directly — R-MH has no district-specific override in this division."}, {"id": "p3-17", "sec": "98-102", "title": "Class D Signs — Not a Listed Use in R-MH", "summary": "Canopy/projecting sign rules. Sign – Class D is not in R-MH's permitted or discretionary use list — confirm no Class D signage is proposed."}, {"id": "p3-18", "sec": "103-109", "title": "Class E Signs (discretionary use in R-MH)", "summary": "Includes Inflatable Sign, Painted Wall Sign, Rotating Sign, Temporary Sign Marker sub-rules."}, {"id": "p3-19", "sec": "111-115.5", "title": "Class F/G — Not a Listed Use in R-MH", "summary": "Third Party Advertising Sign rules. Sign – Class F and Class G are not in R-MH's permitted or discretionary use list — confirm no Class F/G signage is proposed."}, {"id": "p3-20", "sec": "116", "title": "Parking — General Rules", "summary": "Baseline rules governing all required parking/loading."}, {"id": "p3-21", "sec": "117", "title": "Parking Stall Signage", "summary": "Signage requirements for parking stalls (e.g., accessible stalls)."}, {"id": "p3-22", "sec": "118", "title": "Location of Parking and Loading Requirements", "summary": "Where parking/loading areas may be sited on the parcel relative to setbacks, streets, and buildings."}, {"id": "p3-23", "sec": "119", "title": "Use of Parking and Loading Stalls", "summary": "Restrictions on how required stalls may be used (can't be used for storage, sales display, etc.)."}, {"id": "p3-24", "sec": "120", "title": "Identification of Required Parking/Loading Stalls", "summary": "How required stalls must be marked/identified on-site and on drawings."}, {"id": "p3-25", "sec": "121", "title": "Calculation of Minimum Parking/Loading Stalls", "summary": "R-MH has no dedicated Motor Vehicle Parking Stall district-rules section — its ratios instead sit directly in the Manufactured Home (§227(c): min. 1.0 stall per Dwelling Unit) and Manufactured Home Park (§228(c)/(d): min. 1.0 stall + min. 0.1 visitor stall per Manufactured Home) use definitions on the Use tab. This citywide section is the general calculation mechanism only."}, {"id": "p3-26", "sec": "122", "title": "Standards for Motor Vehicle Parking Stalls", "summary": "Stall/aisle dimensions and layout standards."}, {"id": "p3-27", "sec": "123", "title": "Loading Stalls", "summary": "Required loading stall size and count standards. Typically N/A for R-MH's residential uses — confirm for any non-residential discretionary use proposed."}, {"id": "p3-28", "sec": "124", "title": "Relaxations of Parking/Loading Requirements", "summary": "Circumstances where the Development Authority may relax parking/loading counts."}, {"id": "p3-29", "sec": "124.1", "title": "Parking Stall Exemptions", "summary": "Specific exemptions from providing required parking stalls."}, {"id": "p3-30", "sec": "125", "title": "Bicycle Parking Stalls", "summary": "R-MH's own use definitions explicitly turn this off for its two primary residential uses — Manufactured Home (§227(d)) and Manufactured Home Park (§228(e)) both state no Class 1/2 bicycle parking stalls are required. Typically N/A; confirm for any other use proposed."}, {"id": "p3-31", "sec": "126", "title": "Motor Vehicle Pick-Up and Drop-Off Stalls", "summary": "R-MH has no Drive Through or similar pick-up/drop-off use in its permitted/discretionary list — typically N/A."}, {"id": "p3-32", "sec": "129.1", "title": "Infrastructure Requirements", "summary": "The Development Authority must confirm adequate sewage collection/treatment/disposal, water supply/treatment/distribution, stormwater collection/storage, and road infrastructure capacity to serve the development."}], "part4": [{"id": "p4-0", "sec": "138", "title": "Accessory Residential Building", "summary": "Permitted — 507(a)"}, {"id": "p4-1", "sec": "206.1", "title": "Home Based Child Care – Class 1", "summary": "Permitted — 507(a.1)"}, {"id": "p4-2", "sec": "207", "title": "Home Occupation – Class 1", "summary": "Permitted — 507(b)"}, {"id": "p4-3", "sec": "227", "title": "Manufactured Home", "summary": "Permitted — 507(c). Requires min. 1.0 motor vehicle parking stall per Dwelling Unit (§227(c)); no Class 1/2 bicycle parking stalls required (§227(d)). Max. one unit per individual parcel — see District tab §510."}, {"id": "p4-4", "sec": "249", "title": "Park", "summary": "Permitted — 507(d)"}, {"id": "p4-5", "sec": "270", "title": "Protective and Emergency Service", "summary": "Permitted — 507(e)"}, {"id": "p4-6", "sec": "299", "title": "Sign – Class A", "summary": "Permitted — 507(f)"}, {"id": "p4-7", "sec": "321", "title": "Utilities", "summary": "Permitted — 507(h)"}, {"id": "p4-8", "sec": "168", "title": "Community Entrance Feature", "summary": "Discretionary — 508(a)"}, {"id": "p4-9", "sec": "208", "title": "Home Occupation – Class 2", "summary": "Discretionary — 508(b)"}, {"id": "p4-10", "sec": "228", "title": "Manufactured Home Park", "summary": "Discretionary — 508(c). Must provide on-site laundry and recreation facilities, and administration facilities for management; may have buildings for recreational activities (§228(a)). Requires min. 1.0 motor vehicle parking stall + min. 0.1 visitor parking stall per Manufactured Home on the parcel (§228(c)/(d)); no Class 1/2 bicycle parking stalls required (§228(e)). Min./max. parcel area 8.0/16.0 ha and detailed site/pad standards — see District tab §522."}, {"id": "p4-11", "sec": "266", "title": "Power Generation Facility – Small", "summary": "Discretionary — 508(d)"}, {"id": "p4-12", "sec": "300", "title": "Sign – Class B", "summary": "Discretionary — 508(e)"}, {"id": "p4-13", "sec": "301", "title": "Sign – Class C", "summary": "Discretionary — 508(f)"}, {"id": "p4-14", "sec": "303", "title": "Sign – Class E", "summary": "Discretionary — 508(g)"}, {"id": "p4-15", "sec": "316", "title": "Temporary Residential Sales Centre", "summary": "Discretionary — 508(h)"}, {"id": "p4-16", "sec": "322", "title": "Utility Building", "summary": "Discretionary — 508(i)"}]};
</script>
<script>
(function(){
  "use strict";

  const TABS = [
    {key:"instructions", label:"Instructions", short:"Start here"},
    {key:"part5div1", label:"Part 5 \u2014 Low Density Residential General Rules", short:"Sec. 334\u2013365.1"},
    {key:"part5div10", label:"Part 5 \u2014 R-MH District Rules", short:"Sec. 506\u2013524"},
    {key:"part3", label:"Part 3 \u2014 Citywide Rules", short:"Sec. 53\u2013129.1"},
    {key:"part4", label:"Part 4 \u2014 Use Rules", short:"Permitted & discretionary uses"},
  ];

  const STATUS_OPTS = [
    {key:"Pass", cls:"sel-pass"},
    {key:"Fail", cls:"sel-fail"},
    {key:"Pending Info", cls:"sel-pending"},
    {key:"N/A", cls:"sel-na"},
  ];

  // No browser storage of any kind is used. This file may be opened as a
  // plain local file (file://) with no server and no persistent storage API
  // available, so all state lives in memory for the current tab only.
  // The CSV export/import pair below is the sole persistence mechanism.
  let state = {
    activeTab: "instructions",
    search: "",
    statusFilter: null, // null = all
    responses: {},      // id -> {status, notes, proposed}
    project: {projNum:"", name:"", addr:"", file:"", reviewer:""},
    notesOpen: {},       // id -> bool, transient
  };

  function initState(){
    applyProjectToFields();
    renderAll();
  }

  function showToast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._hideTimer);
    t._hideTimer = setTimeout(()=>t.classList.remove("show"), 1400);
  }

  function applyProjectToFields(){
    document.getElementById("f-projnum").value = state.project.projNum || "";
    document.getElementById("f-name").value = state.project.name || "";
    document.getElementById("f-addr").value = state.project.addr || "";
    document.getElementById("f-file").value = state.project.file || "";
    document.getElementById("f-reviewer").value = state.project.reviewer || "";
  }

  function getResponse(id){
    return state.responses[id] || {status:null, notes:"", proposed:false};
  }

  function setResponse(id, patch){
    const cur = getResponse(id);
    state.responses[id] = Object.assign({}, cur, patch);
  }

  // R-MH has no §07-pattern binary building-status flip — every use tab
  // item carries a fixed Permitted/Discretionary summary straight from
  // CHECKLIST_DATA, so no live computation is needed here.
  function allItemsForTab(tabKey){
    return CHECKLIST_DATA[tabKey] || [];
  }

  // Part 4 is scoped to whichever uses have been selected from the top
  // dropdown (state.responses[id].proposed === true). Uses not selected
  // are not "in review" and don't count toward progress or show as cards.
  // Scoping is on `proposed` alone, NOT on isSelectableUse \u2014 an
  // already-added card must stay visible (re-labeled, not removed) even if
  // a later checkbox toggle makes that use currently unavailable to *add*.
  function isSelectableUse(item){
    return /^(Permitted|Discretionary)\b/i.test(item.summary || "");
  }

  function selectedPart4Items(){
    return allItemsForTab("part4").filter(it => getResponse(it.id).proposed);
  }

  function scopedItemsForTab(tabKey){
    return tabKey === "part4" ? selectedPart4Items() : allItemsForTab(tabKey);
  }

  function tabCounts(tabKey){
    const items = scopedItemsForTab(tabKey);
    if(!items.length) return {done:0, total:0};
    let done = 0;
    items.forEach(it=>{
      const r = getResponse(it.id);
      if(r.status) done++;
    });
    return {done, total: items.length};
  }

  function overallProgress(){
    let done=0, total=0;
    ["part5div1","part5div10","part3","part4"].forEach(k=>{
      const c = tabCounts(k);
      done += c.done; total += c.total;
    });
    return {done, total};
  }

  // ---------------- Rendering ----------------

  function renderAll(){
    renderTabNav();
    renderOverallProgress();
    renderMain();
  }

  // Every click handler in the app (status pills, use-selector dropdown,
  // remove-from-review, filter chips) calls this instead of touching only
  // the element that was clicked. It rebuilds tab counts, the overall
  // progress bar, and the whole main panel every time, so nothing in the
  // sidebar or stat strip can ever go stale relative to what was clicked.
  // Scroll position in the main panel is preserved across the rebuild.
  function refreshEverything(){
    const main = document.getElementById("main");
    const scrollTop = main ? main.scrollTop : 0;
    renderTabNav();
    renderOverallProgress();
    renderMain();
    const restoreScroll = ()=>{
      const m = document.getElementById("main");
      if(m) m.scrollTop = scrollTop;
    };
    if(typeof requestAnimationFrame === "function"){
      requestAnimationFrame(restoreScroll);
    } else {
      restoreScroll();
    }
  }

  function renderTabNav(){
    const nav = document.getElementById("tabnav");
    nav.innerHTML = "";
    TABS.forEach(tab=>{
      const btn = document.createElement("button");
      btn.className = "tab-btn" + (state.activeTab===tab.key ? " active":"");
      const left = document.createElement("span");
      left.className = "tname";
      left.innerHTML = `<span>${tab.label}</span><span class="tsec">${tab.short}</span>`;
      btn.appendChild(left);
      if(tab.key !== "instructions"){
        const c = tabCounts(tab.key);
        const count = document.createElement("span");
        count.className = "tab-count";
        count.textContent = `${c.done}/${c.total}`;
        btn.appendChild(count);
      }
      btn.addEventListener("click", ()=>{
        state.activeTab = tab.key;
        state.search = "";
        state.statusFilter = null;
        renderAll();
      });
      nav.appendChild(btn);
    });
  }

  function renderOverallProgress(){
    const {done,total} = overallProgress();
    const pct = total ? Math.round((done/total)*100) : 0;
    document.getElementById("overall-pct").textContent = `${pct}% (${done}/${total})`;
    document.getElementById("overall-fill").style.width = pct + "%";
  }

  function renderMain(){
    const main = document.getElementById("main");
    main.innerHTML = "";
    if(state.activeTab === "instructions"){
      main.appendChild(buildInstructions());
      return;
    }
    main.appendChild(buildPanelHead());
    main.appendChild(buildStatStrip());
    const list = buildCardList();
    main.appendChild(list);
  }

  function buildInstructions(){
    const wrap = document.createElement("div");

    const head = document.createElement("div");
    head.className = "panel-head";
    head.innerHTML = `<div><h2>How to use this checklist</h2>
      <p>An interactive companion to the R-MH Zoning Review Checklist, built from the sections of Land Use Bylaw 1P2007 that reference the R-MH district, low density residential districts generally, or all districts.</p></div>`;
    wrap.appendChild(head);

    const b1 = document.createElement("div");
    b1.className = "instr-block";
    b1.innerHTML = `<h3>Workflow</h3>
      <ol>
        <li>Fill in the project fields in the sidebar, starting with <b>Project number</b> \u2014 it's used to name your session file.</li>
        <li><b>Part 5 \u2014 Low Density Residential General Rules</b> and <b>Part 5 \u2014 R-MH District Rules</b> apply to every R-MH project without exception. Work through these first \u2014 but note that District tab \u00a7517 exempts R-MH buildings entirely from General tab sections 334\u2013338 (the setback-projection rules); those five General-tab items are flagged accordingly.</li>
        <li><b>Part 3 \u2014 Citywide Rules</b> applies to every district in Calgary, including R-MH. Don't skip it.</li>
        <li><b>Part 4 \u2014 Use Rules</b> is use-dependent. Add whichever use(s) are actually proposed from the dropdown. R-MH has no conditional/building-status use flip \u2014 every one of its 8 permitted and 9 discretionary uses carries a fixed status. Manufactured Home and Manufactured Home Park each set their own motor-vehicle and bicycle parking ratios directly in their Part 4 definitions (\u00a7227, \u00a7228) rather than in a district parking-rules section \u2014 confirm those directly.</li>
        <li>Click a status pill (Pass / Fail / Pending Info / N/A) on each article. Use "Notes" to log evidence, drawing references, or follow-ups.</li>
        <li><b>Nothing autosaves.</b> This is a standalone file with no server and no browser storage behind it \u2014 your answers exist only in this tab. Click <b>Export session (.csv)</b> in the sidebar to save your progress across all 106 checks (89 fixed + 17 use-tab items scoped to whatever you add), and <b>Import session (.csv)</b> to reload a previously exported file and pick up where you left off.</li>
      </ol>`;
    wrap.appendChild(b1);

    const b2 = document.createElement("div");
    b2.className = "instr-block";
    b2.innerHTML = `<h3>Scope \u2014 what this does <em>not</em> cover</h3>
      <p>This is a generic template, not a substitute for reading the bylaw. It excludes Part 1/2 (definitions, general administration), the Part 4 use definitions not listed under R-MH, subdivision requirements, and site-specific overlays \u2014 Direct Control variations, a registered Comprehensive Sign Program, restrictive covenants, or Airport Vicinity Protection Area maps. R-MH has no Secondary Suite, Backyard Suite, Rowhouse Building, or any other multi-unit Dwelling use in its permitted/discretionary lists \u2014 the General tab flags each Division 1 item tied to one of those building types as typically N/A for this district. R-MH also has no building-status condition (unlike I-B's or R-CG's checkbox-driven flips) \u2014 every use's Permitted/Discretionary status is fixed. Confirm all of this separately for your parcel, and always check the current consolidated bylaw on calgary.ca since it is amended regularly.</p>`;
    wrap.appendChild(b2);

    const b3 = document.createElement("div");
    b3.className = "instr-block";
    b3.innerHTML = `<h3>Status legend</h3>
      <div class="legend-grid">
        <div class="legend-card" style="background:var(--pass-bg);color:var(--pass);"><b>Pass</b>&nbsp;\u2014 confirmed compliant</div>
        <div class="legend-card" style="background:var(--fail-bg);color:var(--fail);"><b>Fail</b>&nbsp;\u2014 non-compliant, needs a change or relaxation</div>
        <div class="legend-card" style="background:var(--pending-bg);color:var(--pending);"><b>Pending Info</b>&nbsp;\u2014 need more drawings/info</div>
        <div class="legend-card" style="background:var(--na-bg);color:var(--na);"><b>N/A</b>&nbsp;\u2014 not applicable to this project</div>
      </div>`;
    wrap.appendChild(b3);

    return wrap;
  }

  function buildPanelHead(){
    const tab = TABS.find(t=>t.key===state.activeTab);
    const head = document.createElement("div");
    head.className = "panel-head";

    const left = document.createElement("div");
    left.innerHTML = `<h2>${tab.label}</h2><p>${panelDescription(state.activeTab)}</p>`;
    head.appendChild(left);

    const tools = document.createElement("div");
    tools.className = "panel-tools";

    if(state.activeTab === "part4"){
      tools.appendChild(buildUseSelector());
    }

    const search = document.createElement("input");
    search.className = "search-box";
    search.type = "text";
    search.placeholder = "Search this tab\u2026";
    search.value = state.search;
    search.addEventListener("input", (e)=>{ state.search = e.target.value; renderMain(); preserveFocus(search); });
    tools.appendChild(search);

    ["Fail","Pending Info"].forEach(s=>{
      const chip = document.createElement("button");
      chip.className = "filter-chip" + (state.statusFilter===s ? " active":"");
      chip.textContent = s === "Pending Info" ? "Pending only" : "Fails only";
      chip.addEventListener("click", ()=>{
        state.statusFilter = state.statusFilter===s ? null : s;
        refreshEverything();
      });
      tools.appendChild(chip);
    });

    head.appendChild(tools);
    return head;
  }

  // Dropdown listing only Part 4 items whose status is Permitted or
  // Discretionary (isSelectableUse) \u2014 nothing else is offered. Picking one
  // adds it to the reviewed-uses set (proposed:true) and the card for that
  // use (with its specific rule text and pass/fail controls) appears below.
  function buildUseSelector(){
    const wrap = document.createElement("div");
    wrap.className = "use-select-wrap";

    const select = document.createElement("select");
    select.className = "use-select";

    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "+ Add a use to review\u2026";
    select.appendChild(placeholder);

    const groups = [
      {label:"Permitted uses", test: s => /^Permitted/i.test(s)},
      {label:"Discretionary uses", test: s => /^Discretionary/i.test(s)},
    ];
    groups.forEach(g=>{
      const items = allItemsForTab("part4")
        .filter(it => isSelectableUse(it) && g.test(it.summary) && !getResponse(it.id).proposed)
        .sort((a,b)=> a.title.localeCompare(b.title));
      if(!items.length) return;
      const optgroup = document.createElement("optgroup");
      optgroup.label = g.label;
      items.forEach(it=>{
        const opt = document.createElement("option");
        opt.value = it.id;
        opt.textContent = `${it.title} (${it.sec})`;
        optgroup.appendChild(opt);
      });
      select.appendChild(optgroup);
    });

    select.addEventListener("change", (e)=>{
      const id = e.target.value;
      if(!id) return;
      setResponse(id, {proposed:true});
      refreshEverything();
    });

    wrap.appendChild(select);

    const count = selectedPart4Items().length;
    if(count){
      const badge = document.createElement("span");
      badge.className = "use-select-count";
      badge.textContent = `${count} use${count===1?"":"s"} in review`;
      wrap.appendChild(badge);
    }

    return wrap;
  }

  function panelDescription(key){
    if(key==="part5div1") return "General rules for all Low Density Residential land use districts \u2014 landscaping, screening, setback projections, fences, solar, driveways, retaining walls. Always applicable, EXCEPT sections 334\u2013338 (setback projections), which District tab \u00a7517 disapplies entirely to R-MH buildings \u2014 see the flagged items.";
    if(key==="part5div10") return "R-MH-specific rules \u2014 permitted/discretionary uses, density, parcel dimensions, coverage, setbacks, building height, outdoor private amenity space, Manufactured Home installation, Manufactured Home Park standards, garbage, recycling. Always applicable.";
    if(key==="part3") return "Rules Governing All Districts \u2014 public realm setbacks, airport vicinity, floodway, lighting, signs, parking/loading, servicing. Applies to R-MH the same as every other district. Note: R-MH sets its own parking and bicycle-parking ratios directly in the Manufactured Home (\u00a7227) and Manufactured Home Park (\u00a7228) use definitions on the Use tab rather than in a district parking section.";
    if(key==="part4") return "Add the proposed use(s) from the dropdown \u2014 only the 8 Permitted (\u00a7507) and 9 Discretionary (\u00a7508) R-MH uses are offered. Every use's status is fixed \u2014 R-MH has no building-status condition that flips a use between Permitted and Discretionary.";
    return "";
  }

  function preserveFocus(el){
    // re-focus the search box after re-render (since renderMain rebuilds the DOM)
    const refocus = ()=>{
      const s = document.querySelector(".search-box");
      if(s){ s.focus(); const v=s.value; s.value=""; s.value=v; }
    };
    if(typeof requestAnimationFrame === "function"){
      requestAnimationFrame(refocus);
    } else {
      refocus();
    }
  }

  function buildStatStrip(){
    const items = filteredItems();
    const scoped = scopedItemsForTab(state.activeTab);
    const strip = document.createElement("div");
    strip.className = "stat-strip";
    const counts = {"Pass":0,"Fail":0,"Pending Info":0,"N/A":0,"none":0};
    scoped.forEach(it=>{
      const r = getResponse(it.id);
      if(r.status) counts[r.status] = (counts[r.status]||0)+1;
      else counts.none++;
    });
    const defs = [
      ["Pass", "var(--pass)"],["Fail","var(--fail)"],["Pending Info","var(--pending)"],
      ["N/A","var(--na)"],["Not started","var(--ink-soft)"]
    ];
    const map = {"Pass":counts.Pass,"Fail":counts.Fail,"Pending Info":counts["Pending Info"],"N/A":counts["N/A"],"Not started":counts.none};
    defs.forEach(([label,color])=>{
      const s = document.createElement("div");
      s.className = "stat";
      s.innerHTML = `<span class="swatch" style="background:${color}"></span><b>${map[label]}</b> ${label}`;
      strip.appendChild(s);
    });
    if(items.length !== scoped.length){
      const s = document.createElement("div");
      s.className = "stat";
      s.style.marginLeft = "auto";
      s.textContent = `Showing ${items.length} of ${scoped.length}`;
      strip.appendChild(s);
    }
    return strip;
  }

  function filteredItems(){
    let items = scopedItemsForTab(state.activeTab);
    if(state.search.trim()){
      const q = state.search.trim().toLowerCase();
      items = items.filter(it =>
        it.sec.toLowerCase().includes(q) ||
        it.title.toLowerCase().includes(q) ||
        it.summary.toLowerCase().includes(q)
      );
    }
    if(state.statusFilter){
      items = items.filter(it => getResponse(it.id).status === state.statusFilter);
    }
    return items;
  }

  function buildCardList(){
    const container = document.createElement("div");
    const items = filteredItems();
    if(!items.length){
      const empty = document.createElement("div");
      empty.className = "empty-state";
      if(state.activeTab === "part4" && !selectedPart4Items().length){
        empty.textContent = "No uses selected yet. Choose a permitted or discretionary use from the dropdown above to begin testing it.";
      } else {
        empty.textContent = "No articles match your search/filter.";
      }
      container.appendChild(empty);
      return container;
    }
    const isPart4 = state.activeTab === "part4";
    items.forEach(it=>{
      container.appendChild(buildCard(it, isPart4));
    });
    return container;
  }

  function buildCard(item, isPart4){
    const r = getResponse(item.id);
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.status = r.status || "";

    const top = document.createElement("div");
    top.className = "card-top";

    const idWrap = document.createElement("div");
    idWrap.className = "card-id";
    idWrap.innerHTML = `<span class="sec-badge mono">${escapeHtml(item.sec)}</span><h3>${escapeHtml(item.title)}</h3>`;
    top.appendChild(idWrap);

    if(isPart4){
      const removeBtn = document.createElement("button");
      removeBtn.className = "remove-use-btn";
      removeBtn.type = "button";
      removeBtn.textContent = "Remove from review";
      removeBtn.addEventListener("click", ()=>{
        setResponse(item.id, {proposed:false});
        refreshEverything();
      });
      top.appendChild(removeBtn);
    }
    card.appendChild(top);

    const summary = document.createElement("p");
    summary.className = isPart4 ? "summary use-tag" : "summary";
    summary.textContent = item.summary;
    card.appendChild(summary);

    const statusRow = document.createElement("div");
    statusRow.className = "status-row";
    STATUS_OPTS.forEach(opt=>{
      const pill = document.createElement("button");
      pill.className = "status-pill" + (r.status===opt.key ? " "+opt.cls : "");
      pill.textContent = opt.key;
      pill.addEventListener("click", ()=>{
        const newStatus = r.status===opt.key ? null : opt.key;
        setResponse(item.id, {status:newStatus});
        refreshEverything();
      });
      statusRow.appendChild(pill);
    });

    const notesToggle = document.createElement("button");
    notesToggle.className = "notes-toggle";
    notesToggle.textContent = state.notesOpen[item.id] ? "Hide notes" : (r.notes ? "Edit notes \u25CF" : "Add notes");
    notesToggle.addEventListener("click", ()=>{
      state.notesOpen[item.id] = !state.notesOpen[item.id];
      notesArea.classList.toggle("open", state.notesOpen[item.id]);
      notesToggle.textContent = state.notesOpen[item.id] ? "Hide notes" : (r.notes ? "Edit notes \u25CF" : "Add notes");
      if(state.notesOpen[item.id]) textarea.focus();
    });
    statusRow.appendChild(notesToggle);
    card.appendChild(statusRow);

    const notesArea = document.createElement("div");
    notesArea.className = "notes-area" + (state.notesOpen[item.id] ? " open":"");
    const textarea = document.createElement("textarea");
    textarea.placeholder = "Notes, drawing references, follow-up items\u2026";
    textarea.value = r.notes || "";
    textarea.addEventListener("input", (e)=>{
      setResponse(item.id, {notes: e.target.value});
    });
    notesArea.appendChild(textarea);
    card.appendChild(notesArea);

    return card;
  }

  function escapeHtml(s){
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  // ---------------- Session export / import (CSV = the persistent record) ----------------

  const DATA_TAB_KEYS = ["part5div1","part5div10","part3","part4"];
  const ITEM_HEADERS = ["Part","Section","Article Title","Requirement Summary","Proposed","Review Status","Notes","ID"];
  // Third element is the field type: "text" (default) or "bool". R-MH has no
  // §07-pattern district-condition checkboxes, so every project field here
  // is plain text — kept as a 3-tuple for structural consistency with the
  // rest of the checklist family (I-B and R-CG carry "bool" entries for their
  // building-status checkboxes).
  const META_FIELDS = [
    ["Project number", "projNum", "text"],
    ["Project name", "name", "text"],
    ["Site address / legal desc.", "addr", "text"],
    ["DP / file no.", "file", "text"],
    ["Reviewer", "reviewer", "text"],
  ];

  function todayStr(){
    const d = new Date();
    const p = n => String(n).padStart(2,"0");
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  }

  function sanitizeForFilename(s){
    return String(s||"").trim().replace(/[\\/:*?"<>|]+/g,"-").replace(/\s+/g," ").trim();
  }

  function buildExportRows(){
    const rows = [];
    rows.push(["Field","Value"]);
    META_FIELDS.forEach(([label,key,type])=>{
      const val = type === "bool" ? (state.project[key] ? "Yes" : "No") : (state.project[key] || "");
      rows.push([label, val]);
    });
    rows.push(["Export date", todayStr()]);
    const totalDone = overallProgress();
    rows.push(["Progress", `${totalDone.done}/${totalDone.total} checks completed`]);
    rows.push([]); // blank separator row
    rows.push(ITEM_HEADERS);
    DATA_TAB_KEYS.forEach(key=>{
      const tab = TABS.find(t=>t.key===key);
      allItemsForTab(key).forEach(it=>{
        const r = getResponse(it.id);
        const isPart4 = key === "part4";
        rows.push([
          tab.label,
          it.sec,
          it.title,
          it.summary,
          isPart4 ? (r.proposed ? "Yes" : "No") : "",
          r.status || "",
          r.notes || "",
          it.id,
        ]);
      });
    });
    return rows;
  }

  function exportCsv(){
    const rows = buildExportRows();
    const csv = rows.map(row => row.map(csvEscape).join(",")).join("\r\n");
    const blob = new Blob(["\uFEFF" + csv], {type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const projNum = sanitizeForFilename(state.project.projNum) || "Unnumbered";
    a.href = url;
    a.download = `${projNum} - ${todayStr()} - LUB Review.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    const {done,total} = overallProgress();
    showToast(`Exported \u2014 ${done}/${total} checks saved`);
  }

  function csvEscape(val){
    const s = String(val==null ? "" : val);
    if(/[",\r\n]/.test(s)){
      return '"' + s.replace(/"/g,'""') + '"';
    }
    return s;
  }

  // RFC4180-ish parser: handles quoted fields containing commas, quotes, and newlines.
  function parseCsvText(text){
    const rows = [];
    let row = [];
    let field = "";
    let inQuotes = false;
    // Normalize a leading BOM if present.
    if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    for(let i=0; i<text.length; i++){
      const c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){ field += '"'; i++; }
          else { inQuotes = false; }
        } else {
          field += c;
        }
      } else {
        if(c === '"'){
          inQuotes = true;
        } else if(c === ','){
          row.push(field); field = "";
        } else if(c === '\r'){
          // skip; \n (or end) will terminate the row
        } else if(c === '\n'){
          row.push(field); field = "";
          rows.push(row); row = [];
        } else {
          field += c;
        }
      }
    }
    // flush trailing field/row if the file doesn't end with a newline
    if(field.length || row.length){
      row.push(field);
      rows.push(row);
    }
    return rows.filter(r => !(r.length===1 && r[0]===""));
  }

  function importCsv(file){
    const reader = new FileReader();
    reader.onload = (e)=>{
      let rows;
      try{
        rows = parseCsvText(String(e.target.result));
      }catch(err){
        showToast("Import failed \u2014 couldn't read this file as CSV");
        return;
      }
      const headerIdx = rows.findIndex(r => r[0] === "Part" && r[1] === "Section");
      if(headerIdx === -1){
        showToast("Import failed \u2014 not a recognized session file");
        return;
      }

      // Parse metadata rows (everything before the item table, skipping the
      // "Field,Value" header and any Export date / Progress info rows).
      const metaByLabel = {};
      for(let i=0; i<headerIdx; i++){
        const [label, value] = rows[i];
        if(label && label !== "Field") metaByLabel[label] = value;
      }
      const newProject = {};
      META_FIELDS.forEach(([label,key,type])=>{
        newProject[key] = type === "bool" ? (metaByLabel[label] === "Yes") : (metaByLabel[label] || "");
      });

      // Parse item rows, matched back to known checklist items by ID.
      const knownIds = new Set();
      DATA_TAB_KEYS.forEach(key => allItemsForTab(key).forEach(it => knownIds.add(it.id)));
      const newResponses = {};
      let matched = 0, skipped = 0;
      for(let i=headerIdx+1; i<rows.length; i++){
        const r = rows[i];
        if(!r.length || r.every(c=>c==="")) continue;
        const [ , , , , proposedCol, statusCol, notesCol, idCol] = r;
        const id = idCol;
        if(!id || !knownIds.has(id)){ skipped++; continue; }
        newResponses[id] = {
          status: statusCol || null,
          notes: notesCol || "",
          proposed: proposedCol === "Yes",
        };
        matched++;
      }

      if(!matched){
        showToast("Import failed \u2014 no matching checklist items found in that file");
        return;
      }

      state.project = newProject;
      state.responses = newResponses;
      state.notesOpen = {};
      applyProjectToFields();
      renderAll();
      showToast(`Imported \u2014 ${matched} checks loaded${skipped ? `, ${skipped} rows skipped` : ""}`);
    };
    reader.onerror = ()=> showToast("Import failed \u2014 couldn't read that file");
    reader.readAsText(file);
  }

  // ---------------- Project field bindings ----------------
  function bindProjectFields(){
    const map = {"f-projnum":"projNum","f-name":"name","f-addr":"addr","f-file":"file","f-reviewer":"reviewer"};
    Object.keys(map).forEach(id=>{
      const el = document.getElementById(id);
      el.addEventListener("input", (e)=>{
        state.project[map[id]] = e.target.value;
      });
    });
  }

  function bindSessionButtons(){
    document.getElementById("btn-export").addEventListener("click", exportCsv);
    const fileInput = document.getElementById("file-import");
    document.getElementById("btn-import").addEventListener("click", ()=> fileInput.click());
    fileInput.addEventListener("change", (e)=>{
      const file = e.target.files && e.target.files[0];
      if(file) importCsv(file);
      fileInput.value = "";
    });
  }

  // ---------------- Init ----------------
  bindProjectFields();
  bindSessionButtons();
  initState();

})();

</script>
</body>
</html>

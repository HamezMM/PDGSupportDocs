<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M-2 District Review Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F2E8;
    --paper-card:#FBF9F2;
    --ink:#152538;
    --ink-soft:#3A4A5C;
    --blue:#2C5A87;
    --blue-dim:#5C7C99;
    --rule:#D9D2BC;
    --rule-dark:#B9B092;
    --pass:#3E7A5A;
    --pass-bg:#E1EEE5;
    --fail:#AE4429;
    --fail-bg:#F4E2DC;
    --pending:#B5842A;
    --pending-bg:#F3E7CE;
    --na:#83807A;
    --na-bg:#E7E5DE;
    --sidebar-w:280px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    font-size:14px;
    line-height:1.5;
    display:flex;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:var(--sidebar-w);
    flex-shrink:0;
    background:var(--ink);
    color:#EDE9DA;
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .titleblock{
    padding:22px 20px 16px 20px;
    border-bottom:1px solid rgba(237,233,218,0.18);
  }
  .titleblock .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.14em;
    color:#8FAFC9;
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .titleblock h1{
    font-size:18px;
    line-height:1.28;
    margin:0 0 4px 0;
    font-weight:600;
    color:#FFFFFF;
  }
  .titleblock .sub{
    font-size:11.5px;
    color:#9FB2C4;
  }

  .project-fields{
    padding:16px 20px;
    border-bottom:1px solid rgba(237,233,218,0.18);
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .project-fields label{
    display:block;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:#8FAFC9;
    margin-bottom:3px;
    font-family:'IBM Plex Mono',monospace;
  }
  .project-fields input{
    width:100%;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(237,233,218,0.22);
    border-radius:3px;
    color:#EDE9DA;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:12.5px;
    padding:6px 8px;
  }
  .project-fields input::placeholder{color:#66768A;}
  .project-fields input:focus{outline:none;border-color:var(--blue-dim);background:rgba(255,255,255,0.1);}

  nav.tabs{
    padding:14px 12px;
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .tab-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:none;
    border:none;
    color:#C7D2DC;
    text-align:left;
    padding:10px 10px;
    border-radius:4px;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13px;
    cursor:pointer;
    transition:background .12s ease;
  }
  .tab-btn:hover{background:rgba(255,255,255,0.06);}
  .tab-btn.active{background:var(--blue);color:#fff;}
  .tab-btn .tname{display:flex;flex-direction:column;gap:1px;}
  .tab-btn .tsec{font-size:10px;font-family:'IBM Plex Mono',monospace;opacity:0.72;letter-spacing:.04em;}
  .tab-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    background:rgba(255,255,255,0.12);
    padding:2px 6px;
    border-radius:10px;
    min-width:34px;
    text-align:center;
  }
  .tab-btn.active .tab-count{background:rgba(255,255,255,0.25);}

  .ruler-block{
    margin-top:auto;
    padding:16px 20px 20px 20px;
    border-top:1px solid rgba(237,233,218,0.18);
  }
  .ruler-label{
    display:flex;
    justify-content:space-between;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:#9FB2C4;
    margin-bottom:6px;
  }
  .ruler{
    position:relative;
    height:14px;
    border:1px solid rgba(237,233,218,0.3);
    border-radius:2px;
    overflow:hidden;
    background:rgba(255,255,255,0.05);
  }
  .ruler-fill{
    position:absolute;left:0;top:0;bottom:0;
    background:linear-gradient(90deg,#3E7A5A,#5C9C77);
    width:0%;
    transition:width .25s ease;
  }
  .ruler-ticks{
    position:absolute;inset:0;
    background-image:repeating-linear-gradient(90deg, rgba(21,37,56,0.55) 0 1px, transparent 1px 10%);
  }
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:6px 10px;
    margin-top:12px;
  }
  .legend-item{
    display:flex;align-items:center;gap:5px;
    font-size:10.5px;color:#B7C3CE;
    font-family:'IBM Plex Mono',monospace;
  }
  .swatch{width:9px;height:9px;border-radius:2px;display:inline-block;}

  .session-block{
    padding:16px 20px 20px 20px;
    border-top:1px solid rgba(237,233,218,0.18);
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .session-warning{
    font-size:10.5px;
    line-height:1.45;
    color:#B5842A;
    background:rgba(181,132,42,0.14);
    border:1px solid rgba(181,132,42,0.35);
    border-radius:4px;
    padding:8px 9px;
    margin-bottom:2px;
  }
  .session-btn{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:12px;
    font-weight:600;
    padding:8px 12px;
    border-radius:4px;
    border:1px solid rgba(237,233,218,0.3);
    background:rgba(255,255,255,0.06);
    color:#EDE9DA;
    cursor:pointer;
    width:100%;
    text-align:center;
  }
  .session-btn:hover{background:rgba(255,255,255,0.12);}
  .session-btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
  .session-btn.primary:hover{background:#356E9D;}

  /* ---------- Main ---------- */
  #main{
    flex:1;
    min-width:0;
    padding:28px 40px 80px 40px;
    max-width:980px;
  }
  .panel-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:6px;
    padding-bottom:16px;
    border-bottom:2px solid var(--ink);
  }
  .panel-head h2{
    font-size:21px;
    margin:0 0 4px 0;
    font-weight:600;
  }
  .panel-head p{
    margin:0;
    font-size:12.5px;
    color:var(--ink-soft);
    max-width:60ch;
  }
  .panel-tools{
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
  }
  .search-box{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:12.5px;
    padding:7px 10px;
    border:1px solid var(--rule-dark);
    border-radius:4px;
    background:#fff;
    min-width:170px;
  }
  .filter-chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    padding:6px 10px;
    border-radius:14px;
    border:1px solid var(--rule-dark);
    background:#fff;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .filter-chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .export-btn{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:12px;
    font-weight:600;
    padding:7px 13px;
    border-radius:4px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:#fff;
    cursor:pointer;
  }
  .export-btn:hover{background:var(--blue);border-color:var(--blue);}
  .export-btn.secondary{background:#fff;color:var(--ink);}
  .export-btn.secondary:hover{background:var(--paper-card);}

  .stat-strip{
    display:flex;
    gap:16px;
    margin:16px 0 20px 0;
    flex-wrap:wrap;
  }
  .stat{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    padding:5px 10px;
    border-radius:4px;
    display:flex;
    gap:6px;
    align-items:center;
    border:1px solid var(--rule);
    background:#fff;
  }
  .stat b{font-size:13px;}

  /* Article cards */
  .card{
    background:var(--paper-card);
    border:1px solid var(--rule);
    border-left:4px solid var(--rule-dark);
    border-radius:5px;
    margin-bottom:12px;
    padding:16px 18px;
    transition:border-left-color .15s ease;
  }
  .card[data-status="Pass"]{border-left-color:var(--pass);}
  .card[data-status="Fail"]{border-left-color:var(--fail);}
  .card[data-status="Pending Info"]{border-left-color:var(--pending);}
  .card[data-status="N/A"]{border-left-color:var(--na);}

  .card-top{
    display:flex;
    justify-content:space-between;
    gap:14px;
    align-items:flex-start;
  }
  .card-id{
    display:flex;
    gap:10px;
    align-items:baseline;
    min-width:0;
  }
  .sec-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    font-weight:600;
    color:var(--blue);
    background:#fff;
    border:1px solid var(--blue-dim);
    border-radius:3px;
    padding:2px 7px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .card h3{
    font-size:14.5px;
    margin:0;
    font-weight:600;
    color:var(--ink);
  }
  .card .summary{
    margin:9px 0 0 0;
    font-size:12.8px;
    color:var(--ink-soft);
    line-height:1.55;
  }
  .use-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--blue);
  }

  .status-row{
    display:flex;
    gap:6px;
    margin-top:12px;
    flex-wrap:wrap;
    align-items:center;
  }
  .status-pill{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    padding:5px 11px;
    border-radius:13px;
    border:1px solid var(--rule-dark);
    background:#fff;
    cursor:pointer;
    color:var(--ink-soft);
    transition:all .1s ease;
  }
  .status-pill:hover{border-color:var(--ink);}
  .status-pill.sel-pass{background:var(--pass);border-color:var(--pass);color:#fff;}
  .status-pill.sel-fail{background:var(--fail);border-color:var(--fail);color:#fff;}
  .status-pill.sel-pending{background:var(--pending);border-color:var(--pending);color:#fff;}
  .status-pill.sel-na{background:var(--na);border-color:var(--na);color:#fff;}

  .notes-toggle{
    margin-left:auto;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--blue);
    cursor:pointer;
    background:none;
    border:none;
    text-decoration:underline;
    padding:4px;
  }
  .notes-area{
    display:none;
    margin-top:10px;
  }
  .notes-area.open{display:block;}
  .notes-area textarea{
    width:100%;
    min-height:56px;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:12.5px;
    padding:8px 10px;
    border:1px solid var(--rule-dark);
    border-radius:4px;
    resize:vertical;
    background:#fff;
  }
  .notes-area textarea:focus{outline:none;border-color:var(--blue);}

  .use-select-wrap{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .use-select{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:12.5px;
    padding:7px 10px;
    border:1px solid var(--blue-dim);
    border-radius:4px;
    background:#EAF0F6;
    color:var(--ink);
    min-width:220px;
    cursor:pointer;
  }
  .use-select-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--blue);
    white-space:nowrap;
  }
  .remove-use-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--fail);
    background:#fff;
    border:1px solid var(--fail);
    border-radius:13px;
    padding:4px 10px;
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
  }
  .remove-use-btn:hover{background:var(--fail-bg);}

  .empty-state{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
    font-size:13px;
  }

  /* Instructions panel */
  .instr-block{
    background:var(--paper-card);
    border:1px solid var(--rule);
    border-radius:5px;
    padding:20px 22px;
    margin-bottom:16px;
  }
  .instr-block h3{
    margin:0 0 10px 0;
    font-size:14px;
    color:var(--blue);
    font-family:'IBM Plex Mono',monospace;
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .instr-block ol, .instr-block ul{margin:0;padding-left:20px;}
  .instr-block li{margin-bottom:7px;font-size:13px;color:var(--ink-soft);}
  .instr-block p{font-size:13px;color:var(--ink-soft);margin:0 0 8px 0;}
  .legend-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:8px;
    margin-top:8px;
  }
  .legend-card{
    display:flex;align-items:center;gap:8px;
    padding:8px 10px;
    border-radius:4px;
    font-size:12px;
  }

  .toast{
    position:fixed;
    bottom:20px;
    right:20px;
    background:var(--ink);
    color:#fff;
    padding:9px 16px;
    border-radius:5px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    opacity:0;
    transform:translateY(8px);
    transition:all .2s ease;
    pointer-events:none;
    z-index:50;
  }
  .toast.show{opacity:1;transform:translateY(0);}

  @media (max-width:860px){
    body{flex-direction:column;}
    #sidebar{position:relative;width:100%;height:auto;}
    #main{padding:20px;max-width:100%;}
  }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="titleblock">
    <div class="eyebrow">Land Use Bylaw 1P2007</div>
    <h1>M-2 District Review Checklist</h1>
    <div class="sub">Multi-Residential &ndash; Medium Profile &middot; Development Permit review</div>
  </div>

  <div class="project-fields">
    <div>
      <label for="f-projnum">Project number</label>
      <input id="f-projnum" type="text" placeholder="e.g. 26.93">
    </div>
    <div>
      <label for="f-name">Project name</label>
      <input id="f-name" type="text" placeholder="e.g. 14 Ave Townhomes">
    </div>
    <div>
      <label for="f-addr">Site address / legal desc.</label>
      <input id="f-addr" type="text" placeholder="Address or plan/block/lot">
    </div>
    <div>
      <label for="f-file">DP / file no.</label>
      <input id="f-file" type="text" placeholder="DP2026-xxxxx">
    </div>
    <div>
      <label for="f-reviewer">Reviewer</label>
      <input id="f-reviewer" type="text" placeholder="Name">
    </div>
  </div>

  <nav class="tabs" id="tabnav"></nav>

  <div class="ruler-block">
    <div class="ruler-label"><span>OVERALL PROGRESS</span><span id="overall-pct">0%</span></div>
    <div class="ruler">
      <div class="ruler-ticks"></div>
      <div class="ruler-fill" id="overall-fill"></div>
    </div>
    <div class="legend">
      <span class="legend-item"><span class="swatch" style="background:var(--pass)"></span>Pass</span>
      <span class="legend-item"><span class="swatch" style="background:var(--fail)"></span>Fail</span>
      <span class="legend-item"><span class="swatch" style="background:var(--pending)"></span>Pending</span>
      <span class="legend-item"><span class="swatch" style="background:var(--na)"></span>N/A</span>
    </div>
  </div>

  <div class="session-block">
    <div class="session-warning">Nothing autosaves. Export a session file before closing this tab, and import it next time to pick up where you left off.</div>
    <button class="session-btn primary" id="btn-export">Export session (.csv)</button>
    <button class="session-btn" id="btn-import">Import session (.csv)</button>
    <input type="file" id="file-import" accept=".csv,text/csv" style="display:none">
  </div>
</aside>

<main id="main"></main>

<div class="toast" id="toast">Saved</div>

<script>
const CHECKLIST_DATA = {
"part6div1": [
  {"id":"d1-0","sec":"549","title":"Projections Into Setback Areas","summary":"Buildings and air conditioning units generally can't sit in a setback area. Above-grade building portions may only project into a setback per this section's rules; below-grade portions may extend without limit. Wheelchair ramps: no limit. Eaves: max 0.6 m projection; window wells: max 0.8 m. Landings ≤ 2.5 m², non-wheelchair ramps, and unenclosed stairs may project. Signs may be located in a setback per Part 3, Div. 5."},
  {"id":"d1-1","sec":"550","title":"General Landscaped Area Rules","summary":"A landscape plan approved by the Development Authority is required with every DP application that changes the building/parcel, showing existing/proposed topography, vegetation retention, layout (berms, pathways, screening, slopes, hard/soft areas), plant schedule/species/sizes, and irrigation details — plus extra detail (Latin names, maturity elevations, a written report) if the Enhanced Landscaping Option is used, and extra detail for landscaping over a structure (waterproofing, soil depths, irrigation). Must be maintained on the parcel for the life of the development. All landscaped area (other than private amenity space) must be accessible to all residents."},
  {"id":"d1-2","sec":"551","title":"Specific Rules for Landscaped Areas","summary":"Motor vehicle access/parking, loading, and garbage/recycling areas are excluded from the landscaped-area calculation. Min. 40.0% of parcel area must be landscaped (unless reduced per §553–556). Max. hard-surfaced landscaped area: 50.0% of the required landscaped area for a street-oriented multi-residential building, 40.0% otherwise. For a Multi-Residential Development – Minor, up to 30.0% of the max. hard-surfaced allowance may be concrete. Landscaped area above grade: min. 30.0% soft-surfaced (per isolated space if fragmented). Amenity space counts toward landscaped area only if provided outdoors at grade and hard- or soft-surfaced."},
  {"id":"d1-3","sec":"552","title":"Planting Requirements","summary":"Plant material must suit Calgary's climate (CNLA standard). Min. 1.0 tree + 2.0 shrubs per 45.0 m² of landscaped area; landscaped areas may include Urban Agriculture. Min. 25.0% of trees coniferous. Deciduous trees: min. 50 mm caliper (min. 50.0% at 75 mm). Coniferous trees: min. 2.0 m height (min. 50.0% at 3.0 m). Shrubs: min. 0.6 m height/spread at planting. Over a structure: min. soil depths of 1.2 m (trees), 0.6 m (shrubs), 0.3 m (all other), covering the mature spread of the material. New boulevard trees adjacent to the parcel may count toward the requirement."},
  {"id":"d1-4","sec":"553–556","title":"Landscaped Area Reductions – Multi-Residential Development","summary":"The min. 40.0% landscaped area (§551(2)) may be reduced, individually or combined, to a max. total reduction of 10.0% of parcel area, via three options: Street-Oriented Option (§554) — 2.0 m² reduction per 1.0 m of street frontage (excl. driveways), max. 4.0% (n/a to a street-oriented building on a private condo roadway); Enhanced Landscaping Option (§555) — 3.0% reduction with denser/larger plant material (1 tree + 2 shrubs/25 m², larger caliper/height minimums); Low Water Landscaping Option (§556) — 3.0% reduction with a low-water irrigation system confined to trees/shrubs, max. 30.0% sod, and min. 30.0% of trees/shrubs selected from the Low Water Trees/Shrubs tables."},
  {"id":"d1-5","sec":"557","title":"Amenity Space","summary":"Does not apply to Multi-Residential – At Grade Housing District parcels. Min. required amenity space: 5.0 m² per unit. A patio may be located in a street-facing setback area for a street-oriented multi-residential building. Private amenity space (balcony/deck/patio, min. 2.0 m dimension) counts up to 5.0 m²/unit; screening required if within 4.0 m of a lane/parcel. Common amenity space must be accessible from all units, min. 50.0 m² contiguous with no dimension <6.0 m, not in a setback area; indoors-only portion capped at max. 10.0% of required amenity space and only usable toward the requirement in a development of 100+ units (and not at all for a Multi-Residential Development – Minor); common outdoor space needs a barbeque or seating as a permanent feature and counts toward the landscaped-area calculation."},
  {"id":"d1-6","sec":"558","title":"Motor Vehicle Parking Stall Requirements","summary":"Min. 0.625 stalls per Dwelling Unit or suite. Live Work Unit: 0.625 resident stalls/unit + 0.5 visitor stalls/unit."},
  {"id":"d1-7","sec":"559","title":"Bicycle Parking Stall Requirements","summary":"Min. 0.5 Class 1 stall per unit + 0.5 Class 1 stall per suite, plus 0.1 Class 2 stalls per unit for developments of 20+ units (min. 2.0 Class 2 stalls)."},
  {"id":"d1-8","sec":"560","title":"Reduction for Transit Supportive Multi-Residential Development","summary":"The §558 stall requirement is reduced 25.0% for a parcel within 600.0 m of an existing/approved Capital funded LRT platform, 400.0 m of a Capital funded BRT station, or 200.0 m of primary transit service."},
  {"id":"d1-9","sec":"561","title":"Parking Maximums Close to LRT Stations","summary":"Where a building has 3+ units with shared entrance facilities, within 600.0 m of an existing/approved Capital funded LRT platform: max. 1.5 stalls/Dwelling Unit (resident) in Map 7 Area 1, or 1.25 stalls/Dwelling Unit in Map 7 Area 2 — confirm the map area directly."},
  {"id":"d1-10","sec":"562","title":"Minimum Motor Vehicle Parking Stall Requirements for Commercial Multi-Residential Uses","summary":"Deleted."},
  {"id":"d1-11","sec":"563","title":"Accessory Residential Buildings","summary":"May include a deck/patio amenity space. Generally can't be in a required setback (exception below) or between a building and a public street. Max. GFA: 75.0 m² (storage/garbage/recycling) or 100.0 m² (private garage). Max. height as a private garage: 5.0 m from grade in M-2 (the 4.6 m/3.0 m-eaveline rule is M-CG-specific). Setback exception: where the main building is a Multi-Residential Development, a garbage/garage accessory building may sit in a setback shared with another parcel if walls are maintenance-free and eaves don't overhang the adjacent parcel/lane."},
  {"id":"d1-12","sec":"564","title":"Objects Prohibited or Restricted","summary":"A large vehicle can't remain on the parcel except while loading/unloading. A satellite dish >1.0 m diameter can't be in a front or corner-side setback, can't exceed 3.0 m height from grade, and can't be illuminated — unless the applicant demonstrates compliance would block signal reception and the dish is sited/screened to the Development Authority's satisfaction."},
  {"id":"d1-13","sec":"565","title":"Driveway Length and Parking Areas","summary":"No direct driveway access to a major street unless there's no practical alternative and a turning space lets vehicles exit facing the street. Street driveway: min. 6.0 m length (from back of sidewalk/curb), min. 3.0 m width. Lane driveway: min. 0.60 m length, located between the lane property line and the private garage entrance. In the Developed Area, a street-accessing driveway can't be constructed/altered/replaced except on a laneless parcel, where 50.0%+ of the block face already has a street driveway, or where a legal existing driveway isn't being relocated/widened."},
  {"id":"d1-14","sec":"566","title":"Garbage","summary":"Garbage/waste stored inside a building or in a Development-Authority-approved enclosure. Enclosure can't be between a building and a public street, and generally can't be in a setback area — exception: where the main building is a Multi-Residential Development, an enclosure may sit in a setback shared with another parcel if walls are maintenance-free and eaves don't overhang the adjacent parcel/lane."},
  {"id":"d1-15","sec":"567","title":"Recycling Facilities","summary":"Required for every Multi-Residential Development."},
  {"id":"d1-16","sec":"568","title":"Mechanical Screening","summary":"Outdoor mechanical equipment must be positioned, camouflaged, or screened from view of a public space, or from a residential-district parcel within 30.0 m, using a 1.7 m eye-level sightline."},
  {"id":"d1-17","sec":"569","title":"Visibility Setback","summary":"Within a corner visibility triangle, buildings, fences, finished grade, and vegetation must not be located between 0.75 m and 4.60 m above the lowest street elevation."},
  {"id":"d1-18","sec":"570","title":"Retaining Walls","summary":"Max. height 1.2 m (lowest adjacent grade to highest retained grade). Min. 1.0 m horizontal separation between retaining walls on a parcel, for a Multi-Residential Development – Minor, or within 3.0 m of a property line for all other developments."},
  {"id":"d1-19","sec":"571","title":"Fences","summary":"Max. height above grade: 1.2 m for the portion extending beyond the foremost part of all buildings on the parcel; 2.0 m for the portion that doesn't; 2.5 m to the highest point of a gateway (max. 2.5 m gateway length)."},
  {"id":"d1-20","sec":"571.1","title":"Solar Collectors","summary":"Wall- or roof-mounted only. Roof pitch <4:12: max. 2.0 m projection, min. 1.0 m from roof edge. Roof pitch ≥4:12: max. 1.3 m projection, can't extend beyond the roof edge. Wall-mounted: min. 2.4 m above grade, max. 0.6 m projection."},
  {"id":"d1-21","sec":"571.2","title":"Skateboard and Sports Ramps","summary":"One envelope per parcel, max. 1.5 m high × 5.0 m wide × 6.0 m long (multiple structures may share the envelope; at-grade surfaces like soil/grass/concrete are excluded from the envelope). Safety railings may extend beyond the envelope but can't be used as a riding surface. Must sit between the rear building façade and the rear property line, min. 1.2 m from side and rear property lines, and can't attach to a deck/structure/fence/building. May count toward landscaped area, hard/soft-surfaced landscaped area, or common amenity space (§550/§551/§557 notwithstanding)."},
  {"id":"d1-22","sec":"572","title":"Gated Access","summary":"A gate can't be located across a private condominium roadway."},
  {"id":"d1-23","sec":"573","title":"Single Detached, Semi-Detached, Duplex Dwellings, Secondary Suites and Backyard Suites","summary":"These uses (plus a non-MRD-combined Accessory Residential Building) must comply with the R-CG District's own rules for that use type, not M-2's general standards."},
  {"id":"d1-24","sec":"574","title":"Parcel Access","summary":"All developments must comply with the Controlled Streets Bylaw."},
  {"id":"d1-25","sec":"575","title":"Commercial Multi-Residential Uses","summary":"Defines “commercial multi-residential uses” as only those specifically listed in the M-H1, M-H2, M-H3, M-X1, and M-X2 Districts. Not applicable to M-2 — no commercial multi-residential use appears in M-2's permitted or discretionary list."}
],
"part6div7": [
  {"id":"d7-0","sec":"625","title":"Purpose","summary":"Confirm the project fits the intended character: applies to the Developing Area; Multi-Residential Development with higher Dwelling Unit counts/traffic generation than low density residential districts and the M-G and M-1 Districts; Multi-Residential Development in a variety of forms; medium height and medium density; intensity measured by floor area ratio to allow flexibility in building form and Dwelling Unit size/number; close proximity/adjacent to low density residential development; typically located at community nodes or transit/transportation corridors and nodes; must achieve a minimum density; provides for permitted-use Multi-Residential Development on small parcels; outdoor space for social interaction; landscaping that complements the design and helps screen/buffer impacts on residents or nearby parcels. (Informational — useful for discretionary-use judgment calls.)"},
  {"id":"d7-1","sec":"626","title":"Permitted Uses","summary":"Permitted — 626: Accessory Residential Building, Home Based Child Care – Class 1, Home Occupation – Class 1, Multi-Residential Development – Minor, Park, Protective and Emergency Service, Sign – Class A, Utilities (8 uses; (g) deleted). No conditional/building-history clause in this district — unlike M-CG/M-C1/M-C2, M-2 has no School Authority or Community Recreation Facility uses at all."},
  {"id":"d7-2","sec":"627","title":"Discretionary Uses","summary":"Discretionary — 627: 19 uses (see Use tab), Addiction Treatment through Utility Building — includes Child Care Service, which M-G's discretionary list doesn't have. No conditional/building-history clause — every use in this list is unconditionally discretionary."},
  {"id":"d7-3","sec":"628","title":"Rules","summary":"Confirms all M-2 uses must also comply with: the General Rules for Multi-Residential Land Use Districts referenced in Part 6, Division 1 (above); the Rules Governing All Districts referenced in Part 3; and the applicable Uses And Use Rules referenced in Part 4."},
  {"id":"d7-4","sec":"629","title":"Floor Area Ratio","summary":"Max. floor area ratio is 3.0, unless a lower number follows the letter 'f' on the Land Use District Maps for the parcel, in which case that number governs instead as the maximum floor area ratio (must be less than 3.0). Confirm the map designation directly."},
  {"id":"d7-5","sec":"630","title":"Density","summary":"Min. density is 60 units/hectare. No maximum density applies, unless the parcel is designated M-2 followed by the letter 'd' and a number on the Land Use District Maps, in which case that number (in units per hectare) governs instead as the maximum — and must not be less than the 60 units/hectare minimum. Confirm the map designation directly."},
  {"id":"d7-6","sec":"631","title":"Setback Area","summary":"The depth of all setback areas must equal the minimum building setback required by §632."},
  {"id":"d7-7","sec":"632","title":"Building Setbacks","summary":"Front (street) setback: min. 3.0 m, EXCEPT 0 m for a street-oriented multi-residential building. Min. building setback from a lane = 1.2 m. Min. building setback from another parcel = 1.2 m, EXCEPT 0 m for a street-oriented multi-residential building where the adjoining parcel is designated C-N1 or C-COR1 District, or M-G, M-1, M-2, M-H1, M-H2, M-H3, M-X1, or M-X2 District."},
  {"id":"d7-8","sec":"633","title":"Landscaping","summary":"At least 90.0% of the required landscaped area must be provided at grade."},
  {"id":"d7-9","sec":"634","title":"Building Height","summary":"Unless (2)/(3) apply, max. building height is 16.0 m. Where the parcel shares a property line with a low density residential district or M-G District: max. height is 11.0 m at that shared property line, increasing proportionately to 16.0 m at 5.0 m from it. Where the parcel shares a property line with a street: max. height is 10.0 m within 3.0 m of that shared property line, and 16.0 m beyond 3.0 m from it. See Illustration 7."}
],

  {"id":"p3-1","sec":"54","title":"Airport Vicinity Regulations","summary":"If the parcel falls within an Airport Vicinity Protection Area (noise/height contours around Calgary Intl. or Springbank), additional height, noise-attenuation construction, and use restrictions apply. Confirm against the current AVPA maps/bylaw."},

  {"id":"p3-14","sec":"77-90","title":"Class A Signs (permitted use in M-2)","summary":"Includes Address, Art, Banner, Construction, Directional, Flag, Pedestrian, Real Estate, Special Event, Show Home, Temporary, and Window sign sub-rules. Check whichever sub-types are proposed."},

  {"id":"p3-16","sec":"94-97","title":"Class C Signs (discretionary use in M-2) — Freestanding Sign","summary":"Freestanding sign rules: number allowed, size and height restrictions. M-2's Freestanding Sign caps (§97(5)): max. sign area 5.0 square metres, max. height 4.0 metres — the low density residential / M-CG / M-C1 / M-C2 / M-G / M-1 / M-2 / H-GO figure, lower than the commercial and other multi-residential district allowances."},
  {"id":"p3-17","sec":"98-102","title":"Class D Signs (discretionary use in M-2) — Canopy / Projecting Sign","summary":"Canopy sign rules (copy area max. 50.0% of canopy area, can't extend beyond the canopy structure) and projecting sign rules (max. one per business per primary wall, max. height generally 6.0 m, min. 2.4 m clearance from grade). M-2's Projecting Sign area cap (§102(4)): max. 1.0 square metre — M-2 isn't listed in §102(1)-(3)'s higher commercial/mixed-use/other-multi-residential allowances, so the default figure applies."},
  {"id":"p3-18","sec":"103-109","title":"Class E Signs (discretionary use in M-2)","summary":"Includes Digital Message Sign, Inflatable Sign, Painted Wall Sign, Roof Sign, Rotating Sign, and Temporary Sign Marker sub-rules."},
  {"id":"p3-19","sec":"111-115.5","title":"Class F/G — Not a Listed Use in M-2","summary":"Third Party Advertising Sign rules. Sign – Class F and Sign – Class G are not in M-2's permitted or discretionary use list — confirm no Class F/G signage is proposed."},
  {"id":"p3-20","sec":"116","title":"Parking — General Rules","summary":"Baseline rules governing all required parking/loading."},
  {"id":"p3-21","sec":"117","title":"Parking Stall Signage","summary":"Signage requirements for parking stalls (e.g., accessible stalls)."},
  {"id":"p3-22","sec":"118","title":"Location of Parking and Loading Requirements","summary":"Where parking/loading areas may be sited on the parcel relative to setbacks, streets, and buildings."},
  {"id":"p3-23","sec":"119","title":"Use of Parking and Loading Stalls","summary":"Restrictions on how required stalls may be used (can't be used for storage, sales display, etc.)."},
  {"id":"p3-24","sec":"120","title":"Identification of Required Parking/Loading Stalls","summary":"How required stalls must be marked/identified on-site and on drawings."},
  {"id":"p3-25","sec":"121","title":"Calculation of Minimum Parking/Loading Stalls","summary":"M-2's own Motor Vehicle Parking Stall rate lives in the General Rules tab (§558): 0.625 stalls per Dwelling Unit/suite (Live Work Unit: 0.625 resident + 0.5 visitor), reduced 25.0% for qualifying transit-supportive locations (§560) — this citywide section is the general calculation mechanism, but §558 (General Rules tab) supplies M-2's actual ratio."},
  {"id":"p3-26","sec":"122","title":"Standards for Motor Vehicle Parking Stalls","summary":"Stall/aisle dimensions and layout standards."},
  {"id":"p3-27","sec":"123","title":"Loading Stalls","summary":"Required loading stall size and count standards. Typically N/A for M-2's residential uses — confirm for any institutional discretionary use proposed (e.g. Residential Care, Assisted Living)."},
  {"id":"p3-28","sec":"124","title":"Relaxations of Parking/Loading Requirements","summary":"Circumstances where the Development Authority may relax parking/loading counts."},
  {"id":"p3-29","sec":"124.1","title":"Parking Stall Exemptions","summary":"Specific exemptions from providing required parking stalls."},
  {"id":"p3-30","sec":"125","title":"Bicycle Parking Stalls","summary":"M-2's own bicycle parking rule lives in the General Rules tab (§559): min. 0.5 Class 1 stall per unit + 0.5 Class 1 stall per suite, plus 0.1 Class 2 stalls per unit for developments of 20+ units (min. 2.0 Class 2 stalls) — see General Rules tab."},
  {"id":"p3-31","sec":"126","title":"Motor Vehicle Pick-Up and Drop-Off Stalls","summary":"M-2 has no Drive Through or similar pick-up/drop-off use in its permitted/discretionary list — typically N/A."},
  {"id":"p3-32","sec":"129.1","title":"Infrastructure Requirements","summary":"The Development Authority must confirm adequate sewage collection/treatment/disposal, water supply/treatment/distribution, stormwater collection/storage, and road infrastructure capacity to serve the development."}

</script>
<script>
(function(){
  "use strict";

  const TABS = [
    {key:"instructions", label:"Instructions", short:"Start here"},
    {key:"part6div1", label:"Part 6 — Multi-Residential General Rules", short:"Sec. 549–575"},
    {key:"part6div7", label:"Part 6 — M-2 District Rules", short:"Sec. 625–634"},
    {key:"part3", label:"Part 3 — Citywide Rules", short:"Sec. 53–129.1"},
    {key:"part4", label:"Part 4 — Use Rules", short:"Permitted & discretionary uses"},
  ];

  const STATUS_OPTS = [
    {key:"Pass", cls:"sel-pass"},
    {key:"Fail", cls:"sel-fail"},
    {key:"Pending Info", cls:"sel-pending"},
    {key:"N/A", cls:"sel-na"},
  ];

  // No browser storage of any kind is used. This file may be opened as a
  // plain local file (file://) with no server and no persistent storage API
  // available, so all state lives in memory for the current tab only.
  // The CSV export/import pair below is the sole persistence mechanism.
  let state = {
    activeTab: "instructions",
    search: "",
    statusFilter: null, // null = all
    responses: {},      // id -> {status, notes, proposed}
    project: {projNum:"", name:"", addr:"", file:"", reviewer:""},
    notesOpen: {},       // id -> bool, transient
  };

  function initState(){
    applyProjectToFields();
    renderAll();
  }

  function showToast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._hideTimer);
    t._hideTimer = setTimeout(()=>t.classList.remove("show"), 1400);
  }

  function applyProjectToFields(){
    document.getElementById("f-projnum").value = state.project.projNum || "";
    document.getElementById("f-name").value = state.project.name || "";
    document.getElementById("f-addr").value = state.project.addr || "";
    document.getElementById("f-file").value = state.project.file || "";
    document.getElementById("f-reviewer").value = state.project.reviewer || "";
  }

  function getResponse(id){
    return state.responses[id] || {status:null, notes:"", proposed:false};
  }

  function setResponse(id, patch){
    const cur = getResponse(id);
    state.responses[id] = Object.assign({}, cur, patch);
  }

  function allItemsForTab(tabKey){
    return CHECKLIST_DATA[tabKey] || [];
  }

  // Part 4 is scoped to whichever uses have been selected from the top
  // dropdown (state.responses[id].proposed === true). Uses not selected
  // are not "in review" and don't count toward progress or show as cards.
  function isSelectableUse(item){
    return /^(Permitted|Discretionary)\b/i.test(item.summary || "");
  }

  function selectedPart4Items(){
    return allItemsForTab("part4").filter(it => getResponse(it.id).proposed);
  }

  function scopedItemsForTab(tabKey){
    return tabKey === "part4" ? selectedPart4Items() : allItemsForTab(tabKey);
  }

  function tabCounts(tabKey){
    const items = scopedItemsForTab(tabKey);
    if(!items.length) return {done:0, total:0};
    let done = 0;
    items.forEach(it=>{
      const r = getResponse(it.id);
      if(r.status) done++;
    });
    return {done, total: items.length};
  }

  function overallProgress(){
    let done=0, total=0;
    ["part6div1","part6div7","part3","part4"].forEach(k=>{
      const c = tabCounts(k);
      done += c.done; total += c.total;
    });
    return {done, total};
  }

  // ---------------- Rendering ----------------

  function renderAll(){
    renderTabNav();
    renderOverallProgress();
    renderMain();
  }

  // Every click handler in the app (status pills, use-selector dropdown,
  // remove-from-review, filter chips) calls this instead of touching only
  // the element that was clicked. It rebuilds tab counts, the overall
  // progress bar, and the whole main panel every time, so nothing in the
  // sidebar or stat strip can ever go stale relative to what was clicked.
  // Scroll position in the main panel is preserved across the rebuild.
  function refreshEverything(){
    const main = document.getElementById("main");
    const scrollTop = main ? main.scrollTop : 0;
    renderTabNav();
    renderOverallProgress();
    renderMain();
    const restoreScroll = ()=>{
      const m = document.getElementById("main");
      if(m) m.scrollTop = scrollTop;
    };
    if(typeof requestAnimationFrame === "function"){
      requestAnimationFrame(restoreScroll);
    } else {
      restoreScroll();
    }
  }

  function renderTabNav(){
    const nav = document.getElementById("tabnav");
    nav.innerHTML = "";
    TABS.forEach(tab=>{
      const btn = document.createElement("button");
      btn.className = "tab-btn" + (state.activeTab===tab.key ? " active":"");
      const left = document.createElement("span");
      left.className = "tname";
      left.innerHTML = `<span>${tab.label}</span><span class="tsec">${tab.short}</span>`;
      btn.appendChild(left);
      if(tab.key !== "instructions"){
        const c = tabCounts(tab.key);
        const count = document.createElement("span");
        count.className = "tab-count";
        count.textContent = `${c.done}/${c.total}`;
        btn.appendChild(count);
      }
      btn.addEventListener("click", ()=>{
        state.activeTab = tab.key;
        state.search = "";
        state.statusFilter = null;
        renderAll();
      });
      nav.appendChild(btn);
    });
  }

  function renderOverallProgress(){
    const {done,total} = overallProgress();
    const pct = total ? Math.round((done/total)*100) : 0;
    document.getElementById("overall-pct").textContent = `${pct}% (${done}/${total})`;
    document.getElementById("overall-fill").style.width = pct + "%";
  }

  function renderMain(){
    const main = document.getElementById("main");
    main.innerHTML = "";
    if(state.activeTab === "instructions"){
      main.appendChild(buildInstructions());
      return;
    }
    main.appendChild(buildPanelHead());
    main.appendChild(buildStatStrip());
    const list = buildCardList();
    main.appendChild(list);
  }

  function buildInstructions(){
    const wrap = document.createElement("div");

    const head = document.createElement("div");
    head.className = "panel-head";
    head.innerHTML = `<div><h2>How to use this checklist</h2>
      <p>An interactive companion to the M-2 Zoning Review Checklist, built from the sections of Land Use Bylaw 1P2007 that reference the M-2 district, multi-residential districts generally, or all districts.</p></div>`;
    wrap.appendChild(head);

    const b1 = document.createElement("div");
    b1.className = "instr-block";
    b1.innerHTML = `<h3>Workflow</h3>
      <ol>
        <li>Fill in the project fields in the sidebar, starting with <b>Project number</b> — it's used to name your session file.</li>
        <li><b>Part 6 — Multi-Residential General Rules</b> and <b>Part 6 — M-2 District Rules</b> apply to every M-2 project without exception. Work through these first — unlike M-G, M-2 does NOT have its own overriding amenity space rule, so the General tab's §557 amenity space card governs directly. M-2 also has its own Floor Area Ratio rule (§629) on the District tab — no other M District in this family carries an FAR limit.</li>
        <li><b>Part 3 — Citywide Rules</b> applies to every district in Calgary, including M-2. Don't skip it.</li>
        <li><b>Part 4 — Use Rules</b> is use-dependent. Add whichever use(s) are actually proposed from the dropdown, then look up that Part 4 section number in the bylaw directly for the detailed use-specific requirements. Like M-G, M-2 has no conditional/building-history uses — every listed use is either unconditionally permitted or unconditionally discretionary.</li>
        <li>Click a status pill (Pass / Fail / Pending Info / N/A) on each article. Use "Notes" to log evidence, drawing references, or follow-ups.</li>
        <li><b>Nothing autosaves.</b> This is a standalone file with no server and no browser storage behind it — your answers exist only in this tab. Click <b>Export session (.csv)</b> in the sidebar to save your progress across all 69 fixed checks (26 general + 10 district + 33 citywide) plus whichever of the 27 use-tab items you add, and <b>Import session (.csv)</b> to reload a previously exported file and pick up where you left off.</li>
      </ol>`;
    wrap.appendChild(b1);

    const b2 = document.createElement("div");
    b2.className = "instr-block";
    b2.innerHTML = `<h3>Scope — what this does <em>not</em> cover</h3>
      <p>This is a generic template, not a substitute for reading the bylaw. It excludes Part 1/2 (definitions, general administration), the ~250 Part 4 use definitions not listed under M-2, subdivision requirements, and site-specific overlays — Direct Control variations, a registered Comprehensive Sign Program, restrictive covenants, or Airport Vicinity Protection Area maps. M-2's floor area ratio (§629) and minimum/maximum density (§630) can each be superseded per-parcel by an 'f' or 'd' suffix on the Land Use District Map — this tool doesn't look up the map suffix for you. M-2 has no Single Detached, Semi-detached, or Duplex Dwelling, Secondary Suite, or Backyard Suite uses in its own list, so the R-CG cross-reference in §573 is only relevant if one of those is proposed as an unusual variance — confirm against the R-CG checklist if so. Confirm all of this separately for your parcel, and always check the current consolidated bylaw on calgary.ca since it is amended regularly.</p>`;
    wrap.appendChild(b2);

    const b3 = document.createElement("div");
    b3.className = "instr-block";
    b3.innerHTML = `<h3>Status legend</h3>
      <div class="legend-grid">
        <div class="legend-card" style="background:var(--pass-bg);color:var(--pass);"><b>Pass</b>&nbsp;— confirmed compliant</div>
        <div class="legend-card" style="background:var(--fail-bg);color:var(--fail);"><b>Fail</b>&nbsp;— non-compliant, needs a change or relaxation</div>
        <div class="legend-card" style="background:var(--pending-bg);color:var(--pending);"><b>Pending Info</b>&nbsp;— need more drawings/info</div>
        <div class="legend-card" style="background:var(--na-bg);color:var(--na);"><b>N/A</b>&nbsp;— not applicable to this project</div>
      </div>`;
    wrap.appendChild(b3);

    return wrap;
  }

  function buildPanelHead(){
    const tab = TABS.find(t=>t.key===state.activeTab);
    const head = document.createElement("div");
    head.className = "panel-head";

    const left = document.createElement("div");
    left.innerHTML = `<h2>${tab.label}</h2><p>${panelDescription(state.activeTab)}</p>`;
    head.appendChild(left);

    const tools = document.createElement("div");
    tools.className = "panel-tools";

    if(state.activeTab === "part4"){
      tools.appendChild(buildUseSelector());
    }

    const search = document.createElement("input");
    search.className = "search-box";
    search.type = "text";
    search.placeholder = "Search this tab…";
    search.value = state.search;
    search.addEventListener("input", (e)=>{ state.search = e.target.value; renderMain(); preserveFocus(search); });
    tools.appendChild(search);

    ["Fail","Pending Info"].forEach(s=>{
      const chip = document.createElement("button");
      chip.className = "filter-chip" + (state.statusFilter===s ? " active":"");
      chip.textContent = s === "Pending Info" ? "Pending only" : "Fails only";
      chip.addEventListener("click", ()=>{
        state.statusFilter = state.statusFilter===s ? null : s;
        refreshEverything();
      });
      tools.appendChild(chip);
    });

    head.appendChild(tools);
    return head;
  }

  // Dropdown listing only Part 4 items whose status is Permitted or
  // Discretionary (isSelectableUse) — nothing else is offered. Picking one
  // adds it to the reviewed-uses set (proposed:true) and the card for that
  // use (with its specific rule text and pass/fail controls) appears below.
  function buildUseSelector(){
    const wrap = document.createElement("div");
    wrap.className = "use-select-wrap";

    const select = document.createElement("select");
    select.className = "use-select";

    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "+ Add a use to review…";
    select.appendChild(placeholder);

    const groups = [
      {label:"Permitted uses", test: s => /^Permitted/i.test(s)},
      {label:"Discretionary uses", test: s => /^Discretionary/i.test(s)},
    ];
    groups.forEach(g=>{
      const items = allItemsForTab("part4")
        .filter(it => isSelectableUse(it) && g.test(it.summary) && !getResponse(it.id).proposed)
        .sort((a,b)=> a.title.localeCompare(b.title));
      if(!items.length) return;
      const optgroup = document.createElement("optgroup");
      optgroup.label = g.label;
      items.forEach(it=>{
        const opt = document.createElement("option");
        opt.value = it.id;
        opt.textContent = `${it.title} (${it.sec})`;
        optgroup.appendChild(opt);
      });
      select.appendChild(optgroup);
    });

    select.addEventListener("change", (e)=>{
      const id = e.target.value;
      if(!id) return;
      setResponse(id, {proposed:true});
      refreshEverything();
    });

    wrap.appendChild(select);

    const count = selectedPart4Items().length;
    if(count){
      const badge = document.createElement("span");
      badge.className = "use-select-count";
      badge.textContent = `${count} use${count===1?"":"s"} in review`;
      wrap.appendChild(badge);
    }

    return wrap;
  }

  function panelDescription(key){
    if(key==="part6div1") return "General rules for all Multi-Residential land use districts — landscaping, amenity space, parking/bicycle stall rates, accessory buildings, garbage, screening, fences, solar collectors, skateboard/sports ramps. Always applicable.";
    if(key==="part6div7") return "M-2-specific rules — permitted/discretionary uses, floor area ratio, min. density, setbacks, landscaping, building height (with a low-density-residential/M-G adjacency stepback and a street-adjacency stepback). Always applicable. §629 (FAR) and §630 (density max.) can each be set per-parcel by a map 'f'/'d' suffix — confirm directly.";
    if(key==="part3") return "Rules Governing All Districts — public realm setbacks, airport vicinity, floodway, lighting, signs, parking/loading, servicing. Applies to M-2 the same as every other district. Sign figures shown are M-2's own (lower, residential-scale) allowances, and the Dwelling Unit/Live Work Unit parking and bicycle rates are M-2's own from the General tab, not the generic Part 4 per-use lookup.";
    if(key==="part4") return "Add the proposed use(s) from the dropdown — only the 27 M-2 uses (8 permitted, 19 discretionary) are offered. Like M-G, none of M-2's uses are conditional on building history — there's no District Conditions sidebar for this district.";
    return "";
  }

  function preserveFocus(el){
    // re-focus the search box after re-render (since renderMain rebuilds the DOM)
    const refocus = ()=>{
      const s = document.querySelector(".search-box");
      if(s){ s.focus(); const v=s.value; s.value=""; s.value=v; }
    };
    if(typeof requestAnimationFrame === "function"){
      requestAnimationFrame(refocus);
    } else {
      refocus();
    }
  }

  function buildStatStrip(){
    const items = filteredItems();
    const scoped = scopedItemsForTab(state.activeTab);
    const strip = document.createElement("div");
    strip.className = "stat-strip";
    const counts = {"Pass":0,"Fail":0,"Pending Info":0,"N/A":0,"none":0};
    scoped.forEach(it=>{
      const r = getResponse(it.id);
      if(r.status) counts[r.status] = (counts[r.status]||0)+1;
      else counts.none++;
    });
    const defs = [
      ["Pass", "var(--pass)"],["Fail","var(--fail)"],["Pending Info","var(--pending)"],
      ["N/A","var(--na)"],["Not started","var(--ink-soft)"]
    ];
    const map = {"Pass":counts.Pass,"Fail":counts.Fail,"Pending Info":counts["Pending Info"],"N/A":counts["N/A"],"Not started":counts.none};
    defs.forEach(([label,color])=>{
      const s = document.createElement("div");
      s.className = "stat";
      s.innerHTML = `<span class="swatch" style="background:${color}"></span><b>${map[label]}</b> ${label}`;
      strip.appendChild(s);
    });
    if(items.length !== scoped.length){
      const s = document.createElement("div");
      s.className = "stat";
      s.style.marginLeft = "auto";
      s.textContent = `Showing ${items.length} of ${scoped.length}`;
      strip.appendChild(s);
    }
    return strip;
  }

  function filteredItems(){
    let items = scopedItemsForTab(state.activeTab);
    if(state.search.trim()){
      const q = state.search.trim().toLowerCase();
      items = items.filter(it =>
        it.sec.toLowerCase().includes(q) ||
        it.title.toLowerCase().includes(q) ||
        it.summary.toLowerCase().includes(q)
      );
    }
    if(state.statusFilter){
      items = items.filter(it => getResponse(it.id).status === state.statusFilter);
    }
    return items;
  }

  function buildCardList(){
    const container = document.createElement("div");
    const items = filteredItems();
    if(!items.length){
      const empty = document.createElement("div");
      empty.className = "empty-state";
      if(state.activeTab === "part4" && !selectedPart4Items().length){
        empty.textContent = "No uses selected yet. Choose a permitted or discretionary use from the dropdown above to begin testing it.";
      } else {
        empty.textContent = "No articles match your search/filter.";
      }
      container.appendChild(empty);
      return container;
    }
    const isPart4 = state.activeTab === "part4";
    items.forEach(it=>{
      container.appendChild(buildCard(it, isPart4));
    });
    return container;
  }

  function buildCard(item, isPart4){
    const r = getResponse(item.id);
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.status = r.status || "";

    const top = document.createElement("div");
    top.className = "card-top";

    const idWrap = document.createElement("div");
    idWrap.className = "card-id";
    idWrap.innerHTML = `<span class="sec-badge mono">${escapeHtml(item.sec)}</span><h3>${escapeHtml(item.title)}</h3>`;
    top.appendChild(idWrap);

    if(isPart4){
      const removeBtn = document.createElement("button");
      removeBtn.className = "remove-use-btn";
      removeBtn.type = "button";
      removeBtn.textContent = "Remove from review";
      removeBtn.addEventListener("click", ()=>{
        setResponse(item.id, {proposed:false});
        refreshEverything();
      });
      top.appendChild(removeBtn);
    }
    card.appendChild(top);

    const summary = document.createElement("p");
    summary.className = isPart4 ? "summary use-tag" : "summary";
    summary.textContent = item.summary;
    card.appendChild(summary);

    const statusRow = document.createElement("div");
    statusRow.className = "status-row";
    STATUS_OPTS.forEach(opt=>{
      const pill = document.createElement("button");
      pill.className = "status-pill" + (r.status===opt.key ? " "+opt.cls : "");
      pill.textContent = opt.key;
      pill.addEventListener("click", ()=>{
        const newStatus = r.status===opt.key ? null : opt.key;
        setResponse(item.id, {status:newStatus});
        refreshEverything();
      });
      statusRow.appendChild(pill);
    });

    const notesToggle = document.createElement("button");
    notesToggle.className = "notes-toggle";
    notesToggle.textContent = state.notesOpen[item.id] ? "Hide notes" : (r.notes ? "Edit notes ●" : "Add notes");
    notesToggle.addEventListener("click", ()=>{
      state.notesOpen[item.id] = !state.notesOpen[item.id];
      notesArea.classList.toggle("open", state.notesOpen[item.id]);
      notesToggle.textContent = state.notesOpen[item.id] ? "Hide notes" : (r.notes ? "Edit notes ●" : "Add notes");
      if(state.notesOpen[item.id]) textarea.focus();
    });
    statusRow.appendChild(notesToggle);
    card.appendChild(statusRow);

    const notesArea = document.createElement("div");
    notesArea.className = "notes-area" + (state.notesOpen[item.id] ? " open":"");
    const textarea = document.createElement("textarea");
    textarea.placeholder = "Notes, drawing references, follow-up items…";
    textarea.value = r.notes || "";
    textarea.addEventListener("input", (e)=>{
      setResponse(item.id, {notes: e.target.value});
    });
    notesArea.appendChild(textarea);
    card.appendChild(notesArea);

    return card;
  }

  function escapeHtml(s){
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  // ---------------- Session export / import (CSV = the persistent record) ----------------

  const DATA_TAB_KEYS = ["part6div1","part6div7","part3","part4"];
  const ITEM_HEADERS = ["Part","Section","Article Title","Requirement Summary","Proposed","Review Status","Notes","ID"];
  const META_FIELDS = [
    ["Project number", "projNum", "text"],
    ["Project name", "name", "text"],
    ["Site address / legal desc.", "addr", "text"],
    ["DP / file no.", "file", "text"],
    ["Reviewer", "reviewer", "text"],
  ];

  function todayStr(){
    const d = new Date();
    const p = n => String(n).padStart(2,"0");
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  }

  function sanitizeForFilename(s){
    return String(s||"").trim().replace(/[\\/:*?"<>|]+/g,"-").replace(/\s+/g," ").trim();
  }

  function buildExportRows(){
    const rows = [];
    rows.push(["Field","Value"]);
    META_FIELDS.forEach(([label,key,type])=>{
      const val = type === "bool" ? (state.project[key] ? "Yes" : "No") : (state.project[key] || "");
      rows.push([label, val]);
    });
    rows.push(["Export date", todayStr()]);
    const totalDone = overallProgress();
    rows.push(["Progress", `${totalDone.done}/${totalDone.total} checks completed`]);
    rows.push([]); // blank separator row
    rows.push(ITEM_HEADERS);
    DATA_TAB_KEYS.forEach(key=>{
      const tab = TABS.find(t=>t.key===key);
      allItemsForTab(key).forEach(it=>{
        const r = getResponse(it.id);
        const isPart4 = key === "part4";
        rows.push([
          tab.label,
          it.sec,
          it.title,
          it.summary,
          isPart4 ? (r.proposed ? "Yes" : "No") : "",
          r.status || "",
          r.notes || "",
          it.id,
        ]);
      });
    });
    return rows;
  }

  function exportCsv(){
    const rows = buildExportRows();
    const csv = rows.map(row => row.map(csvEscape).join(",")).join("\r\n");
    const blob = new Blob(["﻿" + csv], {type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const projNum = sanitizeForFilename(state.project.projNum) || "Unnumbered";
    a.href = url;
    a.download = `${projNum} - ${todayStr()} - LUB Review.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    const {done,total} = overallProgress();
    showToast(`Exported — ${done}/${total} checks saved`);
  }

  function csvEscape(val){
    const s = String(val==null ? "" : val);
    if(/[",\r\n]/.test(s)){
      return '"' + s.replace(/"/g,'""') + '"';
    }
    return s;
  }

  // RFC4180-ish parser: handles quoted fields containing commas, quotes, and newlines.
  function parseCsvText(text){
    const rows = [];
    let row = [];
    let field = "";
    let inQuotes = false;
    // Normalize a leading BOM if present.
    if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    for(let i=0; i<text.length; i++){
      const c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){ field += '"'; i++; }
          else { inQuotes = false; }
        } else {
          field += c;
        }
      } else {
        if(c === '"'){
          inQuotes = true;
        } else if(c === ','){
          row.push(field); field = "";
        } else if(c === '\r'){
          // skip; \n (or end) will terminate the row
        } else if(c === '\n'){
          row.push(field); field = "";
          rows.push(row); row = [];
        } else {
          field += c;
        }
      }
    }
    // flush trailing field/row if the file doesn't end with a newline
    if(field.length || row.length){
      row.push(field);
      rows.push(row);
    }
    return rows.filter(r => !(r.length===1 && r[0]===""));
  }

  function importCsv(file){
    const reader = new FileReader();
    reader.onload = (e)=>{
      let rows;
      try{
        rows = parseCsvText(String(e.target.result));
      }catch(err){
        showToast("Import failed — couldn't read this file as CSV");
        return;
      }
      const headerIdx = rows.findIndex(r => r[0] === "Part" && r[1] === "Section");
      if(headerIdx === -1){
        showToast("Import failed — not a recognized session file");
        return;
      }

      // Parse metadata rows (everything before the item table, skipping the
      // "Field,Value" header and any Export date / Progress info rows).
      const metaByLabel = {};
      for(let i=0; i<headerIdx; i++){
        const [label, value] = rows[i];
        if(label && label !== "Field") metaByLabel[label] = value;
      }
      const newProject = {};
      META_FIELDS.forEach(([label,key,type])=>{
        newProject[key] = type === "bool" ? (metaByLabel[label] === "Yes") : (metaByLabel[label] || "");
      });

      // Parse item rows, matched back to known checklist items by ID.
      const knownIds = new Set();
      DATA_TAB_KEYS.forEach(key => allItemsForTab(key).forEach(it => knownIds.add(it.id)));
      const newResponses = {};
      let matched = 0, skipped = 0;
      for(let i=headerIdx+1; i<rows.length; i++){
        const r = rows[i];
        if(!r.length || r.every(c=>c==="")) continue;
        const [ , , , , proposedCol, statusCol, notesCol, idCol] = r;
        const id = idCol;
        if(!id || !knownIds.has(id)){ skipped++; continue; }
        newResponses[id] = {
          status: statusCol || null,
          notes: notesCol || "",
          proposed: proposedCol === "Yes",
        };
        matched++;
      }

      if(!matched){
        showToast("Import failed — no matching checklist items found in that file");
        return;
      }

      state.project = newProject;
      state.responses = newResponses;
      state.notesOpen = {};
      applyProjectToFields();
      renderAll();
      showToast(`Imported — ${matched} checks loaded${skipped ? `, ${skipped} rows skipped` : ""}`);
    };
    reader.onerror = ()=> showToast("Import failed — couldn't read that file");
    reader.readAsText(file);
  }

  // ---------------- Project field bindings ----------------
  function bindProjectFields(){
    const map = {"f-projnum":"projNum","f-name":"name","f-addr":"addr","f-file":"file","f-reviewer":"reviewer"};
    Object.keys(map).forEach(id=>{
      const el = document.getElementById(id);
      el.addEventListener("input", (e)=>{
        state.project[map[id]] = e.target.value;
      });
    });
  }

  function bindSessionButtons(){
    document.getElementById("btn-export").addEventListener("click", exportCsv);
    const fileInput = document.getElementById("file-import");
    document.getElementById("btn-import").addEventListener("click", ()=> fileInput.click());
    fileInput.addEventListener("change", (e)=>{
      const file = e.target.files && e.target.files[0];
      if(file) importCsv(file);
      fileInput.value = "";
    });
  }

  // ---------------- Init ----------------
  bindProjectFields();
  bindSessionButtons();
  initState();

})();

</script>

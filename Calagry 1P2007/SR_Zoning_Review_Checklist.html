{"id": "use-0", "sec": "243", "title": "Natural Area", "summary": "Permitted \u2014 1042(a) \u2014 Open space set aside to maintain an existing natural/native plant or animal community, or to allow disturbed land to be naturalized. May include benches, interpretive displays, pathways, picnic shelters, trails, viewpoints, washrooms, and small maintenance/study buildings \u226475.0 m\u00b2. Any parking area must sit min. 3.0 m from the nearest property line. Does not require motor vehicle or bicycle parking stalls. Exempt from the district's landscaped-area requirement (\u00a71014(2))."},
{"id": "use-1", "sec": "249", "title": "Park", "summary": "Permitted \u2014 1042(b) \u2014 Open space set aside for recreational, educational, cultural, or aesthetic purposes; may include land/buildings for growing food (sheds, compost bins, greenhouses, raised beds, cold frames, hoop enclosures) and washrooms/small maintenance sheds <10.0 m\u00b2. Any parking area must sit min. 3.0 m from the nearest property line. Does not require motor vehicle or bicycle parking stalls. Exempt from the district's landscaped-area requirement (\u00a71014(2)). A Digital Message Sign is available here under S-R's broad \u00a7104(1) availability (see Citywide tab) \u2014 no use-association test needed, unlike S-CS."},
{"id": "use-2", "sec": "251", "title": "Park Maintenance Facility \u2013 Small", "summary": "Permitted \u2014 1042(c) \u2014 Storage of park maintenance equipment, vehicles, or materials; total building GFA \u2264300.0 m\u00b2. Screening required for stored piles/stacks of loose materials, equal in height to the stored materials; a berm (max 3:1 slope) may satisfy the screening requirement. Does not require motor vehicle or bicycle parking stalls."},
{"id": "use-3", "sec": "266", "title": "Power Generation Facility \u2013 Small", "summary": "Permitted \u2014 1042(d) \u2014 Capacity 10 W\u20131.0 MW (excludes WECS Type 1/2, tracked separately below). Must not exceed the district height, excl. ancillary structures; can't sit in a required setback except solar collectors; must be screened except solar collectors. Does not require motor vehicle or bicycle parking stalls."},
{"id": "use-4", "sec": "299", "title": "Sign \u2013 Class A", "summary": "Permitted \u2014 1042(e) \u2014 Address, Art, Banner, Construction, Directional, Election, Flag, Pedestrian, Real Estate, Special Event, Temporary, and Window sign sub-types."},
{"id": "use-5", "sec": "321", "title": "Utilities", "summary": "Permitted \u2014 1042(g) \u2014 note: \u00a71042(f) is deleted. Facilities for water distribution/irrigation/drainage, waste water collection, gas, water heating/cooling for district energy, electricity, cable, telephone, and telecommunications; excludes Utilities \u2013 Linear and Utility Building. Building housing the use must not exceed 10.0 m\u00b2 GFA. Does not require motor vehicle or bicycle parking stalls."},
{"id": "use-6", "sec": "168", "title": "Community Entrance Feature", "summary": "Discretionary \u2014 1043(1)(a) \u2014 Landscape attraction, monument, or sign identifying a residential community. Requires a maintenance/removal agreement with the Development Authority; DP conditions may govern location, size, design, copy, character, and number allowed per community. Must use maintenance-free materials wherever possible and must not encroach on utility rights-of-way or affect traffic safety."},
{"id": "use-7", "sec": "169", "title": "Community Recreation Facility", "summary": "Discretionary \u2014 1043(1)(b) \u2014 Neighbourhood-serving, voluntary-membership use providing recreation/leisure programs, with indoor recreation space and possible outdoor sports fields on the same parcel; may include temporary local-food processing/sale. Requires min. 1.0 bicycle stall \u2013 class 2 per 250.0 m\u00b2 of gross usable floor area (no class 1 required). A Digital Message Sign is available here under S-R's broad \u00a7104(1) availability (see Citywide tab)."},
{"id": "use-8", "sec": "198", "title": "Food Kiosk", "summary": "Discretionary \u2014 1043(1)(c) \u2014 Max. 75.0 m\u00b2 GFA; no seating area; must not be combined with a Drive Through. Does not require bicycle parking stalls (class 1 or 2)."},
{"id": "use-9", "sec": "211", "title": "Indoor Recreation Facility", "summary": "Discretionary \u2014 1043(1)(d) \u2014 Building specifically built or adapted for athletic, recreation, or leisure activities (pools, rinks, gymnasia); may include outdoor sports fields on the same parcel and occasional spectator seating. Requires min. 0.5 bicycle stalls \u2013 class 2 per 100.0 m\u00b2 of gross usable floor area (no class 1 required). A Digital Message Sign is available here under S-R's broad \u00a7104(1) availability (see Citywide tab)."},
{"id": "use-10", "sec": "224", "title": "Library", "summary": "Discretionary \u2014 1043(1)(e) \u2014 Collections of materials maintained primarily for lending to the public; may include lecture theatres, meeting rooms, study space, computers, and rooms for the use's administrative functions. Does not require bicycle parking stalls \u2013 class 1; requires min. 0.5 bicycle stalls \u2013 class 2 per 100.0 m\u00b2 of gross usable floor area. A Digital Message Sign is available here under S-R's broad \u00a7104(1) availability (see Citywide tab)."},
{"id": "use-11", "sec": "242", "title": "Museum", "summary": "Discretionary \u2014 1043(1)(f) \u2014 Artifacts and information displayed, investigated, restored, and preserved for the public; may be contained entirely within or partly outside a building; may include rooms for educational programs, lecture theatres, meeting rooms, study space, computers, and administrative functions. Does not require bicycle parking stalls \u2013 class 1; requires min. 0.5 bicycle stalls \u2013 class 2 per 100.0 m\u00b2 of gross usable floor area. A Digital Message Sign is available here under S-R's broad \u00a7104(1) availability (see Citywide tab)."},
{"id": "use-12", "sec": "247", "title": "Outdoor Caf\u00e9", "summary": "Discretionary \u2014 1043(1)(g) \u2014 Must be approved together with another Eating and Drinking Group use, or with a Convenience Food Store, Brewery/Winery/Distillery, Specialty Food Store, or Supermarket. Floor must not sit >0.6 m above the first-storey floor level when within 100.0 m of a residential district. Does not require motor vehicle or bicycle parking stalls (class 1 or 2)."},
{"id": "use-13", "sec": "248", "title": "Outdoor Recreation Area", "summary": "Discretionary \u2014 1043(1)(h) \u2014 Outdoor sports/athletic use (excludes Motorized Recreation and Firing Range); may include a building with change rooms, washrooms/showers, and admin space; may provide temporary spectator seating. Does not require bicycle parking stalls (class 1 or 2). Exempt from the citywide outdoor-lighting mounting-height cap (\u00a765(2) \u2014 no max. height for this use, in any district). A Digital Message Sign is available here under S-R's broad \u00a7104(1) availability (see Citywide tab). Also the gateway use for the \u00a71043(5) conditional block \u2014 see the conditional-use cards below (Child Care Service, Conference and Event Facility, Drinking Establishment \u2013 Large/Medium/Small, Restaurant: Food Service Only, Restaurant: Licensed, Retail and Consumer Service) for uses discretionary only within a building approved as part of an Outdoor Recreation Area."},
{"id": "use-14", "sec": "250", "title": "Park Maintenance Facility \u2013 Large", "summary": "Discretionary \u2014 1043(1)(i) \u2014 Storage/servicing of park maintenance equipment, vehicles, or materials, and admin buildings for the use; total building GFA >300.0 m\u00b2 (the threshold distinguishing it from Park Maintenance Facility \u2013 Small). Screening required for stored piles/stacks of loose materials, equal in height to the stored materials; a berm (max 3:1 slope) may satisfy the screening requirement. Does not require motor vehicle or bicycle parking stalls."},
{"id": "use-15", "sec": "255", "title": "Performing Arts Centre", "summary": "Discretionary \u2014 1043(1)(j) \u2014 Live performance of theatre, music, dance, or other artistic activities available to the public. Requires a minimum number of motor vehicle parking stalls based on a parking study at the time of DP application; no class 1 bicycle stalls; requires bicycle stalls \u2013 class 2 equal to 10.0% of the minimum required motor vehicle parking stalls. Also the gateway use for one path of the \u00a71043(2) conditional block (see the conditional-use cards below)."},
{"id": "use-16", "sec": "265", "title": "Power Generation Facility \u2013 Medium", "summary": "Discretionary \u2014 1043(1)(k) \u2014 Capacity 1.0\u201312.5 MW. Must not sit within 50.0 m of a residential district (measured to the nearest property line). Must be located within a building except solar collectors; must not exceed the district height (excl. ancillary structures) nor sit in a required setback (excl. solar collectors); must be screened (excl. solar collectors). Does not require motor vehicle or bicycle parking stalls."},
{"id": "use-17", "sec": "270", "title": "Protective and Emergency Service", "summary": "Discretionary \u2014 1043(1)(l) \u2014 Police, fire, and publicly operated emergency medical services. Does not require motor vehicle or bicycle parking stalls (class 1 or 2)."},
{"id": "use-18", "sec": "298", "title": "Service Organization", "summary": "Discretionary \u2014 1043(1)(m) \u2014 Health or educational programs/services offered to the public, including Health Care Service limited to counselling; no food-preparation kitchen or public eating area; rooms for administrative functions; may include a meeting room or auditorium. Does not require bicycle parking stalls \u2013 class 1; requires min. 1.0 bicycle stall \u2013 class 2 per 250.0 m\u00b2 of gross usable floor area."},
{"id": "use-19", "sec": "300", "title": "Sign \u2013 Class B", "summary": "Discretionary \u2014 1043(1)(n) \u2014 Fascia sign only: attached to and parallel with an exterior wall, projecting max. 0.40 m from the wall."},
{"id": "use-20", "sec": "301", "title": "Sign \u2013 Class C", "summary": "Discretionary \u2014 1043(1)(o) \u2014 Freestanding sign; may incorporate a Message Sign, or a Digital Sign approved as a Sign \u2013 Class E."},
{"id": "use-21", "sec": "302", "title": "Sign \u2013 Class D", "summary": "Discretionary \u2014 1043(1)(p) \u2014 Canopy sign or Projecting sign, attached to and perpendicular from an exterior wall."},
{"id": "use-22", "sec": "303", "title": "Sign \u2013 Class E", "summary": "Discretionary \u2014 1043(1)(q), see \u00a7103-109 \u2014 Digital Message Sign, Flashing/Animated Sign, Inflatable Sign, Message Sign, Painted Wall Sign, Rotating Sign, or Temporary Sign Marker. UNLIKE S-CS/S-SPR/S-CI, a Roof Sign is NOT available in S-R \u2014 \u00a7107(1) names only S-CI and S-SPR among Special Purpose districts. A Digital Message Sign here is broadly available under \u00a7104(1) \u2014 not gated behind a use-association test as in S-CS \u2014 see the Citywide tab for the full numeric package (sign area, hours, term, highway setbacks)."},
{"id": "use-23", "sec": "304", "title": "Sign \u2013 Class F", "summary": "Discretionary \u2014 1043(1)(q.1) \u2014 UNLIKE S-CS (where Class F wasn't available at all), Third Party Advertising Sign (no digital display) is a listed use in S-R. \u00a7110, which historically set Class-F-specific numeric rules, is itself deleted \u2014 so only \u00a7111's prohibited-locations list and the general sign rules (\u00a767-76) constrain it. See the Citywide tab for the full siting detail."},
{"id": "use-24", "sec": "309", "title": "Special Function \u2013 Class 2", "summary": "Discretionary \u2014 1043(1)(q.2) \u2014 Temporary structures, on a parcel for max. 15 cumulative days/year (excluding erect/dismantle time), operating as a Brewery/Winery/Distillery, Conference and Event Facility, Drinking Establishment \u2013 Large/Medium/Small, Restaurant: Licensed, or Night Club. Max. one storey for covered structures; no openings facing a residential district unless separated by a street; may be sited anywhere on the parcel other than a corner visibility triangle. Does not require motor vehicle or bicycle parking stalls."},
{"id": "use-25", "sec": "311", "title": "Spectator Sports Facility", "summary": "Discretionary \u2014 1043(1)(r) \u2014 Sporting or other events held primarily for public entertainment, with tiers of spectator seating; excludes Motorized Recreation and Race Track. No motor-vehicle-stall formula is stated (\u00a7311(c) is deleted). No class 1 bicycle stalls; requires min. 0.5 bicycle stalls \u2013 class 2 per 100.0 m\u00b2 of gross usable floor area. Exempt from the citywide outdoor-lighting mounting-height cap (\u00a765(2) \u2014 no max. height for this use, in any district)."},
{"id": "use-26", "sec": "320.1", "title": "Urban Agriculture", "summary": "Discretionary \u2014 1043(1)(r.1) \u2014 Plants grown outdoors for a commercial purpose; may be accessory to another use; may include raised beds, cold frames, and temporary hoop enclosures \u22641.5 m height used only to extend the growing season; may include ancillary buildings and local food sales of food grown on site; must not include permanent outside storage of goods, materials, or supplies. Does not require motor vehicle or bicycle parking stalls (class 1 or 2). Exempt from the district's landscaped-area requirement (\u00a71014(2))."},
{"id": "use-27", "sec": "322", "title": "Utility Building", "summary": "Discretionary \u2014 1043(1)(s) \u2014 Building >10.0 m\u00b2 GFA housing water/steam, sewage treatment/disposal, irrigation, drainage, gas, electricity, heat, waste management, water heating/cooling for district energy, or telecommunications, wholly or partly above grade; excludes Sewage/Water Treatment Plants. Does not require bicycle parking stalls (class 1 or 2)."},
{"id": "use-28", "sec": "333.1", "title": "Wind Energy Conversion System \u2013 Type 1", "summary": "Discretionary \u2014 1043(1)(t), see \u00a71019.2 \u2014 Rotor diameter \u22644.0 m, total height \u226415.0 m (fixed by \u00a7333.1, not district-variable), CSA-certified. Must not sit in a required setback. Min. 60.0 m from a residential district (\u00a71019.2(2)). Does not require motor vehicle or bicycle parking stalls. S-R also lists Wind Energy Conversion System \u2013 Type 2 as a separate discretionary use (unlike S-CS, which lists Type 1 only) \u2014 see the next card."},
{"id": "use-29", "sec": "333.2", "title": "Wind Energy Conversion System \u2013 Type 2", "summary": "Discretionary \u2014 1043(1)(u), see \u00a71019.2 \u2014 Rotor diameter >4.0 m OR total height >15.0 m; must not be mounted to a building nor sit in a required setback. Min. 550.0 m from a residential district (\u00a71019.2(3)) \u2014 a much larger buffer than Type 1's 60.0 m. A biophysical impact assessment (literature review by a qualified biologist, field surveys, habitat assessment, consideration of the Wildlife Guidelines for Alberta Wind Energy Projects) is mandatory, not discretionary, for Type 2. Max. total WECS height 30.0 m in S-R (grouped with S-SPR and S-CI \u2014 not the 50.0 m group covering S-UN/S-CRI/S-URP/S-TUC). Does not require motor vehicle or bicycle parking stalls."},
{"id": "use-30", "sec": "165", "title": "Child Care Service", "summary": "Discretionary \u2014 but only when it occurs (a) within a building used for an Indoor Recreation Facility, Library, Museum, Performing Arts Centre, or Spectator Sports Facility (\u00a71043(2)(b)); (b) in a building approved as a Community Recreation Facility (\u00a71043(4)(a)); or (c) in a building approved as part of an Outdoor Recreation Area (\u00a71043(5)(a)) \u2014 it has no unconditional path to availability in S-R. Cumulative use area for all Child Care Service capped at 1000.0 m\u00b2 district-wide (\u00a71045(2)(b)). Care for 7+ children under 13 (or 13-14 with special needs) for periods <24 hrs; screening required for any outdoor play area; min. 1.0 pick-up/drop-off stall per 10 children; no class 1 bicycle stalls; min. 1.0 bicycle stall \u2013 class 2 per 2000.0 m\u00b2 of gross usable floor area (\u00a7165)."},
{"id": "use-31", "sec": "170.1", "title": "Conference and Event Facility", "summary": "Discretionary \u2014 but only when it occurs (a) within a building used for an Indoor Recreation Facility, Library, Museum, Performing Arts Centre, or Spectator Sports Facility (\u00a71043(2)(c)); or (b) in a building approved as part of an Outdoor Recreation Area (\u00a71043(5)(b)) \u2014 no unconditional path. Permanent facilities for meetings, seminars, conventions, weddings, or other special events; may include banquet facilities with food preparation, but excludes any Eating and Drinking Group use. Public area capped at 75.0 m\u00b2 where it shares a property line with, or is separated only by a lane from, a residential district or a C-N1/C-N2/C-COR1 District (\u00a7170.1(d)). Does not require bicycle parking stalls \u2013 class 1; requires min. 1.0 bicycle stall \u2013 class 2 per 250.0 m\u00b2 of gross usable floor area."},
{"id": "use-32", "sec": "204", "title": "Health Care Service", "summary": "Discretionary \u2014 but only when it occurs within a building used for an Indoor Recreation Facility, Library, Museum, Performing Arts Centre, or Spectator Sports Facility (\u00a71043(2)(d.1)) \u2014 the only path in S-R; unlike Child Care Service, there is no Community-Recreation-Facility or Outdoor-Recreation-Area path for this use. Cumulative use area for all Health Care Service capped at 1000.0 m\u00b2 district-wide (\u00a71045(2)(a)). Provides physical and mental health services (preventative, diagnostic, treatment, therapeutic, rehabilitative, or counselling) for inpatient and outpatient care. Does not require bicycle parking stalls \u2013 class 1; requires min. 1.0 bicycle stall \u2013 class 2 per 250.0 m\u00b2 of gross usable floor area."},
{"id": "use-33", "sec": "278", "title": "Restaurant: Food Service Only", "summary": "Discretionary \u2014 but only when it occurs (a) within a building used for an Indoor Recreation Facility, Library, Museum, Performing Arts Centre, or Spectator Sports Facility, capped at a 300.0 m\u00b2 public area (\u00a71043(2)(e), \u00a71045(3)); (b) on a parcel used for a Park, capped at a lower 150.0 m\u00b2 public area (\u00a71043(3)(a), \u00a71045(4)); or (c) in a building approved as part of an Outdoor Recreation Area (\u00a71043(5)(f)) \u2014 that third path sets no separate public-area cap of its own, so confirm against whichever of the other two caps the Development Authority applies. Food prepared and sold for consumption on the premises, not licensed for liquor; if public area >150.0 m\u00b2, must not be within 45.0 m of a residential district when located in listed districts including S-R (\u00a7278(e)). Does not require bicycle parking stalls \u2013 class 1; requires min. 1.0 bicycle stall \u2013 class 2 per 250.0 m\u00b2 of public area."},
{"id": "use-34", "sec": "281", "title": "Restaurant: Licensed", "summary": "Discretionary \u2014 but only when it occurs (a) within a building used for an Indoor Recreation Facility, Library, Museum, Performing Arts Centre, or Spectator Sports Facility, capped at a 300.0 m\u00b2 public area (\u00a71043(2)(g), \u00a71045(3)); (b) on a parcel used for a Park, capped at a lower 150.0 m\u00b2 public area (\u00a71043(3)(b), \u00a71045(4)); or (c) in a building approved as part of an Outdoor Recreation Area (\u00a71043(5)(i)) \u2014 that third path sets no separate public-area cap of its own, so confirm against whichever of the other two caps the Development Authority applies. Food prepared and sold for consumption on the premises, licensed for liquor with minors allowed; if public area >150.0 m\u00b2, must not be within 45.0 m of a residential district when located in listed districts including S-R (\u00a7281(e)). Does not require bicycle parking stalls \u2013 class 1; requires min. 1.0 bicycle stall \u2013 class 2 per 250.0 m\u00b2 of public area."},
{"id": "use-35", "sec": "286.1", "title": "Retail and Consumer Service", "summary": "Discretionary \u2014 but only when it occurs (a) within a building used for an Indoor Recreation Facility, Library, Museum, Performing Arts Centre, or Spectator Sports Facility (\u00a71043(2)(i)); (b) on a parcel used for a Park (\u00a71043(3)(c)); or (c) in a building approved as part of an Outdoor Recreation Area (\u00a71043(5)(l)) \u2014 no unconditional path. \u00a71044.1 additionally restricts it to operating in conjunction with, and selling only products related to, an Indoor Recreation Facility, Outdoor Recreation Area, Park, Museum, Library, or Spectator Sports Facility, regardless of which path above it enters under \u2014 confirm the merchandise mix matches whichever of those uses it's paired with. Does not require motor vehicle parking stalls; does not require bicycle parking stalls \u2013 class 1; requires min. 1.0 bicycle stall \u2013 class 2 per 250.0 m\u00b2 of gross usable floor area."},
{"id": "use-36", "sec": "182", "title": "Drinking Establishment \u2013 Large", "summary": "Discretionary \u2014 but only when it occurs in a building approved as part of an Outdoor Recreation Area (\u00a71043(5)(c)) \u2014 its only path to availability in S-R (no \u00a71043(2) or (3) path exists for any Drinking Establishment size). Liquor sold for on-premises consumption under an AGLC licence restricting minors; public area \u2265300.0 m\u00b2; max. 10.0 m\u00b2 of public area for entertainment. Must not be within 45.0 m of a residential district when located in S-R \u2014 an S-R-specific rule (\u00a7182(e)). Does not require bicycle parking stalls \u2013 class 1; requires min. 1.0 bicycle stall \u2013 class 2 per 250.0 m\u00b2 of public area."},
{"id": "use-37", "sec": "183", "title": "Drinking Establishment \u2013 Medium", "summary": "Discretionary \u2014 but only when it occurs in a building approved as part of an Outdoor Recreation Area (\u00a71043(5)(d)) \u2014 its only path to availability in S-R. Liquor sold for on-premises consumption under an AGLC licence restricting minors; public area >75.0 m\u00b2 and <300.0 m\u00b2; max. 10.0 m\u00b2 of public area for entertainment. Must not be within 45.0 m of a residential district when located in listed districts including S-R (\u00a7183(e)). Does not require bicycle parking stalls \u2013 class 1; requires min. 1.0 bicycle stall \u2013 class 2 per 250.0 m\u00b2 of public area."},
{"id": "use-38", "sec": "184", "title": "Drinking Establishment \u2013 Small", "summary": "Discretionary \u2014 but only when it occurs in a building approved as part of an Outdoor Recreation Area (\u00a71043(5)(e)) \u2014 its only path to availability in S-R. Liquor sold for on-premises consumption under an AGLC licence restricting minors; public area \u226475.0 m\u00b2; max. 10.0 m\u00b2 of public area for entertainment. Unlike Drinking Establishment \u2013 Large/Medium, \u00a7184 sets no S-R-specific residential-setback distance (\u00a7184(e) is deleted). Does not require bicycle parking stalls \u2013 class 1; requires min. 1.0 bicycle stall \u2013 class 2 per 250.0 m\u00b2 of public area."}
]};
</script>
<script>
(function(){
  "use strict";

  const TABS = [
    {key:"instructions", label:"Instructions", short:"Start here"},
    {key:"general", label:"Part 9 \u2014 Special Purpose General Rules", short:"Sec. 1013\u20131020.2"},
    {key:"district", label:"Part 9, Division 5 \u2014 S-R District Rules", short:"Sec. 1041\u20131052"},
    {key:"citywide", label:"Part 3 \u2014 Citywide Rules", short:"Sec. 53\u2013129.1"},
    {key:"use", label:"Part 4 \u2014 Use Rules", short:"Permitted & discretionary uses"},
  ];

  const STATUS_OPTS = [
    {key:"Pass", cls:"sel-pass"},
    {key:"Fail", cls:"sel-fail"},
    {key:"Pending Info", cls:"sel-pending"},
    {key:"N/A", cls:"sel-na"},
  ];

  // No browser storage of any kind is used. This file may be opened as a
  // plain local file (file://) with no server and no persistent storage API
  // available, so all state lives in memory for the current tab only.
  // The CSV export/import pair below is the sole persistence mechanism.
  let state = {
    activeTab: "instructions",
    search: "",
    statusFilter: null, // null = all
    responses: {},      // id -> {status, notes, proposed}
    project: {projNum:"", name:"", addr:"", file:"", reviewer:""},
    notesOpen: {},       // id -> bool, transient
  };

  function initState(){
    applyProjectToFields();
    renderAll();
  }

  function showToast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._hideTimer);
    t._hideTimer = setTimeout(()=>t.classList.remove("show"), 1400);
  }

  function applyProjectToFields(){
    document.getElementById("f-projnum").value = state.project.projNum || "";
    document.getElementById("f-name").value = state.project.name || "";
    document.getElementById("f-addr").value = state.project.addr || "";
    document.getElementById("f-file").value = state.project.file || "";
    document.getElementById("f-reviewer").value = state.project.reviewer || "";
  }

  function getResponse(id){
    return state.responses[id] || {status:null, notes:"", proposed:false};
  }

  function setResponse(id, patch){
    const cur = getResponse(id);
    state.responses[id] = Object.assign({}, cur, patch);
  }

  // S-R has no binary building-status flip (build spec \u00a707). Its
  // conditional uses (\u00a71043(2)-(5)) don't fit that pattern either \u2014 they
  // depend on which of several building/parcel approval facts is true
  // (existing use as an Indoor Recreation Facility vs. Library vs. Museum
  // vs. Performing Arts Centre vs. Spectator Sports Facility vs. Community
  // Recreation Facility vs. Outdoor Recreation Area, and a use can qualify
  // through more than one path with different numeric caps), not a single
  // yes/no fact about the building. Per the build spec's own scoping note,
  // those are handled as plain-language "Discretionary \u2014 but only when..."
  // rule text on the use's own card (see use-30 through use-38 in
  // CHECKLIST_DATA), not as sidebar checkboxes or live-computed logic.

  function allItemsForTab(tabKey){
    return CHECKLIST_DATA[tabKey] || [];
  }

  // Part 4 is scoped to whichever uses have been selected from the top
  // dropdown (state.responses[id].proposed === true). Uses not selected
  // are not "in review" and don't count toward progress or show as cards.
  // Scoping is on `proposed` alone \u2014 once a use is added it stays
  // visible even if it's later removed from the "add a use" dropdown for
  // any other reason.
  function isSelectableUse(item){
    return /^(Permitted|Discretionary)\b/i.test(item.summary || "");
  }

  function selectedPart4Items(){
    return allItemsForTab("use").filter(it => getResponse(it.id).proposed);
  }

  function scopedItemsForTab(tabKey){
    return tabKey === "use" ? selectedPart4Items() : allItemsForTab(tabKey);
  }

  function tabCounts(tabKey){
    const items = scopedItemsForTab(tabKey);
    if(!items.length) return {done:0, total:0};
    let done = 0;
    items.forEach(it=>{
      const r = getResponse(it.id);
      if(r.status) done++;
    });
    return {done, total: items.length};
  }

  function overallProgress(){
    let done=0, total=0;
    ["general","district","citywide","use"].forEach(k=>{
      const c = tabCounts(k);
      done += c.done; total += c.total;
    });
    return {done, total};
  }

  // ---------------- Rendering ----------------

  function renderAll(){
    renderTabNav();
    renderOverallProgress();
    renderMain();
  }

  // Every click handler in the app (status pills, use-selector dropdown,
  // remove-from-review, filter chips, the district-conditions checkbox)
  // calls this instead of touching only the element that was clicked. It
  // rebuilds tab counts, the overall progress bar, and the whole main panel
  // every time, so nothing in the sidebar or stat strip can ever go stale
  // relative to what was clicked. Scroll position in the main panel is
  // preserved across the rebuild.
  function refreshEverything(){
    const main = document.getElementById("main");
    const scrollTop = main ? main.scrollTop : 0;
    renderTabNav();
    renderOverallProgress();
    renderMain();
    const restoreScroll = ()=>{
      const m = document.getElementById("main");
      if(m) m.scrollTop = scrollTop;
    };
    if(typeof requestAnimationFrame === "function"){
      requestAnimationFrame(restoreScroll);
    } else {
      restoreScroll();
    }
  }

  function renderTabNav(){
    const nav = document.getElementById("tabnav");
    nav.innerHTML = "";
    TABS.forEach(tab=>{
      const btn = document.createElement("button");
      btn.className = "tab-btn" + (state.activeTab===tab.key ? " active":"");
      const left = document.createElement("span");
      left.className = "tname";
      left.innerHTML = `<span>${tab.label}</span><span class="tsec">${tab.short}</span>`;
      btn.appendChild(left);
      if(tab.key !== "instructions"){
        const c = tabCounts(tab.key);
        const count = document.createElement("span");
        count.className = "tab-count";
        count.textContent = `${c.done}/${c.total}`;
        btn.appendChild(count);
      }
      btn.addEventListener("click", ()=>{
        state.activeTab = tab.key;
        state.search = "";
        state.statusFilter = null;
        renderAll();
      });
      nav.appendChild(btn);
    });
  }

  function renderOverallProgress(){
    const {done,total} = overallProgress();
    const pct = total ? Math.round((done/total)*100) : 0;
    document.getElementById("overall-pct").textContent = `${pct}% (${done}/${total})`;
    document.getElementById("overall-fill").style.width = pct + "%";
  }

  function renderMain(){
    const main = document.getElementById("main");
    main.innerHTML = "";
    if(state.activeTab === "instructions"){
      main.appendChild(buildInstructions());
      return;
    }
    main.appendChild(buildPanelHead());
    main.appendChild(buildStatStrip());
    const list = buildCardList();
    main.appendChild(list);
  }

  function buildInstructions(){
    const wrap = document.createElement("div");

    const head = document.createElement("div");
    head.className = "panel-head";
    head.innerHTML = `<div><h2>How to use this checklist</h2>
      <p>An interactive companion to the S-R Zoning Review Checklist, built from the sections of Land Use Bylaw 1P2007 that reference the S-R district, Special Purpose districts generally, or all districts.</p></div>`;
    wrap.appendChild(head);

    const b1 = document.createElement("div");
    b1.className = "instr-block";
    b1.innerHTML = `<h3>Workflow</h3>
      <ol>
        <li>Fill in the project fields in the sidebar, starting with <b>Project number</b> \u2014 it's used to name your session file.</li>
        <li><b>Part 9 \u2014 Special Purpose General Rules</b> and <b>Part 9, Division 5 \u2014 S-R District Rules</b> apply to every S-R project without exception. Work through these first \u2014 S-R <em>is</em> one of the six Special Purpose districts where a landscape plan (\u00a71014\u2013\u00a71016) is required by default, and it's one of only three Special Purpose districts (with S-SPR and S-CI) where BOTH Wind Energy Conversion System \u2013 Type 1 and \u2013 Type 2 are listed uses.</li>
        <li><b>Part 3 \u2014 Citywide Rules</b> applies to every district in Calgary, including S-R. Don't skip it \u2014 S-R is one of the few districts where a Digital Message Sign is broadly available under \u00a7104(1) rather than gated behind a use-association test, and Sign \u2013 Class F (Third Party Advertising Sign) is a listed use here, unlike most other Special Purpose districts.</li>
        <li><b>Part 4 \u2014 Use Rules</b> is use-dependent. Add whichever use(s) are actually proposed from the dropdown, then look up that Part 4 section number in the bylaw directly for the full use definition. Several S-R uses (Child Care Service, Conference and Event Facility, Health Care Service, Restaurant/Retail/Drinking Establishment variants) are discretionary only when they occur inside a specific kind of building or on a specific kind of parcel \u2014 read each of those cards' summary carefully before marking it N/A.</li>
        <li>Click a status pill (Pass / Fail / Pending Info / N/A) on each article. Use "Notes" to log evidence, drawing references, or follow-ups.</li>
        <li><b>Nothing autosaves.</b> This is a standalone file with no server and no browser storage behind it \u2014 your answers exist only in this tab. Click <b>Export session (.csv)</b> in the sidebar to save your progress, and <b>Import session (.csv)</b> to reload a previously exported file and pick up where you left off.</li>
      </ol>`;
    wrap.appendChild(b1);

    const b2 = document.createElement("div");
    b2.className = "instr-block";
    b2.innerHTML = `<h3>Scope \u2014 what this does <em>not</em> cover</h3>
      <p>This is a generic template, not a substitute for reading the bylaw. It excludes Part 1/2 (definitions, general administration), the ~260 Part 4 use definitions not listed under S-R, subdivision requirements, and site-specific overlays \u2014 Direct Control variations, a registered Comprehensive Sign Program, restrictive covenants, or Airport Vicinity Protection Area maps. The \u00a71041(2) purpose statement, which says the district should not be applied to land dedicated as reserve under the Municipal Government Act, is a land-designation/subdivision-stage consideration, not a DP-stage checklist item, and isn't tracked here. No school use (School Authority \u2013 School, School \u2013 Private) or residential use is listed in S-R \u2014 this checklist has no pick-up/drop-off formula for those, unlike the S-CS checklist. Always check the current consolidated bylaw on calgary.ca since it is amended regularly.</p>`;
    wrap.appendChild(b2);

    const b3 = document.createElement("div");
    b3.className = "instr-block";
    b3.innerHTML = `<h3>Status legend</h3>
      <div class="legend-grid">
        <div class="legend-card" style="background:var(--pass-bg);color:var(--pass);"><b>Pass</b>&nbsp;\u2014 confirmed compliant</div>
        <div class="legend-card" style="background:var(--fail-bg);color:var(--fail);"><b>Fail</b>&nbsp;\u2014 non-compliant, needs a change or relaxation</div>
        <div class="legend-card" style="background:var(--pending-bg);color:var(--pending);"><b>Pending Info</b>&nbsp;\u2014 need more drawings/info</div>
        <div class="legend-card" style="background:var(--na-bg);color:var(--na);"><b>N/A</b>&nbsp;\u2014 not applicable to this project</div>
      </div>`;
    wrap.appendChild(b3);

    return wrap;
  }

  function buildPanelHead(){
    const tab = TABS.find(t=>t.key===state.activeTab);
    const head = document.createElement("div");
    head.className = "panel-head";

    const left = document.createElement("div");
    left.innerHTML = `<h2>${tab.label}</h2><p>${panelDescription(state.activeTab)}</p>`;
    head.appendChild(left);

    const tools = document.createElement("div");
    tools.className = "panel-tools";

    if(state.activeTab === "use"){
      tools.appendChild(buildUseSelector());
    }

    const search = document.createElement("input");
    search.className = "search-box";
    search.type = "text";
    search.placeholder = "Search this tab\u2026";
    search.value = state.search;
    search.addEventListener("input", (e)=>{ state.search = e.target.value; renderMain(); preserveFocus(search); });
    tools.appendChild(search);

    ["Fail","Pending Info"].forEach(s=>{
      const chip = document.createElement("button");
      chip.className = "filter-chip" + (state.statusFilter===s ? " active":"");
      chip.textContent = s === "Pending Info" ? "Pending only" : "Fails only";
      chip.addEventListener("click", ()=>{
        state.statusFilter = state.statusFilter===s ? null : s;
        refreshEverything();
      });
      tools.appendChild(chip);
    });

    head.appendChild(tools);
    return head;
  }

  // Dropdown listing only Part 4 items whose status is Permitted or
  // Discretionary (isSelectableUse) \u2014 nothing else is offered. Picking
  // one adds it to the reviewed-uses set (proposed:true) and the card for
  // that use (with its specific rule text and pass/fail controls) appears
  // below.
  function buildUseSelector(){
    const wrap = document.createElement("div");
    wrap.className = "use-select-wrap";

    const select = document.createElement("select");
    select.className = "use-select";

    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "+ Add a use to review\u2026";
    select.appendChild(placeholder);

    const groups = [
      {label:"Permitted uses", test: s => /^Permitted/i.test(s)},
      {label:"Discretionary uses", test: s => /^Discretionary/i.test(s)},
    ];
    groups.forEach(g=>{
      const items = allItemsForTab("use")
        .filter(it => isSelectableUse(it) && g.test(it.summary) && !getResponse(it.id).proposed)
        .sort((a,b)=> a.title.localeCompare(b.title));
      if(!items.length) return;
      const optgroup = document.createElement("optgroup");
      optgroup.label = g.label;
      items.forEach(it=>{
        const opt = document.createElement("option");
        opt.value = it.id;
        opt.textContent = `${it.title} (${it.sec})`;
        optgroup.appendChild(opt);
      });
      select.appendChild(optgroup);
    });

    select.addEventListener("change", (e)=>{
      const id = e.target.value;
      if(!id) return;
      setResponse(id, {proposed:true});
      refreshEverything();
    });

    wrap.appendChild(select);

    const count = selectedPart4Items().length;
    if(count){
      const badge = document.createElement("span");
      badge.className = "use-select-count";
      badge.textContent = `${count} use${count===1?"":"s"} in review`;
      wrap.appendChild(badge);
    }

    return wrap;
  }

  function panelDescription(key){
    if(key==="general") return "General rules for all Special Purpose land use districts \u2014 setback projections, landscaping, visibility, screening, garbage, solar, WECS, parcel access. Always applicable \u2014 S-R is one of the six Special Purpose districts where the \u00a71014\u2013\u00a71016 landscape plan / planting / irrigation requirements actually apply by default. Both Wind Energy Conversion System \u2013 Type 1 and \u2013 Type 2 are listed uses in S-R, with Type 2 capped at 30.0 m total height here.";
    if(key==="district") return "S-R-specific numeric rules \u2014 use area caps, front/rear/side setbacks, and the district's detailed landscaping package (including the large-parking-area island/strip spec at \u00a71051, absent from some other Special Purpose districts). Always applicable. Purpose statement and the permitted/discretionary use lists live on the Instructions tab and the Use tab, respectively \u2014 see there for use-specific detail.";
    if(key==="citywide") return "Rules Governing All Districts \u2014 public realm setbacks, airport vicinity, floodway, lighting, signs, parking/loading, servicing. Applies to S-R the same as every other district \u2014 note S-R does NOT qualify for a Roof Sign under \u00a7107, a Digital Message Sign is broadly available under \u00a7104(1) rather than gated behind a use-association test, and Sign \u2013 Class F is a listed use here (unlike most other Special Purpose districts).";
    if(key==="use") return "Add the proposed use(s) from the dropdown \u2014 the 6 permitted and 24 baseline discretionary S-R uses are offered directly; 9 further uses (Child Care Service, Conference and Event Facility, Health Care Service, Restaurant/Retail/Drinking Establishment variants) are discretionary only under the building/parcel conditions spelled out in each of their cards \u2014 read the condition before relying on the card.";
    return "";
  }

  function preserveFocus(el){
    // re-focus the search box after re-render (since renderMain rebuilds the DOM)
    requestAnimationFrame(()=>{
      const s = document.querySelector(".search-box");
      if(s){ s.focus(); const v=s.value; s.value=""; s.value=v; }
    });
  }

  function buildStatStrip(){
    const items = filteredItems();
    const scoped = scopedItemsForTab(state.activeTab);
    const strip = document.createElement("div");
    strip.className = "stat-strip";
    const counts = {"Pass":0,"Fail":0,"Pending Info":0,"N/A":0,"none":0};
    scoped.forEach(it=>{
      const r = getResponse(it.id);
      if(r.status) counts[r.status] = (counts[r.status]||0)+1;
      else counts.none++;
    });
    const defs = [
      ["Pass", "var(--pass)"],["Fail","var(--fail)"],["Pending Info","var(--pending)"],
      ["N/A","var(--na)"],["Not started","var(--ink-soft)"]
    ];
    const map = {"Pass":counts.Pass,"Fail":counts.Fail,"Pending Info":counts["Pending Info"],"N/A":counts["N/A"],"Not started":counts.none};
    defs.forEach(([label,color])=>{
      const s = document.createElement("div");
      s.className = "stat";
      s.innerHTML = `<span class="swatch" style="background:${color}"></span><b>${map[label]}</b> ${label}`;
      strip.appendChild(s);
    });
    if(items.length !== scoped.length){
      const s = document.createElement("div");
      s.className = "stat";
      s.style.marginLeft = "auto";
      s.textContent = `Showing ${items.length} of ${scoped.length}`;
      strip.appendChild(s);
    }
    return strip;
  }

  function filteredItems(){
    let items = scopedItemsForTab(state.activeTab);
    if(state.search.trim()){
      const q = state.search.trim().toLowerCase();
      items = items.filter(it =>
        it.sec.toLowerCase().includes(q) ||
        it.title.toLowerCase().includes(q) ||
        it.summary.toLowerCase().includes(q)
      );
    }
    if(state.statusFilter){
      items = items.filter(it => getResponse(it.id).status === state.statusFilter);
    }
    return items;
  }

  function buildCardList(){
    const container = document.createElement("div");
    const items = filteredItems();
    if(!items.length){
      const empty = document.createElement("div");
      empty.className = "empty-state";
      if(state.activeTab === "use" && !selectedPart4Items().length){
        empty.textContent = "No uses selected yet. Choose a permitted or discretionary use from the dropdown above to begin testing it.";
      } else {
        empty.textContent = "No articles match your search/filter.";
      }
      container.appendChild(empty);
      return container;
    }
    const isPart4 = state.activeTab === "use";
    items.forEach(it=>{
      container.appendChild(buildCard(it, isPart4));
    });
    return container;
  }

  function buildCard(item, isPart4){
    const r = getResponse(item.id);
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.status = r.status || "";

    const top = document.createElement("div");
    top.className = "card-top";

    const idWrap = document.createElement("div");
    idWrap.className = "card-id";
    idWrap.innerHTML = `<span class="sec-badge mono">${escapeHtml(item.sec)}</span><h3>${escapeHtml(item.title)}</h3>`;
    top.appendChild(idWrap);

    if(isPart4){
      const removeBtn = document.createElement("button");
      removeBtn.className = "remove-use-btn";
      removeBtn.type = "button";
      removeBtn.textContent = "Remove from review";
      removeBtn.addEventListener("click", ()=>{
        setResponse(item.id, {proposed:false});
        refreshEverything();
      });
      top.appendChild(removeBtn);
    }
    card.appendChild(top);

    const summary = document.createElement("p");
    summary.className = isPart4 ? "summary use-tag" : "summary";
    summary.textContent = item.summary;
    card.appendChild(summary);

    const statusRow = document.createElement("div");
    statusRow.className = "status-row";
    STATUS_OPTS.forEach(opt=>{
      const pill = document.createElement("button");
      pill.className = "status-pill" + (r.status===opt.key ? " "+opt.cls : "");
      pill.textContent = opt.key;
      pill.addEventListener("click", ()=>{
        const newStatus = r.status===opt.key ? null : opt.key;
        setResponse(item.id, {status:newStatus});
        refreshEverything();
      });
      statusRow.appendChild(pill);
    });

    const notesToggle = document.createElement("button");
    notesToggle.className = "notes-toggle";
    notesToggle.textContent = state.notesOpen[item.id] ? "Hide notes" : (r.notes ? "Edit notes \u25CF" : "Add notes");
    notesToggle.addEventListener("click", ()=>{
      state.notesOpen[item.id] = !state.notesOpen[item.id];
      notesArea.classList.toggle("open", state.notesOpen[item.id]);
      notesToggle.textContent = state.notesOpen[item.id] ? "Hide notes" : (r.notes ? "Edit notes \u25CF" : "Add notes");
      if(state.notesOpen[item.id]) textarea.focus();
    });
    statusRow.appendChild(notesToggle);
    card.appendChild(statusRow);

    const notesArea = document.createElement("div");
    notesArea.className = "notes-area" + (state.notesOpen[item.id] ? " open":"");
    const textarea = document.createElement("textarea");
    textarea.placeholder = "Notes, drawing references, follow-up items\u2026";
    textarea.value = r.notes || "";
    textarea.addEventListener("input", (e)=>{
      setResponse(item.id, {notes: e.target.value});
    });
    notesArea.appendChild(textarea);
    card.appendChild(notesArea);

    return card;
  }

  function escapeHtml(s){
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  // ---------------- Session export / import (CSV = the persistent record) ----------------

  const DATA_TAB_KEYS = ["general","district","citywide","use"];
  const ITEM_HEADERS = ["Part","Section","Article Title","Requirement Summary","Proposed","Review Status","Notes","ID"];
  const META_FIELDS = [
    ["Project number", "projNum", "text"],
    ["Project name", "name", "text"],
    ["Site address / legal desc.", "addr", "text"],
    ["DP / file no.", "file", "text"],
    ["Reviewer", "reviewer", "text"],
  ];

  function todayStr(){
    const d = new Date();
    const p = n => String(n).padStart(2,"0");
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  }

  function sanitizeForFilename(s){
    return String(s||"").trim().replace(/[\\/:*?"<>|]+/g,"-").replace(/\s+/g," ").trim();
  }

  function buildExportRows(){
    const rows = [];
    rows.push(["Field","Value"]);
    META_FIELDS.forEach(([label,key,type])=>{
      const val = type === "bool" ? (state.project[key] ? "Yes" : "No") : (state.project[key] || "");
      rows.push([label, val]);
    });
    rows.push(["Export date", todayStr()]);
    const totalDone = overallProgress();
    rows.push(["Progress", `${totalDone.done}/${totalDone.total} checks completed`]);
    rows.push([]); // blank separator row
    rows.push(ITEM_HEADERS);
    DATA_TAB_KEYS.forEach(key=>{
      const tab = TABS.find(t=>t.key===key);
      allItemsForTab(key).forEach(it=>{
        const r = getResponse(it.id);
        const isPart4 = key === "use";
        rows.push([
          tab.label,
          it.sec,
          it.title,
          it.summary,
          isPart4 ? (r.proposed ? "Yes" : "No") : "",
          r.status || "",
          r.notes || "",
          it.id,
        ]);
      });
    });
    return rows;
  }

  function exportCsv(){
    const rows = buildExportRows();
    const csv = rows.map(row => row.map(csvEscape).join(",")).join("\r\n");
    const blob = new Blob(["\uFEFF" + csv], {type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const projNum = sanitizeForFilename(state.project.projNum) || "Unnumbered";
    a.href = url;
    a.download = `${projNum} - ${todayStr()} - LUB Review.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    const {done,total} = overallProgress();
    showToast(`Exported \u2014 ${done}/${total} checks saved`);
  }

  function csvEscape(val){
    const s = String(val==null ? "" : val);
    if(/[",\r\n]/.test(s)){
      return '"' + s.replace(/"/g,'""') + '"';
    }
    return s;
  }

  // RFC4180-ish parser: handles quoted fields containing commas, quotes, and newlines.
  function parseCsvText(text){
    const rows = [];
    let row = [];
    let field = "";
    let inQuotes = false;
    // Normalize a leading BOM if present.
    if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    for(let i=0; i<text.length; i++){
      const c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){ field += '"'; i++; }
          else { inQuotes = false; }
        } else {
          field += c;
        }
      } else {
        if(c === '"'){
          inQuotes = true;
        } else if(c === ','){
          row.push(field); field = "";
        } else if(c === '\r'){
          // skip; \n (or end) will terminate the row
        } else if(c === '\n'){
          row.push(field); field = "";
          rows.push(row); row = [];
        } else {
          field += c;
        }
      }
    }
    // flush trailing field/row if the file doesn't end with a newline
    if(field.length || row.length){
      row.push(field);
      rows.push(row);
    }
    return rows.filter(r => !(r.length===1 && r[0]===""));
  }

  function importCsv(file){
    const reader = new FileReader();
    reader.onload = (e)=>{
      let rows;
      try{
        rows = parseCsvText(String(e.target.result));
      }catch(err){
        showToast("Import failed \u2014 couldn't read this file as CSV");
        return;
      }
      const headerIdx = rows.findIndex(r => r[0] === "Part" && r[1] === "Section");
      if(headerIdx === -1){
        showToast("Import failed \u2014 not a recognized session file");
        return;
      }

      // Parse metadata rows (everything before the item table, skipping the
      // "Field,Value" header and any Export date / Progress info rows).
      const metaByLabel = {};
      for(let i=0; i<headerIdx; i++){
        const [label, value] = rows[i];
        if(label && label !== "Field") metaByLabel[label] = value;
      }
      const newProject = {};
      META_FIELDS.forEach(([label,key,type])=>{
        newProject[key] = type === "bool" ? (metaByLabel[label] === "Yes") : (metaByLabel[label] || "");
      });

      // Parse item rows, matched back to known checklist items by ID.
      const knownIds = new Set();
      DATA_TAB_KEYS.forEach(key => allItemsForTab(key).forEach(it => knownIds.add(it.id)));
      const newResponses = {};
      let matched = 0, skipped = 0;
      for(let i=headerIdx+1; i<rows.length; i++){
        const r = rows[i];
        if(!r.length || r.every(c=>c==="")) continue;
        const [ , , , , proposedCol, statusCol, notesCol, idCol] = r;
        const id = idCol;
        if(!id || !knownIds.has(id)){ skipped++; continue; }
        newResponses[id] = {
          status: statusCol || null,
          notes: notesCol || "",
          proposed: proposedCol === "Yes",
        };
        matched++;
      }

      if(!matched){
        showToast("Import failed \u2014 no matching checklist items found in that file");
        return;
      }

      state.project = newProject;
      state.responses = newResponses;
      state.notesOpen = {};
      applyProjectToFields();
      renderAll();
      showToast(`Imported \u2014 ${matched} checks loaded${skipped ? `, ${skipped} rows skipped` : ""}`);
    };
    reader.onerror = ()=> showToast("Import failed \u2014 couldn't read that file");
    reader.readAsText(file);
  }

  // ---------------- Project field bindings ----------------
  function bindProjectFields(){
    const map = {"f-projnum":"projNum","f-name":"name","f-addr":"addr","f-file":"file","f-reviewer":"reviewer"};
    Object.keys(map).forEach(id=>{
      const el = document.getElementById(id);
      el.addEventListener("input", (e)=>{
        state.project[map[id]] = e.target.value;
      });
    });
  }

  function bindSessionButtons(){
    document.getElementById("btn-export").addEventListener("click", exportCsv);
    const fileInput = document.getElementById("file-import");
    document.getElementById("btn-import").addEventListener("click", ()=> fileInput.click());
    fileInput.addEventListener("change", (e)=>{
      const file = e.target.files && e.target.files[0];
      if(file) importCsv(file);
      fileInput.value = "";
    });
  }

  // ---------------- Init ----------------
  bindProjectFields();
  bindSessionButtons();
  initState();

})();

</script>
</body>
</html>

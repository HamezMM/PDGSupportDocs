<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S-R District Review Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F2E8;
    --paper-card:#FBF9F2;
    --ink:#152538;
    --ink-soft:#3A4A5C;
    --blue:#2C5A87;
    --blue-dim:#5C7C99;
    --rule:#D9D2BC;
    --rule-dark:#B9B092;
    --pass:#3E7A5A;
    --pass-bg:#E1EEE5;
    --fail:#AE4429;
    --fail-bg:#F4E2DC;
    --pending:#B5842A;
    --pending-bg:#F3E7CE;
    --na:#83807A;
    --na-bg:#E7E5DE;
    --sidebar-w:280px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    font-size:14px;
    line-height:1.5;
    display:flex;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:var(--sidebar-w);
    flex-shrink:0;
    background:var(--ink);
    color:#EDE9DA;
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .titleblock{
    padding:22px 20px 16px 20px;
    border-bottom:1px solid rgba(237,233,218,0.18);
  }
  .titleblock .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.14em;
    color:#8FAFC9;
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .titleblock h1{
    font-size:18px;
    line-height:1.28;
    margin:0 0 4px 0;
    font-weight:600;
    color:#FFFFFF;
  }
  .titleblock .sub{
    font-size:11.5px;
    color:#9FB2C4;
  }

  .project-fields{
    padding:16px 20px;
    border-bottom:1px solid rgba(237,233,218,0.18);
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .project-fields label{
    display:block;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:#8FAFC9;
    margin-bottom:3px;
    font-family:'IBM Plex Mono',monospace;
  }
  .project-fields input{
    width:100%;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(237,233,218,0.22);
    border-radius:3px;
    color:#EDE9DA;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:12.5px;
    padding:6px 8px;
  }
  .project-fields input::placeholder{color:#66768A;}
  .project-fields input:focus{outline:none;border-color:var(--blue-dim);background:rgba(255,255,255,0.1);}

  nav.tabs{
    padding:14px 12px;
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .tab-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:none;
    border:none;
    color:#C7D2DC;
    text-align:left;
    padding:10px 10px;
    border-radius:4px;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13px;
    cursor:pointer;
    transition:background .12s ease;
  }
  .tab-btn:hover{background:rgba(255,255,255,0.06);}
  .tab-btn.active{background:var(--blue);color:#fff;}
  .tab-btn .tname{display:flex;flex-direction:column;gap:1px;}
  .tab-btn .tsec{font-size:10px;font-family:'IBM Plex Mono',monospace;opacity:0.72;letter-spacing:.04em;}
  .tab-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    background:rgba(255,255,255,0.12);
    padding:2px 6px;
    border-radius:10px;
    min-width:34px;
    text-align:center;
  }
  .tab-btn.active .tab-count{background:rgba(255,255,255,0.25);}

  .ruler-block{
    margin-top:auto;
    padding:16px 20px 20px 20px;
    border-top:1px solid rgba(237,233,218,0.18);
  }
  .ruler-label{
    display:flex;
    justify-content:space-between;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:#9FB2C4;
    margin-bottom:6px;
  }
  .ruler{
    position:relative;
    height:14px;
    border:1px solid rgba(237,233,218,0.3);
    border-radius:2px;
    overflow:hidden;
    background:rgba(255,255,255,0.05);
  }
  .ruler-fill{
    position:absolute;left:0;top:0;bottom:0;
    background:linear-gradient(90deg,#3E7A5A,#5C9C77);
    width:0%;
    transition:width .25s ease;
  }
  .ruler-ticks{
    position:absolute;inset:0;
    background-image:repeating-linear-gradient(90deg, rgba(21,37,56,0.55) 0 1px, transparent 1px 10%);
  }
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:6px 10px;
    margin-top:12px;
  }
  .legend-item{
    display:flex;align-items:center;gap:5px;
    font-size:10.5px;color:#B7C3CE;
    font-family:'IBM Plex Mono',monospace;
  }
  .swatch{width:9px;height:9px;border-radius:2px;display:inline-block;}

  .session-block{
    padding:16px 20px 20px 20px;
    border-top:1px solid rgba(237,233,218,0.18);
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .session-warning{
    font-size:10.5px;
    line-height:1.45;
    color:#B5842A;
    background:rgba(181,132,42,0.14);
    border:1px solid rgba(181,132,42,0.35);
    border-radius:4px;
    padding:8px 9px;
    margin-bottom:2px;
  }
  .session-btn{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:12px;
    font-weight:600;
    padding:8px 12px;
    border-radius:4px;
    border:1px solid rgba(237,233,218,0.3);
    background:rgba(255,255,255,0.06);
    color:#EDE9DA;
    cursor:pointer;
    width:100%;
    text-align:center;
  }
  .session-btn:hover{background:rgba(255,255,255,0.12);}
  .session-btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
  .session-btn.primary:hover{background:#356E9D;}

  /* ---------- Main ---------- */
  #main{
    flex:1;
    min-width:0;
    padding:28px 40px 80px 40px;
    max-width:980px;
  }
  .panel-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:6px;
    padding-bottom:16px;
    border-bottom:2px solid var(--ink);
  }
  .panel-head h2{
    font-size:21px;
    margin:0 0 4px 0;
    font-weight:600;
  }
  .panel-head p{
    margin:0;
    font-size:12.5px;
    color:var(--ink-soft);
    max-width:60ch;
  }
  .panel-tools{
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
  }
  .search-box{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:12.5px;
    padding:7px 10px;
    border:1px solid var(--rule-dark);
    border-radius:4px;
    background:#fff;
    min-width:170px;
  }
  .filter-chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    padding:6px 10px;
    border-radius:14px;
    border:1px solid var(--rule-dark);
    background:#fff;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .filter-chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .export-btn{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:12px;
    font-weight:600;
    padding:7px 13px;
    border-radius:4px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:#fff;
    cursor:pointer;
  }
  .export-btn:hover{background:var(--blue);border-color:var(--blue);}
  .export-btn.secondary{background:#fff;color:var(--ink);}
  .export-btn.secondary:hover{background:var(--paper-card);}

  .stat-strip{
    display:flex;
    gap:16px;
    margin:16px 0 20px 0;
    flex-wrap:wrap;
  }
  .stat{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    padding:5px 10px;
    border-radius:4px;
    display:flex;
    gap:6px;
    align-items:center;
    border:1px solid var(--rule);
    background:#fff;
  }
  .stat b{font-size:13px;}

  /* Article cards */
  .card{
    background:var(--paper-card);
    border:1px solid var(--rule);
    border-left:4px solid var(--rule-dark);
    border-radius:5px;
    margin-bottom:12px;
    padding:16px 18px;
    transition:border-left-color .15s ease;
  }
  .card[data-status="Pass"]{border-left-color:var(--pass);}
  .card[data-status="Fail"]{border-left-color:var(--fail);}
  .card[data-status="Pending Info"]{border-left-color:var(--pending);}
  .card[data-status="N/A"]{border-left-color:var(--na);}

  .card-top{
    display:flex;
    justify-content:space-between;
    gap:14px;
    align-items:flex-start;
  }
  .card-id{
    display:flex;
    gap:10px;
    align-items:baseline;
    min-width:0;
  }
  .sec-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    font-weight:600;
    color:var(--blue);
    background:#fff;
    border:1px solid var(--blue-dim);
    border-radius:3px;
    padding:2px 7px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .card h3{
    font-size:14.5px;
    margin:0;
    font-weight:600;
    color:var(--ink);
  }
  .card .summary{
    margin:9px 0 0 0;
    font-size:12.8px;
    color:var(--ink-soft);
    line-height:1.55;
  }
  .use-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--blue);
  }

  .status-row{
    display:flex;
    gap:6px;
    margin-top:12px;
    flex-wrap:wrap;
    align-items:center;
  }
  .status-pill{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    padding:5px 11px;
    border-radius:13px;
    border:1px solid var(--rule-dark);
    background:#fff;
    cursor:pointer;
    color:var(--ink-soft);
    transition:all .1s ease;
  }
  .status-pill:hover{border-color:var(--ink);}
  .status-pill.sel-pass{background:var(--pass);border-color:var(--pass);color:#fff;}
  .status-pill.sel-fail{background:var(--fail);border-color:var(--fail);color:#fff;}
  .status-pill.sel-pending{background:var(--pending);border-color:var(--pending);color:#fff;}
  .status-pill.sel-na{background:var(--na);border-color:var(--na);color:#fff;}

  .notes-toggle{
    margin-left:auto;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--blue);
    cursor:pointer;
    background:none;
    border:none;
    text-decoration:underline;
    padding:4px;
  }
  .notes-area{
    display:none;
    margin-top:10px;
  }
  .notes-area.open{display:block;}
  .notes-area textarea{
    width:100%;
    min-height:56px;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:12.5px;
    padding:8px 10px;
    border:1px solid var(--rule-dark);
    border-radius:4px;
    resize:vertical;
    background:#fff;
  }
  .notes-area textarea:focus{outline:none;border-color:var(--blue);}

  .proposed-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    cursor:pointer;
    padding:5px 10px;
    border:1px solid var(--rule-dark);
    border-radius:13px;
    background:#fff;
  }
  .proposed-toggle input{accent-color:var(--blue);}
  .proposed-toggle.checked{background:#EAF0F6;border-color:var(--blue-dim);color:var(--blue);}

  .use-select-wrap{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .use-select{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:12.5px;
    padding:7px 10px;
    border:1px solid var(--blue-dim);
    border-radius:4px;
    background:#EAF0F6;
    color:var(--ink);
    min-width:220px;
    cursor:pointer;
  }
  .use-select-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--blue);
    white-space:nowrap;
  }
  .remove-use-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--fail);
    background:#fff;
    border:1px solid var(--fail);
    border-radius:13px;
    padding:4px 10px;
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
  }
  .remove-use-btn:hover{background:var(--fail-bg);}

  .empty-state{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
    font-size:13px;
  }

  /* Instructions panel */
  .instr-block{
    background:var(--paper-card);
    border:1px solid var(--rule);
    border-radius:5px;
    padding:20px 22px;
    margin-bottom:16px;
  }
  .instr-block h3{
    margin:0 0 10px 0;
    font-size:14px;
    color:var(--blue);
    font-family:'IBM Plex Mono',monospace;
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .instr-block ol, .instr-block ul{margin:0;padding-left:20px;}
  .instr-block li{margin-bottom:7px;font-size:13px;color:var(--ink-soft);}
  .instr-block p{font-size:13px;color:var(--ink-soft);margin:0 0 8px 0;}
  .legend-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:8px;
    margin-top:8px;
  }
  .legend-card{
    display:flex;align-items:center;gap:8px;
    padding:8px 10px;
    border-radius:4px;
    font-size:12px;
  }

  .toast{
    position:fixed;
    bottom:20px;
    right:20px;
    background:var(--ink);
    color:#fff;
    padding:9px 16px;
    border-radius:5px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    opacity:0;
    transform:translateY(8px);
    transition:all .2s ease;
    pointer-events:none;
    z-index:50;
  }
  .toast.show{opacity:1;transform:translateY(0);}

  @media (max-width:860px){
    body{flex-direction:column;}
    #sidebar{position:relative;width:100%;height:auto;}
    #main{padding:20px;max-width:100%;}
  }
</style>
</head>
<body>

<aside id="sidebar">
<a href="../index.html" style="display:block;padding:14px 20px 0 20px;font:600 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.06em;color:#8FAFC9;text-decoration:none;text-transform:uppercase">&larr; PDG Support Docs</a>
  <div class="titleblock">
    <div class="eyebrow">Land Use Bylaw 1P2007</div>
    <h1>S-R District Review Checklist</h1>
    <div class="sub">Special Purpose &ndash; Recreation &middot; Development Permit review</div>
  </div>

  <div class="project-fields">
    <div>
      <label for="f-projnum">Project number</label>
      <input id="f-projnum" type="text" placeholder="e.g. 26.93">
    </div>
    <div>
      <label for="f-name">Project name</label>
      <input id="f-name" type="text" placeholder="e.g. 40 Ave Distribution Facility">
    </div>
    <div>
      <label for="f-addr">Site address / legal desc.</label>
      <input id="f-addr" type="text" placeholder="Address or plan/block/lot">
    </div>
    <div>
      <label for="f-file">DP / file no.</label>
      <input id="f-file" type="text" placeholder="DP2026-xxxxx">
    </div>
    <div>
      <label for="f-reviewer">Reviewer</label>
      <input id="f-reviewer" type="text" placeholder="Name">
    </div>
  </div>

  <nav class="tabs" id="tabnav"></nav>

  <div class="ruler-block">
    <div class="ruler-label"><span>OVERALL PROGRESS</span><span id="overall-pct">0%</span></div>
    <div class="ruler">
      <div class="ruler-ticks"></div>
      <div class="ruler-fill" id="overall-fill"></div>
    </div>
    <div class="legend">
      <span class="legend-item"><span class="swatch" style="background:var(--pass)"></span>Pass</span>
      <span class="legend-item"><span class="swatch" style="background:var(--fail)"></span>Fail</span>
      <span class="legend-item"><span class="swatch" style="background:var(--pending)"></span>Pending</span>
      <span class="legend-item"><span class="swatch" style="background:var(--na)"></span>N/A</span>
    </div>
  </div>

  <div class="session-block">
    <div class="session-warning">Nothing autosaves. Export a session file before closing this tab, and import it next time to pick up where you left off.</div>
    <button class="session-btn primary" id="btn-export">Export session (.csv)</button>
    <button class="session-btn" id="btn-import">Import session (.csv)</button>
    <input type="file" id="file-import" accept=".csv,text/csv" style="display:none">
  </div>
</aside>

<main id="main"></main>

<div class="toast" id="toast">Saved</div>

<script>
const CHECKLIST_DATA = {"general": [
{"id": "gen-0", "sec": "1013", "title": "Projections Into Setback Areas", "summary": "Buildings generally must not be located in a setback area. Eaves may project into a setback max. 0.6 m. Below-grade building portions may extend into a setback only if used as a parking structure. A parking area for a use may be located in a setback to within 1.2 m of any property line. Signs may be located in a setback per Part 3, Division 5."},
{"id": "gen-1", "sec": "1014", "title": "General Landscaped Area Rules", "summary": "S-R IS one of the six Special Purpose districts where landscaping is required by default (\u00a71014(1)(c)) \u2014 don't skip this tab. A landscape plan for the whole development must be submitted with any DP application proposing building/parcel changes, showing existing/proposed topography, vegetation retention, the layout of berms/circulation/retaining walls/screening/slopes/hard & soft surfaces, the plant schedule (species/size/number/type), and the irrigation design; it must be approved by the Development Authority and maintained for the life of the development. Extensive Agriculture, Natural Area, Park, and Urban Agriculture uses are separately exempt from landscaping regardless of district (\u00a71014(2)) \u2014 directly relevant since Natural Area and Park are permitted uses and Urban Agriculture is a discretionary use here."},
{"id": "gen-2", "sec": "1015", "title": "Planting Requirements", "summary": "Applies wherever landscaping is required (see \u00a71014 above \u2014 that's the default in S-R). All plant material must suit Calgary's climate per Canadian Nursery Landscape Association standards. Min. 25% of required trees coniferous. Deciduous trees min. 50 mm caliper (\u226550% at min. 75 mm). Coniferous trees min. 2.0 m height (\u226550% at min. 3.0 m). Shrubs min. 0.6 m height/spread at planting. Soft-surfaced landscaped areas may include Urban Agriculture."},
{"id": "gen-3", "sec": "1016", "title": "Low Water Irrigation System", "summary": "Applies wherever landscaping is required. If a low water irrigation system is used, only trees/shrubs are irrigated (not turf), and plants with similar water needs must be grouped together."},
{"id": "gen-4", "sec": "1017", "title": "Visibility Setback", "summary": "Within a corner visibility triangle, buildings, fences, finished grade, and vegetation must not exceed 0.75 m above the lowest elevation of the street."},
{"id": "gen-5", "sec": "1018", "title": "Mechanical Screening", "summary": "Outdoor mechanical systems/equipment must be screened or camouflaged from view of a public space, or from a residential-district parcel within 30.0 m, using a 1.7 m eye-level sightline."},
{"id": "gen-6", "sec": "1019", "title": "Garbage", "summary": "Garbage containers and waste material must be stored, prior to collection, inside a building or in a Development-Authority-approved enclosure \u2014 not within any setback area. No materials may escape the parcel."},
{"id": "gen-7", "sec": "1019.1", "title": "Solar Collectors", "summary": "Roof- or wall-mounted only. Roof pitch <4:12: max 2.0 m projection. Pitch \u22654:12: max 1.3 m projection, can't overhang the roof edge. Wall-mounted: min. 2.4 m above grade, max 0.6 m projection."},
{"id": "gen-8", "sec": "1019.2", "title": "Wind Energy Conversion System (WECS)", "summary": "Detailed siting, colour, tower type, safety, decommissioning (remove after 6 months' disrepair/abandonment), lighting/signage restrictions, 100 m wetland buffer, max 100 kW capacity, and DP term limits (5 yrs, renewable) apply to WECS Type 1/2 generally \u2014 each set back from the property line by a distance equal to its own total WECS height. S-R-specific: BOTH Wind Energy Conversion System \u2013 Type 1 (\u00a71043(1)(t)) and \u2013 Type 2 (\u00a71043(1)(u)) are listed discretionary uses here, unlike S-CS (Type 1 only). Type 1: min. 60.0 m from a residential district (\u00a71019.2(2)); a biophysical impact assessment (qualified-biologist literature review, field surveys, habitat assessment, Wildlife Guidelines for Alberta Wind Energy Projects) may be required; height fixed at max. 15.0 m by its own use definition (\u00a7333.1), not district-variable. Type 2: min. 550.0 m from a residential district (\u00a71019.2(3)); a biophysical impact assessment of the same scope is mandatory, not discretionary; max. total WECS height 30.0 m in S-R (grouped with S-SPR and S-CI \u2014 NOT the 50.0 m group covering S-UN/S-CRI/S-URP/S-TUC)."},
{"id": "gen-9", "sec": "1020", "title": "Parcel Access", "summary": "All developments must comply with the Controlled Streets Bylaw for access/curb cuts."}
], "district": [
{"id": "dis-0", "sec": "1044-1044.1", "title": "Rules \u2014 Cross-References & Retail and Consumer Service Restriction", "summary": "Confirms all S-R uses must also meet: Part 9, Division 1 General Rules for Special Purpose districts (General tab), Part 3 Rules Governing All Districts (Citywide tab), and the applicable Part 4 Uses And Use Rules for the specific use(s) proposed (Use tab) (\u00a71044). Separately, \u00a71044.1 restricts Retail and Consumer Service \u2014 wherever it becomes available under \u00a71043(2), (3) or (5) \u2014 to operating in conjunction with, and selling only products related to, an Indoor Recreation Facility, Outdoor Recreation Area, Park, Museum, Library or Spectator Sports Facility. See that use's card on the Use tab for the full condition."},
{"id": "dis-1", "sec": "1045", "title": "Use Area", "summary": "No general use-area cap in S-R (\u00a71045(1)), except: Health Care Service and Child Care Service are each capped at a maximum cumulative use area of 1000.0 m\u00b2 district-wide (\u00a71045(2)(a)-(b)) \u2014 see those uses' cards on the Use tab. Restaurant: Food Service Only and Restaurant: Licensed also carry public-area caps that vary by which conditional path makes them available: max. 300.0 m\u00b2 when the restaurant occurs within a building used for an Indoor Recreation Facility, Library, Museum, Performing Arts Centre or Spectator Sports Facility (\u00a71045(3)); max. 150.0 m\u00b2 \u2014 a lower cap \u2014 when it occurs on a parcel used for a Park (\u00a71045(4)). Confirm which path applies before checking the public-area figure."},
{"id": "dis-2", "sec": "1046", "title": "Front Setback Area", "summary": "The front setback area must have a minimum depth of 3.0 metres."},
{"id": "dis-3", "sec": "1047", "title": "Rear Setback Area", "summary": "Minimum depth 6.0 m where the parcel shares a rear property line with a parcel designated as a residential district (\u00a71047(1)(a)); minimum depth 3.0 m where it shares a rear property line with any other District (\u00a71047(1)(b)), or with a lane, LRT corridor, or street (\u00a71047(2))."},
{"id": "dis-4", "sec": "1048", "title": "Side Setback Area", "summary": "Same split as the rear setback: minimum depth 6.0 m where the parcel shares a side property line with a parcel designated as a residential district (\u00a71048(1)(a)); minimum depth 3.0 m where it shares a side property line with any other District (\u00a71048(1)(b)), or with a lane, LRT corridor, or street (\u00a71048(2))."},
{"id": "dis-5", "sec": "1049", "title": "Landscaping In Setback Areas", "summary": "All setback areas \u2014 other than portions specifically required for motor vehicle access, sidewalks, or another Development-Authority-approved purpose \u2014 must be a soft surfaced landscaped area (\u00a71049(1)). Where a setback area shares a property line with an LRT corridor, street, or a parcel designated as a residential district: min. 1.0 tree + 2.0 shrubs per 30.0 m\u00b2, or per 50.0 m\u00b2 where irrigated by a low water irrigation system (\u00a71049(2)). Where a setback area shares a property line with a lane, or a parcel designated as a commercial, industrial or special purpose district: min. 1.0 tree + 2.0 shrubs per 45.0 m\u00b2, or per 60.0 m\u00b2 with low water irrigation (\u00a71049(3)) \u2014 a lower planting density than the residential/street-facing case."},
{"id": "dis-6", "sec": "1050", "title": "Additional Landscaping Requirements", "summary": "All areas of the parcel must be soft surfaced landscaped area unless the Development Authority specifically allows otherwise (\u00a71050(1)). Every building must have at least one sidewalk connecting its public entrance to a public sidewalk (or the nearest street if there is none) (\u00a71050(2)), and at least one sidewalk connecting the parking area to the building's public entrances (\u00a71050(4)); in a multi-use building, every use with its own exterior public entrance needs its own sidewalk connection (\u00a71050(3)). Every sidewalk must be a hard surfaced landscaped area, min. 2.0 m wide, use different surfacing than adjacent parking, and be raised above the parking surface where it runs through a parking area (\u00a71050(5))."},
{"id": "dis-7", "sec": "1051", "title": "Landscaping for Large Parking Area", "summary": "Applies once the total surface area of required drive aisles, motor vehicle parking stalls and vehicular access reaches \u22655000.0 m\u00b2 (\u00a71051(1)) \u2014 S-R's own large-parking-area landscaping provision, more detailed than S-CS's division. Landscaped area within the parking area must equal \u22650.15 m\u00b2 per 1.0 m\u00b2 of that total surface area, as a mix of hard- and soft-surfaced landscaping in islands and strips (\u00a71051(2)). Islands: at the start and end of every parking-stall row, at least one per 20 stalls (max. 20 stalls between islands), min. 12.0 m\u00b2 with one side \u22652.0 m, min. 1.0 tree + 2.0 shrubs, concrete-curbed (\u00a71051(3)). Strips: at least one per 4 rows of stalls (max. 4 rows between strips), perpendicular to the stalls for the full row length, min. 2.0 m deep, min. 1.0 tree per 15.0 m of strip length, concrete-curbed (\u00a71051(4)). An island/strip that would be contiguous with a setback area is not required there (\u00a71051(5)); public-entrance and parking-to-entrance sidewalks required under \u00a71050 may count toward this requirement (\u00a71051(6))."},
{"id": "dis-8", "sec": "1052", "title": "Reductions to Minimum Required Motor Vehicle Parking Stalls", "summary": "Deleted \u2014 the section number that historically covered reductions to minimum required motor vehicle parking stalls in this district carries no current rule; don't rely on a stall-count relaxation from \u00a71052."}

{"id": "cw-0", "sec": "53", "title": "Public Realm Setbacks", "summary": "Check Table 1 in this section for the specific street the parcel fronts. If listed, a Required Setback applies IN ADDITION to any applicable front/side/rear setback, and the Development Authority cannot relax it."},
{"id": "cw-1", "sec": "54", "title": "Airport Vicinity Regulations", "summary": "If the parcel falls within an Airport Vicinity Protection Area (noise/height contours around Calgary Intl. or Springbank), additional height, noise-attenuation construction, and use restrictions apply. Confirm against the current AVPA maps/bylaw."},
{"id": "cw-2", "sec": "55", "title": "Floodway, Flood Fringe & Overland Flow \u2014 Applicability", "summary": "Confirm whether the parcel is mapped within a Floodway, Flood Fringe, or Overland Flow Area (City flood hazard mapping), regardless of district. S-R's own purpose statement (\u00a71041(2)) says the district should NOT be applied to land dedicated as reserve under the Municipal Government Act \u2014 a clean negative, unlike S-CS's more equivocal 'limited application to parcels not designated reserve' wording \u2014 so an S-R site is somewhat less likely to sit on reserve land. That said, a riverside recreation site (Park, Natural Area, or Outdoor Recreation Area \u2014 all listed uses here) is still entirely plausible, so check the floodway/flood fringe mapping regardless of the purpose-statement steer."},
{"id": "cw-3", "sec": "56", "title": "Floodway Regulations", "summary": "If in the Floodway: new development is heavily restricted \u2014 confirm what, if anything, is permitted. Directly relevant to Natural Area, Park, or Outdoor Recreation Area improvements (trails, viewpoints, small maintenance buildings, sports fields) sited near a watercourse."},
{"id": "cw-4", "sec": "57", "title": "New Buildings and Alterations", "summary": "If in the Flood Fringe: specific construction/flood-proofing requirements for new buildings and alterations \u2014 e.g. an Indoor Recreation Facility, Library, Museum, Performing Arts Centre, Spectator Sports Facility, or a Park Maintenance Facility."},
{"id": "cw-5", "sec": "58", "title": "Alterations to the Floodway and Riverbanks", "summary": "Special review requirements for any riverbank or floodway alteration work \u2014 relevant where a Park, Natural Area, or Outdoor Recreation Area's improvements (pathways, trails, sports fields) run along a riverbank."},
{"id": "cw-6", "sec": "61", "title": "Building Design in the Overland Flow Area", "summary": "Specific design requirements if the parcel is within a mapped overland flow area."},
{"id": "cw-7", "sec": "62", "title": "Lighting Requirements", "summary": "General exterior lighting standards apply to the site, subject to the Outdoor Recreation Area / Spectator Sports Facility exemption noted in \u00a765 below."},
{"id": "cw-8", "sec": "63", "title": "Shielding", "summary": "Light fixtures must be shielded to control glare and light spill, particularly toward residential areas."},
{"id": "cw-9", "sec": "64", "title": "Mounting of Fixtures", "summary": "Requirements for how/where lighting fixtures are mounted."},
{"id": "cw-10", "sec": "65", "title": "Height Limits (Lighting)", "summary": "Max. mounting height for an outdoor light fixture >100 W is 7.5 m in all special purpose districts, including S-R (\u00a765(1)(a)) \u2014 EXCEPT there is no maximum mounting height at all for an Outdoor Recreation Area or a Spectator Sports Facility, regardless of district (\u00a765(2)). More directly relevant here than in most Special Purpose districts \u2014 S-R lists BOTH Outdoor Recreation Area and Spectator Sports Facility as discretionary uses (unlike S-CS, which only had Outdoor Recreation Area), so sports-field and stadium lighting exemptions are squarely in scope."},
{"id": "cw-11", "sec": "66", "title": "Canopy Lighting", "summary": "Rules for lighting mounted under canopies. Unlikely to apply \u2014 no canopy-associated use (Gas Bar, Drive Through) is permitted or discretionary in S-R."},
{"id": "cw-12", "sec": "67-72", "title": "Signs \u2014 Purpose, Classification, DP Requirements", "summary": "All signs are classified Class A\u2013G. A Class A sign generally does not require its own DP when Sign \u2013 Class A is a listed use in the District and the sign meets all applicable rules (\u00a777); Class B, C, D, E and F signs generally do (Class F is a listed use here, unlike S-CS). Confirm whether a Comprehensive Sign Program applies to the site."},
{"id": "cw-13", "sec": "73-76", "title": "General Sign Rules, Digital Displays, Maintenance", "summary": "General construction/safety/illumination standards for all signs; extra rules if any sign has a digital display; ongoing maintenance obligation; rules for parcels sharing signage under a related function."},
{"id": "cw-14", "sec": "77-90", "title": "Class A Signs (permitted use in S-R)", "summary": "Includes Address, Art, Banner, Construction, Directional, Election, Flag, Pedestrian, Real Estate, Special Event, Temporary, and Window sign sub-rules. Check whichever sub-types are proposed."},
{"id": "cw-15", "sec": "91-93", "title": "Class B Signs (discretionary use in S-R)", "summary": "Fascia sign rules: attached to and parallel with an exterior wall, projecting max. 0.40 m from the wall."},
{"id": "cw-16", "sec": "94-97", "title": "Class C Signs (discretionary use in S-R)", "summary": "Freestanding sign rules: number allowed, size and height restrictions."},
{"id": "cw-17", "sec": "98-102", "title": "Class D Signs (discretionary use in S-R)", "summary": "Canopy sign and projecting sign rules, including size restrictions."},
{"id": "cw-18", "sec": "103-109", "title": "Class E Signs (discretionary use in S-R)", "summary": "Every Sign \u2013 Class E requires its own DP (\u00a7103). Digital Message Sign (\u00a7104): UNLIKE S-CS/S-SPR/S-CI (each reached only through \u00a7104(2)'s narrower use-association test), S-R is named directly in \u00a7104(1) \u2014 a Digital Message Sign may be approved here generally, without needing to be tied to any specific listed use. The broader-district numeric package applies: max. sign area 5.0 m\u00b2 attached to a building, the lesser of 2.5 m\u00b2 or 30% of window area as a Window Sign, or 50% of the sign area of a Freestanding Sign (\u00a7104(6)(a)); max. 1 sign per parcel (2 on a corner parcel), except copy limited to date/time/temperature/parking/fuel-price/Drive-Through-menu is exempt from that cap (\u00a7104(3)-(4)); must go dark, or show only a black screen, between 11 p.m. and 6 a.m. if within 125.0 m of a building containing a Dwelling Unit (\u00a7104(7)(a) \u2014 note this is a DIFFERENT, S-R-specific window than the narrower 10 p.m.\u20137 a.m. window that applies only to the \u00a7104(2) use-associated districts like S-CS); underground power supply (\u00a7104(10)); DP term capped at 3 years unless copy is limited to date/time/temperature/parking/fuel-price/Drive-Through-menu (\u00a7104(12)); must not be located adjacent to Deerfoot Trail, Spruce Meadows Trail, Stoney Trail, or a provincial highway where copy is visible from it, unless sited per the Table 1.1 area/setback schedule (\u00a7104(5)-(5.2)). Roof Sign (\u00a7107): S-R is NOT one of the districts where a Roof Sign may be approved \u2014 \u00a7107(1) names only S-CI and S-SPR among Special Purpose districts. Confirm whichever other Class E sub-type (Flashing/Animated, Inflatable, Message, Painted Wall, Rotating, Temporary Sign Marker) is actually proposed against its own sub-rule."},
{"id": "cw-19", "sec": "110-115.5", "title": "Class F/G Signs \u2014 Class F is a listed use in S-R, Class G is not", "summary": "UNLIKE S-CS (where Class F wasn't available at all), Sign \u2013 Class F \u2014 Third Party Advertising Sign, no digital display (\u00a7304) \u2014 IS a listed discretionary use in S-R (\u00a71043(1)(q.1)). \u00a7110, which historically set the Class F-specific numeric rules, is itself marked deleted \u2014 so no Class-F-specific size/height/spacing package exists under that section. What still constrains it: \u00a7111's prohibited-locations list (the Stephen Avenue Mall heritage area; a long list of named streets/corridors \u2014 Deerfoot Trail, Crowchild Trail, Sarcee Trail, Barlow Trail, Glenmore Trail segments, Macleod Trail, and many others \u2014 where Third Party Advertising Sign copy visibility is prohibited; min. 450.0 m from major parks/escarpments/pathways/riverbanks/natural areas where copy is visible (\u00a7111(6))), plus the general sign rules in \u00a773-76 and \u00a767-72. Sign \u2013 Class G (Digital Third Party Advertising Sign, \u00a7304.1) is NOT a listed use in S-R \u2014 don't offer it in the use tab."},
{"id": "cw-20", "sec": "116", "title": "Parking \u2014 General Rules", "summary": "Baseline rules governing all required parking/loading."},
{"id": "cw-21", "sec": "117", "title": "Parking Stall Signage", "summary": "Signage requirements for parking stalls (e.g., accessible stalls) \u2014 only relevant where a proposed use actually requires stalls, e.g. Child Care Service's pick-up/drop-off stalls, or a Performing Arts Centre's parking-study-based stalls."},
{"id": "cw-22", "sec": "118", "title": "Location of Parking and Loading Requirements", "summary": "Where parking/loading areas may be sited on the parcel relative to setbacks, streets, and buildings. Natural Area and Park's own use definitions additionally require any parking area to sit min. 3.0 m from the nearest property line."},
{"id": "cw-23", "sec": "119", "title": "Use of Parking and Loading Stalls", "summary": "Restrictions on how required stalls may be used (can't be used for storage, sales display, etc.)."},
{"id": "cw-24", "sec": "120", "title": "Identification of Required Parking/Loading Stalls", "summary": "How required stalls must be marked/identified on-site and on drawings."},
{"id": "cw-25", "sec": "121", "title": "Calculation of Minimum Parking/Loading Stalls", "summary": "Most of S-R's own use definitions explicitly require neither motor vehicle nor bicycle parking stalls: Natural Area (\u00a7243), Park (\u00a7249), Park Maintenance Facility \u2013 Small (\u00a7251) and \u2013 Large (\u00a7250), Power Generation Facility \u2013 Small (\u00a7266) and \u2013 Medium (\u00a7265), Protective and Emergency Service (\u00a7270), Urban Agriculture (\u00a7320.1), Utilities (\u00a7321), Utility Building (\u00a7322), Wind Energy Conversion System \u2013 Type 1 (\u00a7333.1) and \u2013 Type 2 (\u00a7333.2), Special Function \u2013 Class 2 (\u00a7309), and Outdoor Caf\u00e9 (\u00a7247, motor vehicle and both bicycle classes). Outdoor Recreation Area (\u00a7248) and Spectator Sports Facility (\u00a7311) each require no class 1 bicycle stalls; Spectator Sports Facility adds min. 0.5 bicycle stalls \u2013 class 2 per 100.0 m\u00b2 of gross usable floor area (no motor-vehicle formula is stated \u2014 \u00a7311(c) is deleted). The uses with real formulas: Performing Arts Centre (\u00a7255) requires a DP-stage parking study for its motor vehicle count, plus bicycle \u2013 class 2 at 10% of that count; Child Care Service (\u00a7165), Community Recreation Facility (\u00a7169), Conference and Event Facility (\u00a7170.1), Food Kiosk (\u00a7198 \u2014 bicycle class 2 only, no class 1), Health Care Service (\u00a7204), Indoor Recreation Facility (\u00a7211), Library (\u00a7224), Museum (\u00a7242), Service Organization (\u00a7298), and Retail and Consumer Service (\u00a7286.1) each carry their own bicycle-stall formula (see the Use tab cards). Where Part 4 doesn't itself set a motor-vehicle count, \u00a7121.1/Table 1.2 supplies a nominal figure used only to compute the National-Building-Code barrier-free stall count: Group B (4.0 stalls per 100.0 m\u00b2 of gross usable floor area) covers Community Recreation Facility, Food Kiosk, Health Care Service, Indoor Recreation Facility, Library, Museum, Retail and Consumer Service, and Service Organization; Group C (2.85 stalls per 10.0 m\u00b2 of public area) covers Restaurant: Food Service Only, Restaurant: Licensed, and Drinking Establishment \u2013 Large/Medium/Small. Confirm against the schedule for whichever use is actually proposed."},
{"id": "cw-26", "sec": "122", "title": "Standards for Motor Vehicle Parking Stalls", "summary": "Stall/aisle dimensions and layout standards \u2014 relevant mainly to any pick-up/drop-off stall layout for Child Care Service, or to whatever motor-vehicle stall count a Performing Arts Centre's parking study sets."},
{"id": "cw-27", "sec": "123", "title": "Loading Stalls", "summary": "Required loading stall size and count standards. Possibly relevant for a larger Indoor Recreation Facility, Spectator Sports Facility, or Performing Arts Centre with service/loading needs, though most S-R uses are low-intensity."},
{"id": "cw-28", "sec": "124", "title": "Relaxations of Parking/Loading Requirements", "summary": "Circumstances where the Development Authority may relax parking/loading counts."},
{"id": "cw-29", "sec": "124.1", "title": "Parking Stall Exemptions", "summary": "Specific exemptions from providing required parking stalls."},
{"id": "cw-30", "sec": "125", "title": "Bicycle Parking Stalls", "summary": "Citywide bicycle parking standards. S-R uses with their own explicit bicycle-stall formulas: Child Care Service (\u00a7165(f)-(g) \u2014 no class 1; min. 1.0 class 2 per 2000.0 m\u00b2 of gross usable floor area), Community Recreation Facility (\u00a7169(e) \u2014 no class 1; min. 1.0 class 2 per 250.0 m\u00b2), Conference and Event Facility (\u00a7170.1(f)-(g) \u2014 no class 1; min. 1.0 class 2 per 250.0 m\u00b2), Health Care Service (\u00a7204(d)-(e) \u2014 no class 1; min. 1.0 class 2 per 250.0 m\u00b2), Indoor Recreation Facility (\u00a7211 \u2014 no class 1; min. 0.5 class 2 per 100.0 m\u00b2), Library (\u00a7224 \u2014 no class 1; min. 0.5 class 2 per 100.0 m\u00b2), Museum (\u00a7242 \u2014 no class 1; min. 0.5 class 2 per 100.0 m\u00b2), Restaurant: Food Service Only and Restaurant: Licensed (\u00a7278/\u00a7281 \u2014 no class 1; min. 1.0 class 2 per 250.0 m\u00b2 of public area), Retail and Consumer Service (\u00a7286.1 \u2014 no class 1; min. 1.0 class 2 per 250.0 m\u00b2 of gross usable floor area), Drinking Establishment \u2013 Large/Medium/Small (\u00a7182/\u00a7183/\u00a7184 \u2014 no class 1; min. 1.0 class 2 per 250.0 m\u00b2 of public area), Service Organization (\u00a7298 \u2014 no class 1; min. 1.0 class 2 per 250.0 m\u00b2), and Spectator Sports Facility (\u00a7311 \u2014 no class 1; min. 0.5 class 2 per 100.0 m\u00b2). Confirm the rest against the exemptions in each use's own Part 4 definition."},
{"id": "cw-31", "sec": "126", "title": "Motor Vehicle Pick-Up and Drop-Off Stalls", "summary": "Directly relevant only where Child Care Service is added to the review \u2014 its own Part 4 definition (\u00a7165(e)) sets min. 1.0 pick-up/drop-off stall per 10 children. Unlike S-CS (which also had School Authority \u2013 School and School \u2013 Private, each with their own enrolment-scaled pick-up/drop-off counts), no school use is listed in S-R, so Child Care Service is the only S-R use with a pick-up/drop-off requirement to confirm."},
{"id": "cw-32", "sec": "129.1", "title": "Infrastructure Requirements", "summary": "The Development Authority must confirm adequate sewage collection/treatment/disposal, water supply/treatment/distribution, stormwater collection/storage, and road infrastructure capacity to serve the development \u2014 check especially if an Indoor Recreation Facility, Library, Museum, Performing Arts Centre, Spectator Sports Facility, Community Recreation Facility, Child Care Service, or Utilities/Utility Building is proposed."}
